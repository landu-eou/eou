name: ESI Structures (ESI → GH → BQ)

on:
  workflow_dispatch:

# Permisos mínimos:
# - actions:read   -> Guard por REST (listar runs)
# - contents:write -> commit/push de data/esi/structures.jsonl.gz y states/structures.json
# - id-token:write -> WIF/OIDC hacia Google
permissions:
  actions: read
  contents: write
  id-token: write

# Candado oficial: evita solapamiento real.
# Los duplicados/colas "útiles" se cortan con el Guard (abajo).
concurrency:
  group: eou_structures_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # =====================================================================
      # 0) CONFIGURACIÓN (CAMBIAS ESTO POR WORKFLOW)
      # =====================================================================

      # --- Identidad del workflow ---
      WORKFLOW_FILE: eou_structures_esi-gh-bq.yml

      # --- Google Sheets (estado compartido) ---
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "8"

      # --- Locking / planificación ---
      LOCK_TIME: 300 # segundos

      # --- BigQuery (Sandbox) ---
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: structures

      # --- URLs ---
      SDE_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
      STRUCTURES_URL: https://esi.evetech.net/universe/structures/?filter=market

      # --- Paths (repo) ---
      STATE_FILE: states/structures.json
      DATA_FILE: data/esi/structures.jsonl.gz
      TYPES_FILE: data/sde/types.jsonl.gz
      SOLARSYSTEMS_FILE: data/sde/solarsystems.jsonl.gz
      SCRIPT_FILE: scripts/esi/eou_structures_run.py

    steps:
      # =====================================================================
      # 1) GUARD (COMÚN) — decide si este run debe trabajar o salir (busy/cola)
      #    Reglas:
      #    - Si al crearse este run existía otro run anterior aún vivo => este run estaba en cola => salir sin trabajo.
      #    - Si existe un líder (min run_number en queued/in_progress) distinto a este => salir sin trabajo.
      # =====================================================================

      - name: Guard - compute decision
        id: guard_calc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "$proceed" > /tmp/proceed

      - name: Guard - publish decision
        id: guard
        run: |
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"

      - name: Exit if skipped (busy/queued)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping/queued run"
          exit 0

      # =====================================================================
      # 2) CHECKOUT + AUTH GOOGLE (WIF/OIDC) — sin claves
      # =====================================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # =====================================================================
      # 3) LOCK INICIAL (Sheets)
      #    - status=in_progress
      #    - next_run (col D) como VALOR numérico (serial Sheets), no string
      # =====================================================================

      - name: Initial lock (in_progress + next_run as value)
        id: lock
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          # serial = epoch_seconds/86400 + 25569  (origen 1899-12-30)
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # =====================================================================
      # 4) Fase inicio: obtener SDE_NEXT_RUN (sin etag)
      #    - 200  -> continúa y calcula SDE_NEXT_RUN
      #    - 420  -> failed, next_run=now+5m
      #    - 5xx  -> failed, next_run=now+30m (sin tocar last_modified)
      # =====================================================================

      - name: Compute SDE_NEXT_RUN (from SDE Last-Modified)
        id: sde
        run: |
          set -euo pipefail

          hdr="${RUNNER_TEMP}/sde_headers.txt"
          code="$(curl -sS -o /dev/null -D "$hdr" -w "%{http_code}" "${SDE_URL}")"

          now_plus() {
            local seconds="$1"
            local epoch
            epoch="$(date -u -d "+${seconds} seconds" +%s)"
            awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }"
          }

          if [ "$code" = "200" ]; then
            lm="$(grep -i '^last-modified:' "$hdr" | head -n1 | sed -E 's/^[Ll]ast-[Mm]odified:[ ]*//; s/\r$//')"
            if [ -z "${lm}" ]; then
              # Sin Last-Modified: fallo corto conservador
              echo "halt=true" >> "$GITHUB_OUTPUT"
              echo "final_status=failed" >> "$GITHUB_OUTPUT"
              echo "final_next_serial=$(now_plus 300)" >> "$GITHUB_OUTPUT"
              echo "sde_next_serial=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            hhmmss="$(date -u -d "$lm" +%H:%M:%S)"
            now_epoch="$(date -u +%s)"
            today="$(date -u +%Y-%m-%d)"
            target_epoch="$(date -u -d "${today} ${hhmmss}" +%s)"

            if [ "$target_epoch" -le "$now_epoch" ]; then
              target_epoch="$(date -u -d "tomorrow ${hhmmss}" +%s)"
            fi

            rand=$((300 + RANDOM % 601)) # 300..900
            sde_next_epoch=$((target_epoch + 1800 + rand))
            sde_next_serial="$(awk "BEGIN { printf \"%.10f\", (${sde_next_epoch}/86400) + 25569 }")"

            echo "halt=false" >> "$GITHUB_OUTPUT"
            echo "sde_next_serial=${sde_next_serial}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" = "420" ]; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "final_status=failed" >> "$GITHUB_OUTPUT"
            echo "final_next_serial=$(now_plus 300)" >> "$GITHUB_OUTPUT"
            echo "sde_next_serial=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -ge 500 ] 2>/dev/null; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "final_status=failed" >> "$GITHUB_OUTPUT"
            echo "final_next_serial=$(now_plus 1800)" >> "$GITHUB_OUTPUT"
            echo "sde_next_serial=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otros códigos: fallo corto (conservador)
          echo "halt=true" >> "$GITHUB_OUTPUT"
          echo "final_status=failed" >> "$GITHUB_OUTPUT"
          echo "final_next_serial=$(now_plus 300)" >> "$GITHUB_OUTPUT"
          echo "sde_next_serial=" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 5) Fase de listado de estructuras (etag en states/structures.json)
      #    - 200  -> continúa
      #    - 304  -> completed, next_run=SDE_NEXT_RUN, last_modified=header
      #    - 420  -> failed, next_run=now+5m, last_modified=header
      #    - 5xx  -> failed, next_run=now+30m, last_modified=header (si existe)
      # =====================================================================

      - name: List structures (If-None-Match from state etag)
        id: struct_list
        if: steps.sde.outputs.halt != 'true'
        run: |
          set -euo pipefail

          out_json="${RUNNER_TEMP}/structure_list.json"
          hdr="${RUNNER_TEMP}/structures_headers.txt"

          prior_etag=""
          if [ -f "${STATE_FILE}" ]; then
            prior_etag="$(jq -r '.etag // empty' "${STATE_FILE}" || true)"
          fi

          if [ -n "${prior_etag}" ]; then
            if [[ "${prior_etag}" == \"*\" ]]; then
              inm="${prior_etag}"
            else
              inm="\"${prior_etag}\""
            fi
            code="$(curl -sS -o "${out_json}" -D "${hdr}" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: landu-eou/eou (GitHub Actions; ESI Structures)" \
              -H "If-None-Match: ${inm}" \
              "${STRUCTURES_URL}")"
          else
            code="$(curl -sS -o "${out_json}" -D "${hdr}" -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: landu-eou/eou (GitHub Actions; ESI Structures)" \
              "${STRUCTURES_URL}")"
          fi

          to_serial_from_http_date() {
            local http_date="$1"
            if [ -z "${http_date}" ]; then
              echo ""
              return 0
            fi
            local epoch
            epoch="$(date -u -d "${http_date}" +%s 2>/dev/null || true)"
            if [ -z "${epoch}" ]; then
              echo ""
              return 0
            fi
            awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }"
          }

          now_plus() {
            local seconds="$1"
            local epoch
            epoch="$(date -u -d "+${seconds} seconds" +%s)"
            awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }"
          }

          lm="$(grep -i '^last-modified:' "${hdr}" | head -n1 | sed -E 's/^[Ll]ast-[Mm]odified:[ ]*//; s/\r$//')"
          lm_serial="$(to_serial_from_http_date "${lm}")"

          new_etag="$(grep -i '^etag:' "${hdr}" | head -n1 | sed -E 's/^[Ee][Tt][Aa][Gg]:[ ]*//; s/\r$//')"
          new_etag_clean="${new_etag%\"}"
          new_etag_clean="${new_etag_clean#\"}"

          echo "last_modified_serial=${lm_serial}" >> "$GITHUB_OUTPUT"
          echo "prior_etag=${prior_etag}" >> "$GITHUB_OUTPUT"
          echo "new_etag=${new_etag_clean}" >> "$GITHUB_OUTPUT"
          echo "list_path=${out_json}" >> "$GITHUB_OUTPUT"

          if [ "$code" = "304" ]; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "final_status=completed" >> "$GITHUB_OUTPUT"
            echo "final_next_serial=${{ steps.sde.outputs.sde_next_serial }}" >> "$GITHUB_OUTPUT"
            echo "write_last_modified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" = "200" ]; then
            echo "halt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" = "420" ]; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "final_status=failed" >> "$GITHUB_OUTPUT"
            echo "final_next_serial=$(now_plus 300)" >> "$GITHUB_OUTPUT"
            echo "write_last_modified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -ge 500 ] 2>/dev/null; then
            echo "halt=true" >> "$GITHUB_OUTPUT"
            echo "final_status=failed" >> "$GITHUB_OUTPUT"
            echo "final_next_serial=$(now_plus 1800)" >> "$GITHUB_OUTPUT"
            echo "write_last_modified=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "halt=true" >> "$GITHUB_OUTPUT"
          echo "final_status=failed" >> "$GITHUB_OUTPUT"
          echo "final_next_serial=$(now_plus 300)" >> "$GITHUB_OUTPUT"
          echo "write_last_modified=true" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 6) Fases: reconciliación + enriquecimiento + volcados (script)
      # =====================================================================

      - name: Setup Python
        if: steps.struct_list.outputs.halt != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (minimal)
        if: steps.struct_list.outputs.halt != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests google-cloud-bigquery

      - name: Setup gcloud (only when needed)
        if: steps.struct_list.outputs.halt != 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run structures objective (ESI → gzip JSONL → BQ)
        id: run_structures
        if: steps.struct_list.outputs.halt != 'true'
        env:
          # Tokens de ESI (solo lectura)
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}

          # Inputs
          STRUCTURE_LIST_JSON: ${{ steps.struct_list.outputs.list_path }}
          STRUCTURES_LIST_ETAG: ${{ steps.struct_list.outputs.new_etag }}
          PRIOR_LIST_ETAG: ${{ steps.struct_list.outputs.prior_etag }}

          # Paths
          STATE_FILE: ${{ env.STATE_FILE }}
          DATA_FILE: ${{ env.DATA_FILE }}
          TYPES_FILE: ${{ env.TYPES_FILE }}
          SOLARSYSTEMS_FILE: ${{ env.SOLARSYSTEMS_FILE }}

          # BQ
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          BQ_DATASET: ${{ env.BQ_DATASET }}
          BQ_TABLE: ${{ env.BQ_TABLE }}

          # ESI
          ESI_USER_AGENT: landu-eou/eou (GitHub Actions; ESI Structures)
        run: |
          set -euo pipefail
          python "${SCRIPT_FILE}"

      - name: Commit & push changes (data/state)
        if: steps.run_structures.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DATA_FILE}" "${STATE_FILE}"
          git commit -m "EOU: update structures data/state"
          git push

      # =====================================================================
      # 7) FINALIZE (Sheets) — status + next_run + last_modified (si aplica)
      #    - No lee Sheets: solo batchUpdate
      # =====================================================================

      - name: Finalize (write status/next_run/last_modified)
        if: always()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          ROW: ${{ env.SHEETS_WORKFLOW_ROW }}

          SDE_HALT: ${{ steps.sde.outputs.halt }}
          SDE_FINAL_STATUS: ${{ steps.sde.outputs.final_status }}
          SDE_FINAL_NEXT_SERIAL: ${{ steps.sde.outputs.final_next_serial }}
          SDE_NEXT_SERIAL: ${{ steps.sde.outputs.sde_next_serial }}

          LIST_HALT: ${{ steps.struct_list.outputs.halt }}
          LIST_FINAL_STATUS: ${{ steps.struct_list.outputs.final_status }}
          LIST_FINAL_NEXT_SERIAL: ${{ steps.struct_list.outputs.final_next_serial }}
          LIST_LASTMOD_SERIAL: ${{ steps.struct_list.outputs.last_modified_serial }}
          LIST_WRITE_LASTMOD: ${{ steps.struct_list.outputs.write_last_modified }}

          SCRIPT_OUTCOME: ${{ steps.run_structures.outcome }}
        run: |
          set -euo pipefail

          now_plus() {
            local seconds="$1"
            local epoch
            epoch="$(date -u -d "+${seconds} seconds" +%s)"
            awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }"
          }

          final_status=""
          final_next_serial=""
          final_lastmod_serial=""
          write_lastmod="false"

          if [ "${SDE_HALT}" = "true" ]; then
            final_status="${SDE_FINAL_STATUS:-failed}"
            final_next_serial="${SDE_FINAL_NEXT_SERIAL:-$(now_plus 300)}"
            write_lastmod="false"
          elif [ "${LIST_HALT}" = "true" ]; then
            final_status="${LIST_FINAL_STATUS:-failed}"
            final_next_serial="${LIST_FINAL_NEXT_SERIAL:-$(now_plus 300)}"
            final_lastmod_serial="${LIST_LASTMOD_SERIAL:-}"
            write_lastmod="${LIST_WRITE_LASTMOD:-false}"
          else
            final_lastmod_serial="${LIST_LASTMOD_SERIAL:-}"
            if [ "${SCRIPT_OUTCOME}" = "success" ]; then
              final_status="completed"
              final_next_serial="${SDE_NEXT_SERIAL}"
            else
              final_status="failed"
              final_next_serial="$(now_plus 300)"
            fi
            if [ -n "${final_lastmod_serial}" ]; then
              write_lastmod="true"
            else
              write_lastmod="false"
            fi
          fi

          if [ -n "${final_next_serial}" ]; then
            next_json="${final_next_serial}"
          else
            next_json="$(now_plus 300)"
          fi

          if [ "${write_lastmod}" = "true" ] && [ -n "${final_lastmod_serial}" ]; then
            payload="$(jq -n \
              --arg tab "${SHEET_TAB}" \
              --arg row "${ROW}" \
              --arg status "${final_status}" \
              --argjson next "${next_json}" \
              --argjson lm "${final_lastmod_serial}" \
              '{
                valueInputOption:"RAW",
                data:[
                  {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
                  {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]},
                  {range:($tab+"!I"+$row+":I"+$row), values:[[ $lm ]]}
                ]
              }')"
          else
            payload="$(jq -n \
              --arg tab "${SHEET_TAB}" \
              --arg row "${ROW}" \
              --arg status "${final_status}" \
              --argjson next "${next_json}" \
              '{
                valueInputOption:"RAW",
                data:[
                  {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
                  {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
                ]
              }')"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "${payload}"
