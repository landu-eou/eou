name: child_test_5m

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Auth to Google via WIF (access token for Sheets)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Update workflows row 2 (A2/B2) - start + anti-overlap + final
        env:
          SHEET_ID: ${{ secrets.ORCH_SPREADSHEET_ID }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          start_epoch="$(date -u +%s)"
          start_iso="$(date -u -d "@${start_epoch}" +"%Y-%m-%dT%H:%M:%SZ")"
          tmp_next_epoch="$((start_epoch + 300))"
          tmp_next_iso="$(date -u -d "@${tmp_next_epoch}" +"%Y-%m-%dT%H:%M:%SZ")"

          # 1) last_run (A2) - immediately
          curl -sS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/workflows%21A2?valueInputOption=RAW" \
            --data "{\"values\":[[\"${start_iso}\"]]}"

          # 2) next_run = last_run + 300s (B2) - immediately after
          curl -sS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/workflows%21B2?valueInputOption=RAW" \
            --data "{\"values\":[[\"${tmp_next_iso}\"]]}"

          # --- do work (simple) ---
          sleep 2

          # 3) final next_run: next multiple of 300s (5 minutes), anchored to epoch
          final_next_epoch="$(( (start_epoch/300 + 1) * 300 ))"
          final_next_iso="$(date -u -d "@${final_next_epoch}" +"%Y-%m-%dT%H:%M:%SZ")"

          curl -sS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/workflows%21B2?valueInputOption=RAW" \
            --data "{\"values\":[[\"${final_next_iso}\"]]}"
