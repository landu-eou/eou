name: after_sde

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all derived route databases even when source SHA values are unchanged
        required: false
        default: false
        type: boolean
  repository_dispatch:
  workflow_run:
    workflows:
      - Capture EVE SDE
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: after-sde
  queue: max

jobs:
  build-jump-routes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_DERIVED: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    permissions:
      contents: write
    steps:
      - name: Check out the latest main, including the completed SDE capture
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build jump graph, retrying transient failures
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Jump graph build attempt ${attempt}/3"
            if [ "$FORCE_DERIVED" = "true" ]; then
              build_args=(--force)
              echo "Force mode enabled for derived databases."
            else
              build_args=()
            fi
            if python scripts/build_jump_routes.py "${build_args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Build failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Jump graph build failed after three attempts." >&2
          exit 1

      - name: Build station and stargate distances after jump graph, retrying transient failures
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Station/stargate distance build attempt ${attempt}/3"
            if [ "$FORCE_DERIVED" = "true" ]; then
              build_args=(--force)
            else
              build_args=()
            fi
            if python scripts/build_stationgate_routes.py "${build_args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Build failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "Station/stargate distance build failed after three attempts." >&2
          exit 1

      - name: Commit and push derived SQLite snapshots
        shell: bash
        run: |
          git add -A data/esi/uni/ data/derived/uni/
          if git diff --cached --quiet; then
            echo "Derived SQLite snapshots are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update derived route databases"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            for source in mapSolarSystems mapStargates npcStations; do
              local_hash=$(sha256sum "data/sde/${source}.db" | cut -d ' ' -f 1)
              remote_hash=$(git show "origin/main:data/sde/${source}.db" | sha256sum | cut -d ' ' -f 1)
              if [ "$local_hash" != "$remote_hash" ]; then
                echo "${source}.db changed during generation; leaving the newer SDE for its after_sde run." >&2
                exit 1
              fi
            done

            if ! git rebase origin/main; then
              git rebase --abort
              if [ "$attempt" -eq 5 ]; then
                echo "Could not rebase the derived route commit onto main." >&2
                exit 1
              fi
              sleep $((attempt * 5))
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Could not publish derived route databases after five attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
