name: ESI Structures (ESI → GH → BQ)

on:
  workflow_dispatch:

# Permisos mínimos:
# - actions:read   -> Guard por REST (listar runs)
# - contents:write -> commit/push de data/esi/structures.jsonl.gz y states/structures.json
# - id-token:write -> WIF/OIDC hacia Google
permissions:
  actions: read
  contents: write
  id-token: write

# Candado oficial: evita solapamiento real.
# Los duplicados/colas “útiles” se cortan con el Guard.
concurrency:
  group: eou_structures_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # =====================================================================
      # 0) CONFIG
      # =====================================================================
      WORKFLOW_FILE: eou_structures_esi-gh-bq.yml

      # Sheets (tabla de control)
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "8"

      # Locking
      LOCK_TIME: 300 # segundos

      # Google / BigQuery
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: structures

      # Paths (repo)
      STATE_ETAG_PATH: states/structures.json
      DATA_STRUCTURES_PATH: data/esi/structures.jsonl.gz
      SDE_SOLARSYSTEMS_PATH: data/sde/solarsystems.jsonl.gz
      SDE_TYPES_PATH: data/sde/types.jsonl.gz

      # URLs
      SDE_ZIP_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
      ESI_STRUCTURES_LIST_URL: https://esi.evetech.net/universe/structures/?filter=market
      ESI_STRUCTURE_DETAIL_URL_TEMPLATE: https://esi.evetech.net/universe/structures/{structure_id}/

      # Auth token selection
      PRIMARY_CHAR_ID: "2124070822"

      # Retries globales para 401/420
      RETRY_BUDGET: "3"

    steps:
      # =====================================================================
      # 1) GUARD — decide si este run debe trabajar o salir (busy)
      # =====================================================================
      - name: Guard - compute decision
        id: guard_calc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "$proceed" > /tmp/proceed

      - name: Guard - publish decision
        id: guard
        run: |
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 2) BUSY EXIT — si no procede, salir sin tocar nada
      # =====================================================================
      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # =====================================================================
      # 3) CHECKOUT — debe ir ANTES de auth@v2 cuando create_credentials_file=true
      # =====================================================================
      - name: Checkout
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4

      # =====================================================================
      # 4) AUTH GOOGLE — WIF/OIDC (sin claves)
      # =====================================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        if: steps.guard.outputs.proceed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # =====================================================================
      # 5) TOOLING
      # =====================================================================
      - name: Setup Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # FIX A: setup-gcloud no soporta export_default_credentials (se eliminó)
      - name: Setup gcloud
        if: steps.guard.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 390.0.0'

      # =====================================================================
      # 6) LOCK INICIAL
      #    - status=in_progress
      #    - next_run (col D) como VALOR numérico (serial Sheets), no string
      # =====================================================================
      - name: Initial lock (in_progress + next_run as value)
        if: steps.guard.outputs.proceed == 'true' && steps.gcp_auth.outcome == 'success'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # =====================================================================
      # 7) OBJETIVO — ESI → (GH files) → BQ
      # =====================================================================
      - name: Run structures pipeline
        id: structures
        if: steps.guard.outputs.proceed == 'true'
        env:
          # Access tokens (NO imprimir)
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_structures_run.py

      # =====================================================================
      # 8) COMMIT/PUSH — solo si hubo cambios y la fase objetivo fue OK
      # =====================================================================
      - name: Commit and push changes
        id: git_push
        if: steps.guard.outputs.proceed == 'true' && steps.structures.outcome == 'success' && steps.structures.outputs.repo_dirty == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DATA_STRUCTURES_PATH}" "${STATE_ETAG_PATH}" || true

          if git diff --cached --quiet; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "EOU: update structures" \
            -m "Workflow: ${WORKFLOW_FILE}" \
            -m "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for i in 1 2 3; do
            git pull --rebase || true
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((15 + RANDOM % 20))
          done

          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # =====================================================================
      # 9) DECISIÓN FINAL PARA SHEETS (incluye override si git push falla)
      # =====================================================================
      - name: Compute final decision
        id: final
        if: always() && steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          status="${{ steps.structures.outputs.status }}"
          next_epoch="${{ steps.structures.outputs.next_run_epoch }}"
          lm_epoch="${{ steps.structures.outputs.last_modified_epoch }}"
          write_lm="${{ steps.structures.outputs.write_last_modified }}"

          if [ -z "$status" ] || [ -z "$next_epoch" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
            write_lm="false"
            lm_epoch=""
          fi

          if [ "${{ steps.git_push.outcome }}" = "failure" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "next_run_epoch=${next_epoch}" >> "$GITHUB_OUTPUT"
          echo "write_last_modified=${write_lm}" >> "$GITHUB_OUTPUT"
          echo "last_modified_epoch=${lm_epoch}" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 10) FINALIZE — escribe status/next_run/last_modified en Sheets (sin leer)
      # =====================================================================
      - name: Finalize (status + next_run [+ last_modified])
        if: always() && steps.guard.outputs.proceed == 'true' && steps.gcp_auth.outcome == 'success'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          status="${{ steps.final.outputs.status }}"
          next_epoch="${{ steps.final.outputs.next_run_epoch }}"
          write_lm="${{ steps.final.outputs.write_last_modified }}"
          lm_epoch="${{ steps.final.outputs.last_modified_epoch }}"

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"

          data='[
            {"range":"'"${SHEET_TAB}!B${row}:B${row}"'","values":[["'"${status}"'"]]},
            {"range":"'"${SHEET_TAB}!D${row}:D${row}"'","values":[['"${next_serial}"']]}
          ]'

          if [ "$write_lm" = "true" ] && [ -n "$lm_epoch" ]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${lm_epoch}/86400) + 25569 }")"
            data="${data%]} , {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}]"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{\"valueInputOption\":\"RAW\",\"data\":${data}}"

      # =====================================================================
      # 11) FALLA EL JOB SI EL RESULTADO FINAL ES failed
      # =====================================================================
      - name: Fail job if final status is failed
        if: always() && steps.guard.outputs.proceed == 'true' && steps.final.outputs.status == 'failed'
        run: |
          exit 1
