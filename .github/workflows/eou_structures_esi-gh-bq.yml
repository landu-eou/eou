name: ESI Structures (ESI → GH → BQ)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_structures_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      WORKFLOW_FILE: eou_structures_esi-gh-bq.yml

      # -----------------------
      # Sheets (solo escritura)
      # -----------------------
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "8"
      LOCK_TIME: 300

      # -----------------------
      # Google / BigQuery
      # -----------------------
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: structures
      # Importante: dataset EU (según tu propio panel). Pasamos location explícita para evitar mismatch.
      BQ_LOCATION: EU

      # -----------------------
      # Paths en repo
      # -----------------------
      STATE_ETAG_PATH: states/structures.json
      DATA_STRUCTURES_PATH: data/esi/structures.jsonl.gz
      SDE_SOLARSYSTEMS_PATH: data/sde/solarsystems.jsonl.gz
      SDE_TYPES_PATH: data/sde/types.jsonl.gz

      # -----------------------
      # URLs
      # -----------------------
      SDE_ZIP_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
      ESI_STRUCTURES_LIST_URL: https://esi.evetech.net/universe/structures/?filter=market
      ESI_STRUCTURE_DETAIL_URL_TEMPLATE: https://esi.evetech.net/universe/structures/{structure_id}/

      # -----------------------
      # Token selection + retries globales 401/420
      # -----------------------
      PRIMARY_CHAR_ID: "2124070822"
      RETRY_BUDGET: "3"

      # -----------------------
      # ESI sustainability knobs
      # -----------------------
      ESI_MAX_RPM: "60"
      ESI_ERR_REMAIN_SOFT: "20"
      ESI_ERR_REMAIN_HARD: "5"

    steps:
      - name: Guard (anti-cola) — exit if another run is active / leader is different
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          THIS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          api_base="https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=20"

          inprog_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api_base}&status=in_progress")"
          inprog_other="$(echo "$inprog_json" | jq --arg rid "$RUN_ID" '[.workflow_runs[]? | select(.id != ($rid|tonumber))] | length')"

          if [ "${inprog_other}" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          queued_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api_base}&status=queued")"
          leader="$(echo "$queued_json" | jq '[.workflow_runs[]? | .run_number] | (min // empty)')"

          if [ -n "${leader}" ] && [ "${leader}" != "null" ] && [ "${leader}" != "${THIS_RUN_NUMBER}" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Exit if busy
        if: steps.guard.outputs.proceed != 'true'
        run: |
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 390.0.0'

      - name: Lock (in_progress + next_run as value)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"
          payload="$(jq -cn --arg tab "$SHEET_TAB" --arg row "$row" --arg status "in_progress" --argjson serial "$serial" '{
            valueInputOption:"RAW",
            data:[
              {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
              {range:($tab+"!D"+$row+":D"+$row), values:[[ $serial ]]}
            ]
          }')"
          curl -fsSL -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" -d "$payload"

      - name: Run structures pipeline
        id: structures
        env:
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_structures_run.py

      - name: Commit & push (only if repo_dirty)
        id: git_push
        if: steps.structures.outputs.repo_dirty == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DATA_STRUCTURES_PATH}" "${STATE_ETAG_PATH}" || true
          if git diff --cached --quiet; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "EOU: update structures" -m "Workflow: ${WORKFLOW_FILE}" -m "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase || true
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((12 + RANDOM % 18))
          done
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Finalize Sheets (status + next_run [+ last_modified])
        if: always()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          status="${{ steps.structures.outputs.status }}"
          next_epoch="${{ steps.structures.outputs.next_run_epoch }}"
          write_lm="${{ steps.structures.outputs.write_last_modified }}"
          lm_epoch="${{ steps.structures.outputs.last_modified_epoch }}"

          # --- Diagnóstico mínimo (solo si falla) ---
          fail_reason="${{ steps.structures.outputs.fail_reason }}"
          fail_stage="${{ steps.structures.outputs.fail_stage }}"
          sde_status="${{ steps.structures.outputs.http_sde_status }}"
          list_status="${{ steps.structures.outputs.http_list_status }}"
          retry_used="${{ steps.structures.outputs.retry_used }}"
          enrich_total="${{ steps.structures.outputs.enrich_total }}"
          enrich_401="${{ steps.structures.outputs.enrich_401 }}"
          enrich_420="${{ steps.structures.outputs.enrich_420 }}"
          bq_stage="${{ steps.structures.outputs.stage_bq }}"
          data_stage="${{ steps.structures.outputs.stage_data }}"
          state_stage="${{ steps.structures.outputs.stage_state_update }}"

          # --- Diagnóstico BQ (si aplica) ---
          bq_step="${{ steps.structures.outputs.bq_step }}"
          bq_rc="${{ steps.structures.outputs.bq_rc }}"
          bq_location="${{ steps.structures.outputs.bq_location }}"
          bq_cmd="${{ steps.structures.outputs.bq_cmd }}"
          bq_stderr_snip="${{ steps.structures.outputs.bq_stderr_snip }}"

          if [ -z "${status}" ] || [ -z "${next_epoch}" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
            write_lm="false"
            lm_epoch=""
          fi

          if [ "${{ steps.git_push.outcome }}" = "failure" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
          fi

          if [ "${status}" = "failed" ]; then
            echo "diag fail_reason=${fail_reason} fail_stage=${fail_stage} sde=${sde_status} list=${list_status} retry_used=${retry_used} enrich_total=${enrich_total} enrich401=${enrich_401} enrich420=${enrich_420} stages(bq,data,state)=(${bq_stage},${data_stage},${state_stage})"
            if [ "${fail_stage}" = "bq" ] || [ "${fail_reason}" = "BQ_FAIL" ]; then
              echo "diag_bq step=${bq_step} rc=${bq_rc} location=${bq_location} cmd=${bq_cmd} stderr=${bq_stderr_snip}"
            fi
          fi

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"

          if [ "${write_lm}" = "true" ] && [ -n "${lm_epoch}" ]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${lm_epoch}/86400) + 25569 }")"
            payload="$(jq -cn --arg tab "$SHEET_TAB" --arg row "$row" --arg status "$status" --argjson nexts "$next_serial" --argjson lms "$lm_serial" '{
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $nexts ]]},
                {range:($tab+"!I"+$row+":I"+$row), values:[[ $lms ]]}
              ]
            }')"
          else
            payload="$(jq -cn --arg tab "$SHEET_TAB" --arg row "$row" --arg status "$status" --argjson nexts "$next_serial" '{
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $nexts ]]}
              ]
            }')"
          fi

          curl -fsSL -X POST -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" -d "$payload"

          if [ "${status}" = "failed" ]; then
            exit 1
          fi
