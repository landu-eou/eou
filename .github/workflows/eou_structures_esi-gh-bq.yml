name: ESI Structures (ESI → GH → BQ)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_structures_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Config
      WORKFLOW_FILE: eou_structures_esi-gh-bq.yml

      # Sheets (solo escritura)
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "8"
      LOCK_TIME: 300

      # Google / BigQuery
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: structures

      # Paths
      STATE_ETAG_PATH: states/structures.json
      DATA_STRUCTURES_PATH: data/esi/structures.jsonl.gz
      SDE_SOLARSYSTEMS_PATH: data/sde/solarsystems.jsonl.gz
      SDE_TYPES_PATH: data/sde/types.jsonl.gz

      # URLs
      SDE_ZIP_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
      ESI_STRUCTURES_LIST_URL: https://esi.evetech.net/universe/structures/?filter=market
      ESI_STRUCTURE_DETAIL_URL_TEMPLATE: https://esi.evetech.net/universe/structures/{structure_id}/

      # Auth token selection
      PRIMARY_CHAR_ID: "2124070822"
      RETRY_BUDGET: "3"

      # ESI pacing (operacional)
      # - BASE_RPM: límite inicial conservador
      # - MIN_RPM: mínimo al que degradar si hay señales de riesgo
      # - SOFT_REMAIN: si X-ESI-Error-Limit-Remain baja de esto, frenamos más
      ESI_BASE_RPM: "60"
      ESI_MIN_RPM: "20"
      ESI_SOFT_REMAIN: "15"

    steps:
      # 1) Guard anti-cola (barato: 1 llamada, sin jq)
      - name: Guard (anti-queue)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
          THIS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Solo necesitamos runs vivos (queued o in_progress) para decidir líder.
          # API oficial: workflow runs. :contentReference[oaicite:4]{index=4}
          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=20"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          python3 - <<'PY' > /tmp/proceed
          import json, os, sys
          this = int(os.environ["THIS_RUN_NUMBER"])
          data = json.loads(sys.stdin.read())
          runs = data.get("workflow_runs") or []
          
          alive = [r for r in runs if r.get("status") in ("queued","in_progress")]
          leader = min([r.get("run_number") for r in alive if isinstance(r.get("run_number"), int)], default=this)
          
          # Procede solo si eres el líder vivo (evita colas trabajando).
          print("true" if this == leader else "false")
          PY
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"
        shell: bash
        stdin: ${{ steps.guard.inputs.json }}

      - name: Exit if busy
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped (not leader)."
          exit 0

      # 2) Checkout mínimo (menos red/IO)
      - name: Checkout (shallow + sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/esi/eou_structures_run.py
            states/structures.json
            data/esi/structures.jsonl.gz
            data/sde/solarsystems.jsonl.gz
            data/sde/types.jsonl.gz
          sparse-checkout-cone-mode: false

      # 3) Auth Google WIF/OIDC
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # 4) gcloud + bq (sin fijar version salvo que lo necesites)
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 390.0.0'

      # 5) Lock inicial (solo escritura a Sheets)
      - name: Initial lock (in_progress)
        if: steps.gcp_auth.outcome == 'success'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          # RAW = se guarda tal cual, números siguen siendo números. :contentReference[oaicite:5]{index=5}
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # 6) Run pipeline (el script escribe summary y outputs)
      - name: Run structures pipeline
        id: structures
        env:
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          python3 scripts/esi/eou_structures_run.py

      # 7) Commit/push solo si dirty
      - name: Commit and push changes
        id: git_push
        if: steps.structures.outcome == 'success' && steps.structures.outputs.repo_dirty == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${DATA_STRUCTURES_PATH}" "${STATE_ETAG_PATH}" || true
          if git diff --cached --quiet; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "EOU: update structures" -m "Workflow: ${WORKFLOW_FILE}" -m "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for i in 1 2 3; do
            git pull --rebase || true
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((15 + RANDOM % 20))
          done

          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # 8) Decisión final (override si push falló)
      - name: Compute final decision
        id: final
        if: always()
        run: |
          set -euo pipefail
          status="${{ steps.structures.outputs.status }}"
          next_epoch="${{ steps.structures.outputs.next_run_epoch }}"
          lm_epoch="${{ steps.structures.outputs.last_modified_epoch }}"
          write_lm="${{ steps.structures.outputs.write_last_modified }}"

          if [ -z "$status" ] || [ -z "$next_epoch" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
            write_lm="false"
            lm_epoch=""
          fi

          if [ "${{ steps.git_push.outcome }}" = "failure" ]; then
            status="failed"
            next_epoch="$(date -u -d "+30 minutes" +%s)"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "next_run_epoch=${next_epoch}" >> "$GITHUB_OUTPUT"
          echo "write_last_modified=${write_lm}" >> "$GITHUB_OUTPUT"
          echo "last_modified_epoch=${lm_epoch}" >> "$GITHUB_OUTPUT"

      # 9) Finalize Sheets (solo escritura)
      - name: Finalize Sheets
        if: always() && steps.gcp_auth.outcome == 'success'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          status="${{ steps.final.outputs.status }}"
          next_epoch="${{ steps.final.outputs.next_run_epoch }}"
          write_lm="${{ steps.final.outputs.write_last_modified }}"
          lm_epoch="${{ steps.final.outputs.last_modified_epoch }}"

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"
          data='[
            {"range":"'"${SHEET_TAB}!B${row}:B${row}"'","values":[["'"${status}"'"]]},
            {"range":"'"${SHEET_TAB}!D${row}:D${row}"'","values":[['"${next_serial}"']]}
          ]'

          if [ "$write_lm" = "true" ] && [ -n "$lm_epoch" ]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${lm_epoch}/86400) + 25569 }")"
            data="${data%]} , {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}]"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{\"valueInputOption\":\"RAW\",\"data\":${data}}"

      - name: Fail job if final status is failed
        if: always() && steps.final.outputs.status == 'failed'
        run: exit 1
