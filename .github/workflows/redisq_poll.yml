name: RedisQ Poll (90s) → Repo JSON

on:
  workflow_dispatch:
    inputs:
      poll_interval_seconds:
        description: "TiempoToWait (ttw) en RedisQ (1..10). Controla cuánto espera el servidor por kill antes de devolver null."
        required: false
        type: number
        default: 3

permissions:
  contents: write

concurrency:
  group: redisq_poll_90s
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll RedisQ for 90 seconds and write kills to repo
        env:
          QUEUE_ID: "sarandonga"
          POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
          DURATION_SECONDS: "90"
        run: |
          python scripts/redisq_poll.py

      - name: Commit & Push (if changes)
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add redisq_kills
            git commit -m "RedisQ: new kills"
            git push
          else
            echo "No changes to commit."
          fi
