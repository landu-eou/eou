name: Route Cover (SDE → GH)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_route_cover_sde_to_gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build route cover from SDE
        run: |
          python -u route_test/build_route_cover.py

      - name: Commit & push if changed
        run: |
          set -e

          # Solo consideramos cambios dentro de route_test/
          if [ -z "$(git status --porcelain -- route_test/)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- route_test/route.jsonl route_test/route_names.json route_test/route.meta.json || true
          git commit -m "route_test: rebuild stargate cover route"
          git push
