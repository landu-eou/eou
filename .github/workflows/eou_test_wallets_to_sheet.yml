name: Test Wallet Balances (ESI → Sheets)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # WIF/OIDC para Google

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # Sheet destino
      SPREADSHEET_ID: "1LDi6LFPYO99Rz6OBnwt58dI60aWyw1OFLEcnyt0yHAA"
      TAB_NAME: "test"

      # ESI
      ESI_BASE: "https://esi.evetech.net/latest"
      ESI_DATASOURCE: "tranquility"
      USER_AGENT: "EOU (GitHub Actions) - wallet test"

    steps:
      - id: gcp_auth
        name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Fetch wallets from ESI and write to Sheets
        env:
          # Datos del repo
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}
          EOU_ACCESS_TOKENS: ${{ secrets.EOU_ACCESS_TOKENS }}

          # Token Google (WIF)
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          spreadsheet_id = os.environ["SPREADSHEET_ID"]
          tab = os.environ["TAB_NAME"]
          esi_base = os.environ["ESI_BASE"].rstrip("/")
          datasource = os.environ["ESI_DATASOURCE"]
          user_agent = os.environ["USER_AGENT"]
          gtok = os.environ.get("GOOGLE_ACCESS_TOKEN", "").strip()

          refresh_raw = os.environ.get("EOU_REFRESH_TOKENS", "").strip()
          access_raw  = os.environ.get("EOU_ACCESS_TOKENS", "").strip()

          if not gtok:
            print("Missing GOOGLE_ACCESS_TOKEN", file=sys.stderr)
            sys.exit(2)
          if not refresh_raw:
            print("Missing EOU_REFRESH_TOKENS", file=sys.stderr)
            sys.exit(2)
          if not access_raw:
            print("Missing EOU_ACCESS_TOKENS (run refresh workflow first)", file=sys.stderr)
            sys.exit(2)

          try:
            refresh_map = json.loads(refresh_raw)
            if not isinstance(refresh_map, dict) or not refresh_map:
              raise ValueError("EOU_REFRESH_TOKENS must be a non-empty object")
          except Exception as e:
            print(f"Invalid EOU_REFRESH_TOKENS JSON: {e}", file=sys.stderr)
            sys.exit(2)

          try:
            access_map = json.loads(access_raw)
            if not isinstance(access_map, dict) or not access_map:
              raise ValueError("EOU_ACCESS_TOKENS must be a non-empty object")
          except Exception as e:
            print(f"Invalid EOU_ACCESS_TOKENS JSON: {e}", file=sys.stderr)
            sys.exit(2)

          def sort_key(k: str):
            try:
              return (0, int(str(k)))
            except Exception:
              return (1, str(k))

          rows = []
          ok = 0
          fail = 0

          # Construimos filas para A-D
          for char_id in sorted(refresh_map.keys(), key=sort_key):
            meta = refresh_map.get(char_id, {}) if isinstance(refresh_map.get(char_id), dict) else {}
            account = str(meta.get("account", "")).strip()
            char_name = str(meta.get("char_name", "")).strip()

            entry = access_map.get(str(char_id))
            if not isinstance(entry, dict) or not entry.get("access_token"):
              # No token -> error en D
              rows.append([account, char_name, str(char_id), "NO_ACCESS_TOKEN"])
              fail += 1
              continue

            token = entry["access_token"]

            # ESI: GET /characters/{character_id}/wallet/
            url = f"{esi_base}/characters/{char_id}/wallet/?datasource={datasource}"
            req = urllib.request.Request(
              url,
              method="GET",
              headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/json",
                "User-Agent": user_agent,
              },
            )

            wallet_val = None
            try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                body = resp.read()
              # El endpoint devuelve un número (float)
              wallet_val = json.loads(body.decode("utf-8"))
              ok += 1
            except urllib.error.HTTPError as e:
              # No imprimir body (podría contener info). Solo código.
              wallet_val = f"ERR_HTTP_{e.code}"
              fail += 1
            except Exception as e:
              wallet_val = f"ERR_{type(e).__name__}"
              fail += 1

            rows.append([account, char_name, str(char_id), wallet_val])

          # Escribir en Sheets: rango A2:D (tantas filas como personajes)
          # Usamos RAW para no “interpretar” strings.
          start_row = 2
          end_row = start_row + len(rows) - 1
          rng = f"{tab}!A{start_row}:D{end_row}"

          sheets_url = f"https://sheets.googleapis.com/v4/spreadsheets/{spreadsheet_id}/values/{urllib.request.quote(rng)}?valueInputOption=RAW"
          payload = json.dumps({
            "range": rng,
            "majorDimension": "ROWS",
            "values": rows,
          }).encode("utf-8")

          sreq = urllib.request.Request(
            sheets_url,
            data=payload,
            method="PUT",
            headers={
              "Authorization": f"Bearer {gtok}",
              "Content-Type": "application/json; charset=utf-8",
            },
          )

          try:
            with urllib.request.urlopen(sreq, timeout=20) as resp:
              resp.read()
          except urllib.error.HTTPError as e:
            print(f"Sheets API HTTP {e.code}", file=sys.stderr)
            sys.exit(2)

          ts = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          print(f"[DONE] wrote {len(rows)} rows to {tab}!A2:D{end_row} at {ts} (ok={ok}, fail={fail})")
          PY
