name: SDE Routes to Jita (Safer100 + Cyno + Crossroads)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_to_jita
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Git identity
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Rebase first to avoid the "cannot rebase: You have unstaged changes" trap later
      - name: Sync with main (rebase)
        run: |
          set -e
          git fetch origin main
          git pull --rebase --autostash origin main

      - name: Build routes + crossroads
        run: |
          set -e
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz \
            --out-crossroads data/sde/crossroads.jsonl.gz

      - name: Validate outputs
        run: |
          set -e
          gzip -t data/sde/routes.jsonl.gz
          gzip -t data/sde/crossroads.jsonl.gz
          test -s data/sde/routes.jsonl.gz
          test -s data/sde/crossroads.jsonl.gz

      - name: Commit & push if changed (safe rebase)
        run: |
          set -e
          ROUTES="data/sde/routes.jsonl.gz"
          CROSS="data/sde/crossroads.jsonl.gz"

          # Stage first; this also makes autostash unnecessary for these files
          git add -- "$ROUTES" "$CROSS"

          if [ -z "$(git status --porcelain -- "$ROUTES" "$CROSS")" ]; then
            echo "No changes."
            exit 0
          fi

          git commit -m "sde: rebuild routes + crossroads (safer100 + cyno rules)"

          # Rebase again right before pushing to avoid non-fast-forward
          git fetch origin main
          git pull --rebase --autostash origin main

          git push origin HEAD:main
