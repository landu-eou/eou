name: SDE Routes (SDE → GH) — routes.jsonl.gz

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_sde-gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync with remote main (rebase)
        shell: bash
        run: |
          set -e
          git fetch origin main
          git rebase origin/main

      - name: Build routes.jsonl.gz
        shell: bash
        run: |
          set -e
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --stations data/sde/stations.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz

      - name: Validate artifact
        shell: bash
        run: |
          set -e
          TARGET="data/sde/routes.jsonl.gz"
          gzip -t "$TARGET"
          test -s "$TARGET"

      - name: Commit & push if changed (rebase-safe)
        shell: bash
        run: |
          set -e
          TARGET="data/sde/routes.jsonl.gz"

          # Detect changes (including untracked new file)
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "$TARGET"
          git commit -m "sde: rebuild routes.jsonl.gz (stations waypoints + cyno/gate rules)"

          # Rebase again just in case main moved while building
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
