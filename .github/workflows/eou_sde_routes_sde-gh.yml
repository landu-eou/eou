name: SDE Routes (SDE → GH)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_sde-gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history for rebase/push safety)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fast-forward local branch (rebase, autostash)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main

      - name: Build routes.jsonl.gz
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --stations data/sde/stations.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz

      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/sde/routes.jsonl.gz"
          gzip -t "$TARGET"
          test -s "$TARGET"

      - name: Commit & push if changed (rebase-safe, autostash)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/sde/routes.jsonl.gz"

          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "No changes."
            exit 0
          fi

          git add -- "$TARGET"
          git commit -m "sde: rebuild routes.jsonl.gz (optimized routing + stations)"

          # If main moved while computing, rebase and push safely.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
