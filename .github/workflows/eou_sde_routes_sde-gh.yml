name: SDE Routes (SDE → GH)

on:
  workflow_dispatch:

env:
  WORKFLOW_FILE: eou_sde_routes_sde-gh.yml
  SHEETS_ID: 1fnoPr1HoRjUVc8yTfiGa0yZ-WaxgOwWJe8
  SHEET_TAB: workflows
  SHEETS_WORKFLOW_ROW: "10"
  LOCK_TIME: "60" # seconds

# Permisos mínimos:
# - actions:read  -> para listar runs y hacer guard anti-cola
# - contents:write -> para commitear routes + states/routes.json
permissions:
  actions: read
  contents: write

# Candado oficial GitHub: evita solapamiento real.
# (No cancela el run en curso.)
concurrency:
  group: eou_sde_routes_sde-gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -----------------------------
      # 0) Guard anti-cola (salida temprana)
      # -----------------------------
      - name: Guard: exit if another run is in progress
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const wf = process.env.WORKFLOW_FILE;
            const { owner, repo } = context.repo;

            // List workflow runs for this workflow file (official REST API).
            // workflow_id can be the workflow file name. :contentReference[oaicite:3]{index=3}
            const res = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: wf,
              status: "in_progress",
              per_page: 100
            });

            const runs = res.data.workflow_runs || [];
            const others = runs.filter(r => String(r.id) !== String(context.runId));

            if (others.length > 0) {
              core.info(`Another run is already in progress (run_id=${others[0].id}). Exiting without work.`);
              core.setOutput("skip", "true");
            } else {
              core.setOutput("skip", "false");
            }

      - name: Stop (no work) if locked
        if: steps.guard.outputs.skip == 'true'
        run: |
          echo "Locked: another run in progress. Exiting."
          exit 0

      # -----------------------------
      # 1) Checkout + Python
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # 2) Calcular etags SHA256 y decidir si hay cambios
      #    (y calcular serials next_run/last_modified)
      # -----------------------------
      - name: Compute etags + schedule values
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/routes_etag_and_schedule.py \
            --state-file states/routes.json \
            --lock-seconds "${LOCK_TIME}" \
            --inputs \
              data/sde/solarsystems.jsonl.gz \
              data/sde/stargates.jsonl.gz \
              data/sde/stations.jsonl.gz \
              data/sde/ganksystems.txt

      # -----------------------------
      # 3) Fase inicial: LOCK en Sheets si hay cambios
      #    next_run = now + LOCK_TIME
      # -----------------------------
      - name: Sheets: set RUNNING + lock next_run (only if inputs changed)
        if: steps.meta.outputs.inputs_changed == 'true'
        shell: bash
        env:
          APS_SHEETS_WEBAPP_URL: ${{ secrets.APS_SHEETS_WEBAPP_URL }}
          APS_SHEETS_TOKEN: ${{ secrets.APS_SHEETS_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/sheets_workflows_update.py \
            --webapp-url "$APS_SHEETS_WEBAPP_URL" \
            --token "$APS_SHEETS_TOKEN" \
            --sheets-id "$SHEETS_ID" \
            --tab "$SHEET_TAB" \
            --row "$SHEETS_WORKFLOW_ROW" \
            --status "RUNNING" \
            --next-run-serial "${{ steps.meta.outputs.next_run_lock_serial }}"

      # -----------------------------
      # 4) Si NO hay cambios: éxito rápido + next_run = now + 6h y salir
      # -----------------------------
      - name: Sheets: set SUCCESS (no changes) + next_run=+6h, then exit
        if: steps.meta.outputs.inputs_changed != 'true'
        shell: bash
        env:
          APS_SHEETS_WEBAPP_URL: ${{ secrets.APS_SHEETS_WEBAPP_URL }}
          APS_SHEETS_TOKEN: ${{ secrets.APS_SHEETS_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/sheets_workflows_update.py \
            --webapp-url "$APS_SHEETS_WEBAPP_URL" \
            --token "$APS_SHEETS_TOKEN" \
            --sheets-id "$SHEETS_ID" \
            --tab "$SHEET_TAB" \
            --row "$SHEETS_WORKFLOW_ROW" \
            --status "SUCCESS_NO_CHANGE" \
            --next-run-serial "${{ steps.meta.outputs.next_run_6h_serial }}"
          echo "No input changes. Done."
          exit 0

      # -----------------------------
      # 5) Fase objetivo: build routes (solo si hubo cambios)
      # -----------------------------
      - name: Build routes.jsonl.gz
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --stations data/sde/stations.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz

      - name: Validate artifact (routes.jsonl.gz)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/sde/routes.jsonl.gz"
          gzip -t "$TARGET"
          test -s "$TARGET"

      # -----------------------------
      # 6) Fase final éxito:
      #    - actualizar states/routes.json (etags)
      #    - next_run = now + 6h
      #    - last_modified = now
      #    - commit "de golpe" (routes + state)
      # -----------------------------
      - name: Update states/routes.json from computed etags
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/routes_etag_and_schedule.py \
            --state-file states/routes.json \
            --write-state \
            --lock-seconds "${LOCK_TIME}" \
            --inputs \
              data/sde/solarsystems.jsonl.gz \
              data/sde/stargates.jsonl.gz \
              data/sde/stations.jsonl.gz \
              data/sde/ganksystems.txt

      - name: Commit & push if changed (single commit, rebase-safe)
        shell: bash
        run: |
          set -euo pipefail

          # Añadimos los dos ficheros "de golpe"
          git add -- data/sde/routes.jsonl.gz states/routes.json

          if [ -z "$(git status --porcelain -- data/sde/routes.jsonl.gz states/routes.json)" ]; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Rebase por si main avanzó durante el cálculo
            git pull --rebase --autostash origin main

            git commit -m "sde: rebuild routes.jsonl.gz + update states/routes.json (etags)"
            git push origin HEAD:main
          fi

      - name: Sheets: set SUCCESS + next_run=+6h + last_modified=now
        shell: bash
        env:
          APS_SHEETS_WEBAPP_URL: ${{ secrets.APS_SHEETS_WEBAPP_URL }}
          APS_SHEETS_TOKEN: ${{ secrets.APS_SHEETS_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/sheets_workflows_update.py \
            --webapp-url "$APS_SHEETS_WEBAPP_URL" \
            --token "$APS_SHEETS_TOKEN" \
            --sheets-id "$SHEETS_ID" \
            --tab "$SHEET_TAB" \
            --row "$SHEETS_WORKFLOW_ROW" \
            --status "SUCCESS" \
            --next-run-serial "${{ steps.meta.outputs.next_run_6h_serial }}" \
            --last-modified-serial "${{ steps.meta.outputs.now_serial }}"

      # -----------------------------
      # 7) Fase final fallo:
      #    - next_run = now + 10m
      # -----------------------------
      - name: Sheets: set FAILURE + next_run=+10m
        if: failure()
        shell: bash
        env:
          APS_SHEETS_WEBAPP_URL: ${{ secrets.APS_SHEETS_WEBAPP_URL }}
          APS_SHEETS_TOKEN: ${{ secrets.APS_SHEETS_TOKEN }}
        run: |
          set -euo pipefail
          python -u scripts/sheets_workflows_update.py \
            --webapp-url "$APS_SHEETS_WEBAPP_URL" \
            --token "$APS_SHEETS_TOKEN" \
            --sheets-id "$SHEETS_ID" \
            --tab "$SHEET_TAB" \
            --row "$SHEETS_WORKFLOW_ROW" \
            --status "FAILURE" \
            --next-run-serial "${{ steps.meta.outputs.next_run_10m_serial }}"
