name: SDE Routes (stargate+cyno → routes.jsonl.gz + routesCat.jsonl.gz)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_sde-gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history for rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync with origin/main (clean rebase BEFORE generating)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Validate inputs exist
        run: |
          set -e
          test -f data/sde/solarsystems.jsonl.gz
          test -f data/sde/stargates.jsonl.gz
          test -f data/sde/ganksystems.txt
          gzip -t data/sde/solarsystems.jsonl.gz
          gzip -t data/sde/stargates.jsonl.gz

      - name: Build routes (full rebuild)
        run: |
          set -e
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz \
            --out-cat data/sde/routesCat.jsonl.gz

      - name: Validate outputs
        run: |
          set -e
          gzip -t data/sde/routes.jsonl.gz
          gzip -t data/sde/routesCat.jsonl.gz
          test -s data/sde/routes.jsonl.gz
          test -s data/sde/routesCat.jsonl.gz

      - name: Commit & Push
        run: |
          set -e
          T1="data/sde/routes.jsonl.gz"
          T2="data/sde/routesCat.jsonl.gz"

          if [ -z "$(git status --porcelain -- "$T1" "$T2")" ]; then
            echo "No changes."
            exit 0
          fi

          git add -- "$T1" "$T2"
          git commit -m "sde: rebuild routes.jsonl.gz + routesCat.jsonl.gz (cyno+gate rules)"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
