name: SDE Routes to Jita (Safer100 + Cyno Rules)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_to_jita
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build routes.jsonl.gz
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          gzip -t data/sde/routes.jsonl.gz
          test -s data/sde/routes.jsonl.gz

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail

          TARGET="data/sde/routes.jsonl.gz"

          # Detect changes (including new file)
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage first, then rebase cleanly (avoids "unstaged changes" rebase error)
          git add -- "$TARGET"
          git commit -m "sde: rebuild routes.jsonl.gz (routeType)"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
