# ──────────────────────────────────────────────────────────────────────────────
# File tree (inputs / outputs / state) used by this workflow
#
# repo/
# ├─ .github/
# │  └─ workflows/
# │     └─ eou_sde_routes_sde-gh.yml          # this workflow
# ├─ scripts/
# │  └─ build_sde_routes.py                   # builder (writes routes.jsonl.gz)
# ├─ data/
# │  └─ sde/
# │     ├─ solarsystems.jsonl.gz              # INPUT (etag tracked)
# │     ├─ stargates.jsonl.gz                 # INPUT (etag tracked)
# │     ├─ stations.jsonl.gz                  # INPUT (etag tracked) [optional if script ignores; keep if workflow passes]
# │     ├─ ganksystems.txt                    # INPUT (etag tracked)
# │     └─ routes.jsonl.gz                    # OUTPUT (rebuilt from scratch)
# └─ states/
#    └─ routes.json                           # STATE (stores strong etags per input file)
#
# External state (not in repo):
# └─ Google Sheets: SHEETS_ID / tab 'workflows'
#    ├─ Col B (status)
#    ├─ Col D (next_run)  [UTC serial number]
#    └─ Col I (last_modified) [UTC serial number]
# ──────────────────────────────────────────────────────────────────────────────

name: SDE Routes (SDE → GH)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_sde-gh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Checkout ligero: suficiente para construir.
      # (El historial completo NO es necesario salvo que vayamos a rebase/commitear.)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build routes.jsonl.gz
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_sde_routes.py \
            --solarsystems data/sde/solarsystems.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --stations data/sde/stations.jsonl.gz \
            --ganksystems data/sde/ganksystems.txt \
            --out data/sde/routes.jsonl.gz

      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/sde/routes.jsonl.gz"
          gzip -t "$TARGET"
          test -s "$TARGET"

      # Solo si hay cambios: entonces sí hacemos pull --rebase (autostash) y push.
      - name: Commit & push if changed (rebase-safe, autostash)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="data/sde/routes.jsonl.gz"

          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Si main avanzó mientras se computaba, rebase antes del commit/push.
          git pull --rebase --autostash origin main

          git add -- "$TARGET"
          git commit -m "sde: rebuild routes.jsonl.gz (optimized routing + stations)"
          git push origin HEAD:main
