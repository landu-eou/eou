name: child_test_simple

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: wf_test_simple_001
      SHEET_ROW: "2"
      EXPIRES: "300"
      LOCK_SECONDS: "650"

    steps:
      - name: START (last_run + lock_until + temp next_run)
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "start" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          # Capture body + effective URL + code
          HTTP_CODE="$(curl -sS -L -o /tmp/body.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST "${GATEWAY_URL}?sig=${SIG}" \
            -d "$BODY" || true)"
          FINAL_URL="$(curl -sS -L -o /dev/null -w "%{url_effective}" \
            -H "Content-Type: application/json" \
            -X POST "${GATEWAY_URL}?sig=${SIG}" \
            -d "$BODY" || true)"

          RESP="$(cat /tmp/body.txt || true)"

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "Gateway did not return JSON."
            echo "HTTP_CODE=$HTTP_CODE"
            echo "FINAL_URL=$FINAL_URL"
            echo "First 400 chars:"
            echo "$RESP" | head -c 400 || true
            echo
            exit 1
          fi

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit fast if locked
        if: steps.start.outputs.locked == 'true'
        run: |
          echo "Locked already. Exiting fast."
          exit 0

      - name: DO WORK (dummy)
        run: |
          sleep 3

      - name: FINISH (completed + conclusion + run_ended + final next_run)
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "finish" \
            --arg conclusion "$CONCLUSION" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,conclusion:$conclusion,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          HTTP_CODE="$(curl -sS -L -o /tmp/body2.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST "${GATEWAY_URL}?sig=${SIG}" \
            -d "$BODY" || true)"
          FINAL_URL="$(curl -sS -L -o /dev/null -w "%{url_effective}" \
            -H "Content-Type: application/json" \
            -X POST "${GATEWAY_URL}?sig=${SIG}" \
            -d "$BODY" || true)"

          RESP="$(cat /tmp/body2.txt || true)"

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "Gateway did not return JSON on finish."
            echo "HTTP_CODE=$HTTP_CODE"
            echo "FINAL_URL=$FINAL_URL"
            echo "First 400 chars:"
            echo "$RESP" | head -c 400 || true
            echo
            exit 1
          fi

          echo "Finish OK: $(echo "$RESP" | jq -c .)"
