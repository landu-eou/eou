name: child_test_simple

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: wf_test_simple_001
      SHEET_ROW: "2"
      EXPIRES: "300"
      LOCK_SECONDS: "650"

    steps:
      - name: Show gateway url (masked in logs if secret)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          echo "GATEWAY_URL=$GATEWAY_URL"
          if [[ "$GATEWAY_URL" != https://script.google.com/macros/s/*/exec ]]; then
            echo "ERROR: GATEWAY_URL must be https://script.google.com/macros/s/<DEPLOYMENT_ID>/exec"
            exit 1
          fi

      - name: Preflight GET (must be JSON + service=eou_gateway_webapp)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          RESP="$(curl -sS -L "$GATEWAY_URL" || true)"
          echo "GET first 200 chars:"
          echo "$RESP" | head -c 200 || true
          echo
          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: GET /exec did not return JSON. Wrong URL or not public."
            exit 1
          fi
          SVC="$(echo "$RESP" | jq -r '.service // ""')"
          if [[ "$SVC" != "eou_gateway_webapp" ]]; then
            echo "ERROR: /exec is not the gateway (service mismatch). service=$SVC"
            exit 1
          fi
          echo "Preflight OK."

      - name: START (signed POST) + diagnostics
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "start" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?sig=${SIG}"

          # 1) Capture body + http_code
          HTTP_CODE="$(curl -sS \
            --location --post301 --post302 --post303 \
            --max-redirs 10 \
            -o /tmp/start_body.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "$BODY" \
            "$URL" || true)"

          # 2) Capture final effective URL (separate call, no output)
          FINAL_URL="$(curl -sS \
            --location --post301 --post302 --post303 \
            --max-redirs 10 \
            -o /dev/null -w "%{url_effective}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "$BODY" \
            "$URL" || true)"

          RESP="$(cat /tmp/start_body.txt || true)"

          echo "HTTP_CODE=$HTTP_CODE"
          echo "FINAL_URL=$FINAL_URL"
          echo "RESP first 250 chars:"
          echo "$RESP" | head -c 250 || true
          echo

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: Gateway did not return JSON on START."
            exit 1
          fi

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit fast if locked
        if: steps.start.outputs.locked == 'true'
        run: |
          echo "Locked already. Exiting."
          exit 0

      - name: DO WORK (dummy)
        run: |
          echo "work..."
          sleep 3

      - name: FINISH (signed POST) + diagnostics
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "finish" \
            --arg conclusion "$CONCLUSION" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,conclusion:$conclusion,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?sig=${SIG}"

          HTTP_CODE="$(curl -sS \
            --location --post301 --post302 --post303 \
            --max-redirs 10 \
            -o /tmp/finish_body.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "$BODY" \
            "$URL" || true)"

          FINAL_URL="$(curl -sS \
            --location --post301 --post302 --post303 \
            --max-redirs 10 \
            -o /dev/null -w "%{url_effective}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "$BODY" \
            "$URL" || true)"

          RESP="$(cat /tmp/finish_body.txt || true)"

          echo "HTTP_CODE=$HTTP_CODE"
          echo "FINAL_URL=$FINAL_URL"
          echo "RESP first 250 chars:"
          echo "$RESP" | head -c 250 || true
          echo

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: Gateway did not return JSON on FINISH."
            exit 1
          fi

          echo "Finish OK: $(echo "$RESP" | jq -c .)"
