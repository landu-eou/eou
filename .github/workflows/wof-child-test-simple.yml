# =======================
# PARTE INICIAL (lo que cambias para un clon)
# =======================

name: ${{ env.WORKFLOW_NAME }}

on:
  workflow_dispatch:

env:
  WORKFLOW_ID: wf_test_simple_001    # <-- 001 CAMBIA (debe estar también en ALLOW del gateway)
  WORKFLOW_NAME: Child Test Simple   # <-- 002 CAMBIA el nombre visible del workflow
  SHEET_ROW: "11"                    # <-- 003 CAMBIA (fila del tab 'workflows' que va a tocar)
  EXPIRES: "300"                     # <-- 004 (opcional) cambia si quieres otra cadencia
  LOCK_SECONDS: "60"                 # <-- 005 (opcional) cambia si quieres otro lock

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Preflight
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"

          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          WF_NAME_ENC="$(python3 - <<'PY'
import os, urllib.parse
print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))
PY
)"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          [[ "$(echo "$RESP" | jq -r '.ok')" == "true" ]]

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

# =======================
# PARTE FUNCIÓN (solo cambia si cambia la función del workflow)
# =======================

      - name: DO WORK (dummy)
        run: sleep 3

# =======================
# PARTE FINAL (normalmente NO la tocas para un clon)
# =======================

      - name: FINISH
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          case "${{ job.status }}" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW_MS="$(date -u +%s%3N)"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          WF_NAME_ENC="$(python3 - <<'PY'
import os, urllib.parse
print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))
PY
)"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          [[ "$(echo "$RESP" | jq -r '.ok')" == "true" ]]
