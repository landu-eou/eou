name: child_test_simple

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: wf_test_simple_001
      SHEET_ROW: "2"
      EXPIRES: "300"
      LOCK_SECONDS: "650"

    steps:
      - name: Validate gateway URL format
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          echo "GATEWAY_URL=$GATEWAY_URL"
          if [[ "$GATEWAY_URL" != https://script.google.com/macros/s/*/exec ]]; then
            echo "ERROR: GATEWAY_URL must be https://script.google.com/macros/s/<DEPLOYMENT_ID>/exec"
            exit 1
          fi

      - name: Preflight GET must return JSON service
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          RESP="$(curl -sS -L "$GATEWAY_URL" || true)"
          echo "GET first 200 chars:"
          echo "$RESP" | head -c 200 || true
          echo
          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "ERROR: GET /exec did not return JSON. Deployment is not public or wrong project/deployment."
            exit 1
          fi
          SVC="$(echo "$RESP" | jq -r '.service // ""')"
          if [[ "$SVC" != "eou_gateway_webapp" ]]; then
            echo "ERROR: This /exec is not the gateway (service mismatch)."
            echo "service=$SVC"
            exit 1
          fi

      - name: START
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "start" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          RESP="$(curl -sS \
            --location --post301 --post302 --post303 \
            -H "Content-Type: application/json" \
            --data-binary "$BODY" \
            "${GATEWAY_URL}?sig=${SIG}" || true)"

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "Gateway did not return JSON on START."
            echo "$RESP" | head -c 400 || true
            echo
            exit 1
          fi

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit fast if locked
        if: steps.start.outputs.locked == 'true'
        run: |
          echo "Locked already. Exiting."
          exit 0

      - name: DO WORK (dummy)
        run: |
          sleep 3

      - name: FINISH
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(jq -nc \
            --arg workflow_id "$WORKFLOW_ID" \
            --argjson row "$SHEET_ROW" \
            --arg phase "finish" \
            --arg conclusion "$CONCLUSION" \
            --argjson expires "$EXPIRES" \
            --argjson lock_seconds "$LOCK_SECONDS" \
            --arg now "$NOW" \
            '{workflow_id:$workflow_id,row:$row,phase:$phase,conclusion:$conclusion,expires:$expires,lock_seconds:$lock_seconds,now:$now}')"

          SIG="$(printf "%s" "$BODY" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          RESP="$(curl -sS \
            --location --post301 --post302 --post303 \
            -H "Content-Type: application/json" \
            --data-binary "$BODY" \
            "${GATEWAY_URL}?sig=${SIG}" || true)"

          if ! echo "$RESP" | jq -e . >/dev/null 2>&1; then
            echo "Gateway did not return JSON on FINISH."
            echo "$RESP" | head -c 400 || true
            echo
            exit 1
          fi

          echo "Finish OK: $(echo "$RESP" | jq -c .)"
