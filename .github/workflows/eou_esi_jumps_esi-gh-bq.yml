name: ESI System Jumps (ESI → GH → BQ)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_esi_jumps_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKFLOW_FILE: eou_esi_jumps_esi-gh-bq.yml
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "5"
      LOCK_TIME: "60"

      ESI_URL: https://esi.evetech.net/universe/system_jumps
      STATE_PATH: states/system_jumps.json
      SDE_SOLARSYSTEMS_GZ: data/sde/solarsystems.jsonl.gz

      BQ_DATASET: eou
      BQ_TABLE: system_jumps

      GH_API: https://api.github.com

    steps:
      - name: Guard - decide proceed (anti-cola)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          run_id="${GITHUB_RUN_ID}"

          auth_hdr="Authorization: Bearer ${GH_TOKEN}"
          acc_hdr="Accept: application/vnd.github+json"

          wf_json="$(curl -sS -H "${auth_hdr}" -H "${acc_hdr}" "${GH_API}/repos/${repo}/actions/workflows/${WORKFLOW_FILE}")"
          wf_id="$(echo "${wf_json}" | jq -r '.id')"
          if [[ -z "${wf_id}" || "${wf_id}" == "null" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          self_json="$(curl -sS -H "${auth_hdr}" -H "${acc_hdr}" "${GH_API}/repos/${repo}/actions/runs/${run_id}")"
          self_created="$(echo "${self_json}" | jq -r '.created_at')"
          if [[ -z "${self_created}" || "${self_created}" == "null" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          runs_json="$(curl -sS -H "${auth_hdr}" -H "${acc_hdr}" \
            "${GH_API}/repos/${repo}/actions/workflows/${wf_id}/runs?per_page=50")"

          other_inprog="$(echo "${runs_json}" | jq -r --arg rid "${run_id}" '
            [.workflow_runs[] | select(.status=="in_progress" and (.id|tostring)!=$rid)] | length
          ')"

          stale_by_success="$(echo "${runs_json}" | jq -r --arg created "${self_created}" --arg rid "${run_id}" '
            [
              .workflow_runs[]
              | select((.id|tostring)!=$rid)
              | select(.status=="completed" and .conclusion=="success")
              | select(.created_at < $created and (.updated_at // "") > $created)
            ] | length
          ')"

          if [[ "${other_inprog}" -gt 0 || "${stale_by_success}" -gt 0 ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Guard - exit early (no work)
        if: ${{ steps.guard.outputs.proceed != 'true' }}
        run: echo "Queued/duplicate dispatch detected. Exiting without work."

      - name: Checkout
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auth to Google (WIF)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Read state + fetch ESI headers (ETag/Expires/Last-Modified)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: esi
        shell: bash
        run: |
          set -euo pipefail

          to_serial() {
            awk -v s="$1" 'BEGIN{printf "%.10f", (s/86400.0)+25569.0}'
          }

          run_start_epoch="$(date -u +%s)"
          echo "RUN_START_EPOCH=${run_start_epoch}" >> "${GITHUB_ENV}"

          state_exists="false"
          if [[ -f "${STATE_PATH}" ]]; then state_exists="true"; fi
          echo "state_exists=${state_exists}" >> "${GITHUB_OUTPUT}"

          local_etag=""
          if [[ "${state_exists}" == "true" ]]; then
            local_etag="$(jq -r '.etag // empty' "${STATE_PATH}" 2>/dev/null | sed -E 's/^"//; s/"$//' || true)"
          fi
          echo "local_etag=${local_etag}" >> "${GITHUB_OUTPUT}"

          headers_file="$(mktemp)"
          if [[ -n "${local_etag}" ]]; then
            http_code="$(curl -sS -L -o /dev/null -D "${headers_file}" -w "%{http_code}" \
              -H "If-None-Match: ${local_etag}" \
              "${ESI_URL}")"
          else
            http_code="$(curl -sS -L -o /dev/null -D "${headers_file}" -w "%{http_code}" \
              "${ESI_URL}")"
          fi

          remote_etag="$(grep -i '^etag:' "${headers_file}" | tail -1 \
            | sed -E 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//' \
            | tr -d '\r' \
            | sed -E 's/^"//; s/"$//' \
            || true)"

          last_mod="$(grep -i '^last-modified:' "${headers_file}" | tail -1 | sed -E 's/^[Ll]ast-[Mm]odified:[[:space:]]*//' | tr -d '\r' || true)"
          expires="$(grep -i '^expires:' "${headers_file}" | tail -1 | sed -E 's/^[Ee]xpires:[[:space:]]*//' | tr -d '\r' || true)"

          if [[ -z "${last_mod}" ]]; then
            echo "Missing Last-Modified header from ESI."
            exit 1
          fi

          lm_epoch="$(date -u -d "${last_mod}" +%s)"
          lm_iso="$(date -u -d "@${lm_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          lm_serial="$(to_serial "${lm_epoch}")"

          if [[ -n "${expires}" ]]; then
            exp_epoch="$(date -u -d "${expires}" +%s)"
          else
            exp_epoch="$((lm_epoch + 3600))"
          fi
          exp_plus5_epoch="$((exp_epoch + 300))"
          exp_plus5_serial="$(to_serial "${exp_plus5_epoch}")"

          lock_seconds="${LOCK_TIME}"
          lock_epoch="$((run_start_epoch + lock_seconds))"
          lock_serial="$(to_serial "${lock_epoch}")"

          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          echo "remote_etag=${remote_etag}" >> "${GITHUB_OUTPUT}"
          echo "last_modified_rfc=${last_mod}" >> "${GITHUB_OUTPUT}"
          echo "last_modified_iso=${lm_iso}" >> "${GITHUB_OUTPUT}"
          echo "last_modified_serial=${lm_serial}" >> "${GITHUB_OUTPUT}"
          echo "expires_plus5_serial=${exp_plus5_serial}" >> "${GITHUB_OUTPUT}"
          echo "lock_serial=${lock_serial}" >> "${GITHUB_OUTPUT}"

      - name: Ensure BigQuery table exists
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bq --project_id="${GCP_PROJECT_ID}" query --quiet --use_legacy_sql=false "
          CREATE TABLE IF NOT EXISTS \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\` (
            snapshot_ts TIMESTAMP NOT NULL,
            solarSystem STRING,
            ship_jumps INT64
          )
          PARTITION BY DATE(snapshot_ts)
          CLUSTER BY solarSystem
          "

      - name: Decide mode (noop/full/reconcile/repair)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: mode
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          lm_iso="${{ steps.esi.outputs.last_modified_iso }}"
          local_etag="${{ steps.esi.outputs.local_etag }}"
          remote_etag="${{ steps.esi.outputs.remote_etag }}"
          http_code="${{ steps.esi.outputs.http_code }}"
          state_exists="${{ steps.esi.outputs.state_exists }}"

          snap_count="$(bq --project_id="${GCP_PROJECT_ID}" query --quiet --use_legacy_sql=false --format=csv --headless \
            "SELECT COUNT(1) AS c
             FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
             WHERE snapshot_ts = TIMESTAMP('${lm_iso}')" \
            | tr -d '\r' \
            | tail -n 1 \
            | tr -cd '0-9')"
          snap_count="${snap_count:-0}"

          mode="noop"
          if [[ "${snap_count}" == "0" ]]; then
            if [[ -z "${local_etag}" ]]; then
              mode="full"
            elif [[ "${local_etag}" != "${remote_etag}" ]]; then
              mode="full"
            else
              mode="repair"
            fi
          else
            if [[ -z "${local_etag}" ]]; then
              mode="reconcile"
            elif [[ "${local_etag}" != "${remote_etag}" ]]; then
              mode="reconcile"
            else
              mode="noop"
            fi
          fi

          update_state="false"
          if [[ "${state_exists}" != "true" || -z "${local_etag}" || "${local_etag}" != "${remote_etag}" ]]; then
            update_state="true"
          fi

          printf 'snap_count=%s\n' "$snap_count" >> "${GITHUB_OUTPUT}"
          printf 'mode=%s\n' "$mode" >> "${GITHUB_OUTPUT}"
          printf 'update_state=%s\n' "$update_state" >> "${GITHUB_OUTPUT}"

      - name: Prepare load (download ESI + validate mapping + build ndjson)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.mode.outputs.mode != 'noop' }}
        id: prep
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          mode="${{ steps.mode.outputs.mode }}"
          lm_iso="${{ steps.esi.outputs.last_modified_iso }}"

          curl -sS -L "${ESI_URL}" -o esi_body.json

          gzip -cd "${SDE_SOLARSYSTEMS_GZ}" | jq -s 'map({(.solarSystemID|tostring): .solarSystem}) | add' > sde_map.json

          if [[ "${mode}" == "reconcile" ]]; then
            existing_list="$(bq --project_id="${GCP_PROJECT_ID}" query --quiet --format=json --use_legacy_sql=false \
              "SELECT solarSystem
               FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
               WHERE snapshot_ts = TIMESTAMP('${lm_iso}')")"
            echo "${existing_list}" | jq 'map(.solarSystem) | map({(.): true}) | add // {}' > existing_map.json
          else
            echo '{}' > existing_map.json
          fi

          # FIX: --argfile -> --slurpfile (y acceso con [0])
          if [[ "${mode}" == "reconcile" ]]; then
            jq -c --arg ts "${lm_iso}" --slurpfile map sde_map.json --slurpfile exist existing_map.json '
              .[] |
              {
                snapshot_ts: $ts,
                solarSystem: ($map[0][(.system_id|tostring)] // error("missing solarSystem mapping for system_id=" + (.system_id|tostring))),
                ship_jumps: (.ship_jumps|tonumber)
              } |
              select( ($exist[0][.solarSystem] // false) | not )
            ' esi_body.json > load.ndjson
          else
            jq -c --arg ts "${lm_iso}" --slurpfile map sde_map.json '
              .[] |
              {
                snapshot_ts: $ts,
                solarSystem: ($map[0][(.system_id|tostring)] // error("missing solarSystem mapping for system_id=" + (.system_id|tostring))),
                ship_jumps: (.ship_jumps|tonumber)
              }
            ' esi_body.json > load.ndjson
          fi

          load_lines="$(wc -l < load.ndjson | tr -d ' ')"
          echo "load_lines=${load_lines}" >> "${GITHUB_OUTPUT}"
          echo "prepared=true" >> "${GITHUB_OUTPUT}"

      - name: Sheets - initial lock (in_progress + next_run = now + LOCK_TIME)
        if: ${{ steps.guard.outputs.proceed == 'true' && (steps.mode.outputs.mode == 'noop' || steps.prep.outputs.prepared == 'true') }}
        id: sheets_lock
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          status="in_progress"
          next_run="${{ steps.esi.outputs.lock_serial }}"

          body="$(jq -n \
            --arg tab "${SHEET_TAB}" \
            --arg row "${SHEETS_WORKFLOW_ROW}" \
            --arg status "${status}" \
            --argjson next_run "${next_run}" \
            '{
              valueInputOption: "RAW",
              data: [
                {range: ($tab + "!B" + $row), values: [[ $status ]]},
                {range: ($tab + "!D" + $row), values: [[ $next_run ]]}
              ]
            }')"

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "${body}" >/dev/null

          echo "locked=true" >> "${GITHUB_OUTPUT}"

      - name: BigQuery load (single batch)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.mode.outputs.mode != 'noop' && steps.prep.outputs.load_lines != '0' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          bq --project_id="${GCP_PROJECT_ID}" load --quiet \
            --source_format=NEWLINE_DELIMITED_JSON \
            "${BQ_DATASET}.${BQ_TABLE}" \
            load.ndjson \
            snapshot_ts:TIMESTAMP,solarSystem:STRING,ship_jumps:INTEGER

      - name: Update state etag (commit to repo)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.sheets_lock.outputs.locked == 'true' && steps.mode.outputs.update_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          remote_etag="${{ steps.esi.outputs.remote_etag }}"

          mkdir -p "$(dirname "${STATE_PATH}")"
          jq -n --arg etag "${remote_etag}" '{etag: $etag}' > "${STATE_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${STATE_PATH}"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "state: update system_jumps etag"
          git pull --rebase
          git push

      - name: Sheets - finalize (status + next_run + optional last_modified)
        if: ${{ always() && steps.sheets_lock.outputs.locked == 'true' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          to_serial() {
            awk -v s="$1" 'BEGIN{printf "%.10f", (s/86400.0)+25569.0}'
          }

          status="failed"
          next_run=""
          include_last_modified="false"

          if [[ "${JOB_STATUS}" == "success" ]]; then
            status="completed"
            next_run="${{ steps.esi.outputs.expires_plus5_serial }}"
            if [[ "${{ steps.mode.outputs.update_state }}" == "true" ]]; then
              include_last_modified="true"
              last_modified="${{ steps.esi.outputs.last_modified_serial }}"
            fi
          else
            run_start_epoch="${RUN_START_EPOCH}"
            fail_next_epoch="$((run_start_epoch + 300))"
            next_run="$(to_serial "${fail_next_epoch}")"
          fi

          if [[ "${include_last_modified}" == "true" ]]; then
            body="$(jq -n \
              --arg tab "${SHEET_TAB}" \
              --arg row "${SHEETS_WORKFLOW_ROW}" \
              --arg status "${status}" \
              --argjson next_run "${next_run}" \
              --argjson last_modified "${last_modified}" \
              '{
                valueInputOption: "RAW",
                data: [
                  {range: ($tab + "!B" + $row), values: [[ $status ]]},
                  {range: ($tab + "!D" + $row), values: [[ $next_run ]]},
                  {range: ($tab + "!I" + $row), values: [[ $last_modified ]]}
                ]
              }')"
          else
            body="$(jq -n \
              --arg tab "${SHEET_TAB}" \
              --arg row "${SHEETS_WORKFLOW_ROW}" \
              --arg status "${status}" \
              --argjson next_run "${next_run}" \
              '{
                valueInputOption: "RAW",
                data: [
                  {range: ($tab + "!B" + $row), values: [[ $status ]]},
                  {range: ($tab + "!D" + $row), values: [[ $next_run ]]}
                ]
              }')"
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "${body}" >/dev/null
