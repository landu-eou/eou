      if not line:
        continue
      o=json.loads(line)
      sid = pick(o, id_keys)
      name = pick(o, name_keys)
      if sid is None or name is None:
        continue
      try:
        mp[int(sid)] = str(name)
      except Exception:
        pass

# Fallback names (universe/names)
if names_path and os.path.exists(names_path) and os.path.getsize(names_path) > 2:
  arr = json.load(open(names_path, "r", encoding="utf-8"))
