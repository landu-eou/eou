name: ESI System Jumps (ESI → GH → BQ)

on:
  workflow_dispatch:

concurrency:
  group: eou_esi_jumps_esi-gh-bq
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_FILE: eou_esi_jumps_esi-gh-bq.yml

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "5"
      LOCK_TIME: 60

      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: system_jumps

      ESI_URL: https://esi.evetech.net/universe/system_jumps
      ESI_NAMES_URL: https://esi.evetech.net/universe/names

      STATE_PATH: states/system_jumps.json
      SDE_SOLARSYSTEMS_GZ: data/sde/solarsystems.jsonl.gz

      # Heurística para detectar SDE roto: si el mapa tiene menos de este número, se considera "sospechoso"
      # (con tu SDE real el mapa debería ser MUY grande, >> 5k)
      SDE_MIN_MAP_SIZE: "5000"

    steps:
      # ============================================================
      # 0) GUARD — decidir si este run trabaja o sale
      # ============================================================
      - name: Guard - decide proceed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # ============================================================
      # 1) CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2) RUN START
      # ============================================================
      - name: Record run start epoch (UTC)
        run: |
          set -euo pipefail
          echo "RUN_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # ============================================================
      # 3) AUTH GOOGLE (WIF)
      # ============================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          credentials_file_path: ${{ runner.temp }}/gha-creds.json
          export_environment_variables: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Assert Google credentials file exists
        run: |
          set -euo pipefail
          test -f "$GOOGLE_GHA_CREDS_PATH"
          ls -la "$GOOGLE_GHA_CREDS_PATH"

      # ============================================================
      # 4) ANTI-COLA — cancelar runs queued
      # ============================================================
      - name: Cancel queued runs (anti-queue)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          jq -r --arg rid "$RUN_ID" '
            (.workflow_runs // [])
            | map(select(.status=="queued"))
            | map(select(.id != ($rid|tonumber)))
            | .[].id
          ' <<< "$json" | while read -r other_id; do
            [ -z "$other_id" ] && continue
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${other_id}/cancel" \
              >/dev/null || true
          done

      # ============================================================
      # 5) LOCK INICIAL EN SHEETS
      # ============================================================
      - name: Initial lock (Sheets)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # ============================================================
      # 6) setup-gcloud
      # ============================================================
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ============================================================
      # 7) Crear scripts Python (sin heredocs, sin python -c)
      # ============================================================
      - name: Prepare python scripts
        env:
          B64_SDE_MISSING_IDS: |
               e3N0YXRzWydtaXNzaW5nX2lkcyddfSIpCgogICAgaWYgc3RhdHNfb3V0OgogICAgICAgIHdpdGggb3BlbihzdGF0c19vdXQsICJ3IiwgZW5jb2Rpbmc9InV0Zi04IikgYXMgZjoKICAgICAgICAgICAganNvbi5kdW1wKHN0YXRzLCBmKQoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo=
          B64_BUILD_NDJSON: |
               e21pc3NpbmdbOjI1XX0iKQoKICAgIHByaW50KHJvd3MpCgppZiBfX25hbWVfXyA9PSAiX19tYWluX18iOgogICAgbWFpbigpCg==
        run: |
          set -euo pipefail
          mkdir -p .ci/py
          echo "$B64_SDE_MISSING_IDS" | tr -d '\n' | base64 -d > .ci/py/sde_missing_ids.py
          echo "$B64_BUILD_NDJSON" | tr -d '\n' | base64 -d > .ci/py/build_ndjson.py
          chmod +x .ci/py/sde_missing_ids.py .ci/py/build_ndjson.py

      # ============================================================
      # 8) OBJECTIVE — ESI → BQ + state + (opcional) /universe/names
      # ============================================================
      - name: OBJECTIVE - ESI System Jumps -> BigQuery
        id: objective
        run: |
          set -euo pipefail

          UA="EOU-GH-Actions/1.0 (github-actions@users.noreply.github.com; +https://github.com/${GITHUB_REPOSITORY})"

          header_value() {
            local key="$1" file="$2"
            awk -v k="$key" 'BEGIN{IGNORECASE=1}
              $0 ~ ("^"k":") {
                sub("^[^:]*:[[:space:]]*","")
                gsub("\r","")
                print
                exit
              }' "$file"
          }

          normalize_etag() {
            echo "$1" | sed -E 's/^[[:space:]]*W\/"//; s/^"//; s/"[[:space:]]*$//; s/[[:space:]]+$//'
          }

          # HTTP status de última llamada ESI
          ESI_HTTP=""

          esi_request() {
            # usage: esi_request METHOD URL HDR_OUT BODY_OUT [DATA_FILE] [IF_NONE_MATCH]
            local method="$1" url="$2" hdr="$3" body="$4"
            local data_file="${5:-}"
            local inm="${6:-}"

            local max_attempts=8
            local attempt=0
            local delay=1

            while true; do
              attempt=$((attempt+1))
              rm -f "$hdr" "$body" || true

              local args=(-sS -L --compressed -D "$hdr" -o "$body" -X "$method" "$url"
                -H "Accept: application/json"
                -H "User-Agent: ${UA}"
              )

              if [ -n "$inm" ]; then
                args+=(-H "If-None-Match: \"${inm}\"")
              fi

              if [ "$method" = "POST" ]; then
                args+=(-H "Content-Type: application/json" --data-binary @"$data_file")
              fi

              http="$(curl "${args[@]}" -w "%{http_code}" || true)"
              [ -z "$http" ] && http="000"
              ESI_HTTP="$http"

              if [ "$http" = "200" ] || [ "$http" = "304" ]; then
                return 0
              fi

              retry_after="$(header_value "Retry-After" "$hdr" || true)"
              err_reset="$(header_value "X-ESI-Error-Limit-Reset" "$hdr" || true)"

              if [ "$http" = "429" ]; then
                sleep_sec="${retry_after:-$delay}"
              elif [ "$http" = "420" ]; then
                sleep_sec="${err_reset:-$delay}"
              elif [[ "$http" =~ ^(500|502|503|504)$ ]] || [ "$http" = "000" ]; then
                sleep_sec="$delay"
              else
                echo "Unexpected HTTP ${http} from ${url}" >&2
                sed -n '1,60p' "$hdr" >&2 || true
                return 1
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "ESI request failed after ${attempt} attempts (last HTTP ${http})" >&2
                return 1
              fi

              if ! [[ "$sleep_sec" =~ ^[0-9]+$ ]]; then sleep_sec="$delay"; fi
              [ "$sleep_sec" -lt 1 ] && sleep_sec=1
              [ "$sleep_sec" -gt 120 ] && sleep_sec=120

              echo "ESI retry: http=${http} sleep=${sleep_sec}s attempt=$((attempt+1))/${max_attempts}" >&2
              sleep "$sleep_sec"
              [ "$delay" -lt 60 ] && delay=$((delay*2))
            done
          }

          # ---------- leer state etag ----------
          mkdir -p "$(dirname "${STATE_PATH}")"
          if [ -f "${STATE_PATH}" ]; then
            old_etag="$(jq -r '.etag // empty' "${STATE_PATH}" 2>/dev/null || true)"
          else
            old_etag=""
          fi
          old_etag="$(normalize_etag "${old_etag}")"

          # ---------- GET ESI con If-None-Match ----------
          hdr="$(mktemp)"
          body="$(mktemp)"
          esi_request "GET" "${ESI_URL}" "$hdr" "$body" "" "${old_etag}"
          http="$ESI_HTTP"

          new_etag="$(normalize_etag "$(header_value "ETag" "$hdr" || true)")"
          last_modified="$(header_value "Last-Modified" "$hdr" || true)"
          expires="$(header_value "Expires" "$hdr" || true)"

          expires_epoch=""
          lastmod_epoch=""
          if [ -n "$expires" ]; then
            expires_epoch="$(date -u -d "$expires" +%s 2>/dev/null || true)"
          fi
          if [ -n "$last_modified" ]; then
            lastmod_epoch="$(date -u -d "$last_modified" +%s 2>/dev/null || true)"
          fi

          if [ -n "$expires_epoch" ]; then
            final_next_epoch=$((expires_epoch + 300))
          else
            final_next_epoch=$((RUN_START_EPOCH + 300))
          fi

          # outputs por defecto
          set_last_modified="false"
          state_should_update="false"
          final_lastmod_epoch=""
          universe_names_calls=0
          universe_names_missing_ids=0
          used_universe_names="false"

          if [ "$http" = "304" ]; then
            echo "final_next_epoch=${final_next_epoch}" >> "$GITHUB_OUTPUT"
            echo "final_lastmod_epoch=" >> "$GITHUB_OUTPUT"
            echo "set_last_modified=false" >> "$GITHUB_OUTPUT"
            echo "state_should_update=false" >> "$GITHUB_OUTPUT"
            echo "universe_names_calls=0" >> "$GITHUB_OUTPUT"
            echo "universe_names_missing_ids=0" >> "$GITHUB_OUTPUT"
            echo "used_universe_names=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$new_etag" ]; then
            echo "Missing ETag header from ESI" >&2
            exit 1
          fi
          if [ -z "$lastmod_epoch" ]; then
            echo "Missing/invalid Last-Modified header" >&2
            exit 1
          fi

          snapshot_ts_iso="$(date -u -d "@${lastmod_epoch}" +"%Y-%m-%dT%H:%M:%SZ")"
          final_lastmod_epoch="$lastmod_epoch"

          # ---------- BigQuery: crear tabla si no existe ----------
          bq query --project_id="${GCP_PROJECT_ID}" --use_legacy_sql=false \
            "CREATE TABLE IF NOT EXISTS \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
             (
               snapshot_ts TIMESTAMP NOT NULL,
               solarSystem STRING,
               ship_jumps INT64
             )
             PARTITION BY DATE(snapshot_ts)
             CLUSTER BY solarSystem"

          # ---------- BigQuery: existe snapshot? ----------
          snapshot_count="$(bq query --project_id="${GCP_PROJECT_ID}" --use_legacy_sql=false --format=csv \
            --parameter="ts:TIMESTAMP:${snapshot_ts_iso}" \
            "SELECT COUNT(1) AS c
             FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
             WHERE snapshot_ts = @ts" | tail -n1 | tr -d '\r')"

          existing_csv=""
          if [ "${snapshot_count}" != "0" ]; then
            # snapshot ya existe => state estaba mal
            state_should_update="true"
            set_last_modified="true"
            existing_csv="$(mktemp)"
            bq query --project_id="${GCP_PROJECT_ID}" --use_legacy_sql=false --format=csv \
              --parameter="ts:TIMESTAMP:${snapshot_ts_iso}" \
              "SELECT solarSystem
               FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
               WHERE snapshot_ts = @ts" \
              | tail -n +2 > "$existing_csv"
          fi

          should_dump="false"
          if [ -z "$old_etag" ] || [ "$old_etag" != "$new_etag" ]; then
            if [ "${snapshot_count}" = "0" ]; then
              should_dump="true"
            fi
          fi

          if [ "$should_dump" != "true" ] && [ "${snapshot_count}" = "0" ]; then
            echo "final_next_epoch=${final_next_epoch}" >> "$GITHUB_OUTPUT"
            echo "final_lastmod_epoch=" >> "$GITHUB_OUTPUT"
            echo "set_last_modified=false" >> "$GITHUB_OUTPUT"
            echo "state_should_update=false" >> "$GITHUB_OUTPUT"
            echo "universe_names_calls=0" >> "$GITHUB_OUTPUT"
            echo "universe_names_missing_ids=0" >> "$GITHUB_OUTPUT"
            echo "used_universe_names=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "${SDE_SOLARSYSTEMS_GZ}" ]; then
            echo "Missing ${SDE_SOLARSYSTEMS_GZ}" >&2
            exit 1
          fi

          # ---------- calcular missing_ids usando SDE ----------
          missing_ids="$(mktemp)"
          stats_json="$(mktemp)"

          SDE_SOLARSYSTEMS_GZ="${SDE_SOLARSYSTEMS_GZ}" \
          ESI_BODY="$body" \
          MISSING_OUT="$missing_ids" \
          STATS_OUT="$stats_json" \
          python3 .ci/py/sde_missing_ids.py

          sde_map_size="$(jq -r '.sde_map_size' "$stats_json")"
          universe_names_missing_ids="$(jq -r '.missing_ids' "$stats_json")"

          echo "Missing system_id not in SDE: ${universe_names_missing_ids}"

          # ---------- decidir si activar fallback /universe/names ----------
          # Regla: se permite si hay missing > 0 (caso real), y en especial si el SDE parece roto (map_size < threshold).
          allow_fallback="false"
          if [ "${universe_names_missing_ids}" -gt 0 ]; then
            allow_fallback="true"
          fi
          if [ "${sde_map_size}" -lt "${SDE_MIN_MAP_SIZE}" ]; then
            echo "SDE seems suspicious (map_size=${sde_map_size} < ${SDE_MIN_MAP_SIZE}). Fallback allowed."
            allow_fallback="true"
          fi

          names_merged=""
          if [ "${allow_fallback}" = "true" ] && [ -s "$missing_ids" ]; then
            used_universe_names="true"
            split -l 1000 "$missing_ids" /tmp/missing_chunk_

            names_json="$(mktemp)"
            echo "[]" > "$names_json"

            universe_names_calls=0
            for chunk in /tmp/missing_chunk_*; do
              req="$(mktemp)"
              hdr2="$(mktemp)"
              body2="$(mktemp)"
              jq -Rs 'split("\n") | map(select(length>0) | tonumber)' "$chunk" > "$req"

              esi_request "POST" "${ESI_NAMES_URL}" "$hdr2" "$body2" "$req" ""
              universe_names_calls=$((universe_names_calls + 1))

              tmp="$(mktemp)"
              jq -s '.[0] + .[1]' "$names_json" "$body2" > "$tmp"
              mv "$tmp" "$names_json"
            done

            names_merged="$names_json"
          fi

          echo "ESI /universe/names calls performed: ${universe_names_calls}"

          # ---------- construir NDJSON final ----------
          ndjson="$(mktemp)"

          SDE_SOLARSYSTEMS_GZ="${SDE_SOLARSYSTEMS_GZ}" \
          ESI_BODY="$body" \
          NDJSON_OUT="$ndjson" \
          SNAPSHOT_TS_ISO="$snapshot_ts_iso" \
          EXISTING_CSV="${existing_csv:-}" \
          NAMES_JSON="${names_merged:-}" \
          python3 .ci/py/build_ndjson.py

          rowcount="$(wc -l < "$ndjson" | tr -d ' ')"
          echo "Rows to load into BigQuery: ${rowcount}"

          if [ "${rowcount}" -gt 0 ]; then
            bq load \
              --project_id="${GCP_PROJECT_ID}" \
              --source_format=NEWLINE_DELIMITED_JSON \
              "${BQ_DATASET}.${BQ_TABLE}" \
              "$ndjson"
          fi

          # ---------- reglas update state / last_modified ----------
          if [ "$should_dump" = "true" ]; then
            set_last_modified="true"
            state_should_update="true"
          fi
          if [ "$state_should_update" = "true" ]; then
            jq -n --arg etag "$new_etag" '{etag:$etag}' > "${STATE_PATH}"
          fi

          # Outputs
          echo "final_next_epoch=${final_next_epoch}" >> "$GITHUB_OUTPUT"
          echo "final_lastmod_epoch=${final_lastmod_epoch}" >> "$GITHUB_OUTPUT"
          echo "set_last_modified=${set_last_modified}" >> "$GITHUB_OUTPUT"
          echo "state_should_update=${state_should_update}" >> "$GITHUB_OUTPUT"
          echo "universe_names_calls=${universe_names_calls}" >> "$GITHUB_OUTPUT"
          echo "universe_names_missing_ids=${universe_names_missing_ids}" >> "$GITHUB_OUTPUT"
          echo "used_universe_names=${used_universe_names}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9) Commit state si cambió
      # ============================================================
      - name: Commit state (if changed)
        if: success()
        run: |
          set -euo pipefail
          if git diff --quiet -- "${STATE_PATH}"; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${STATE_PATH}"
          git commit -m "chore(state): update system_jumps etag [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push

      # ============================================================
      # 10) FINALIZE SUCCESS — status + next_run + last_modified si toca + resumen universe/names
      # ============================================================
      - name: Finalize (completed)
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FINAL_NEXT_EPOCH: ${{ steps.objective.outputs.final_next_epoch }}
          FINAL_LASTMOD_EPOCH: ${{ steps.objective.outputs.final_lastmod_epoch }}
          SET_LAST_MODIFIED: ${{ steps.objective.outputs.set_last_modified }}
          NAMES_CALLS: ${{ steps.objective.outputs.universe_names_calls }}
          NAMES_MISSING: ${{ steps.objective.outputs.universe_names_missing_ids }}
          USED_NAMES: ${{ steps.objective.outputs.used_universe_names }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          echo "SUMMARY: missing_ids=${NAMES_MISSING}, universe/names_calls=${NAMES_CALLS}, used_universe_names=${USED_NAMES}"

          serial_next="$(awk "BEGIN { printf \"%.10f\", (${FINAL_NEXT_EPOCH}/86400) + 25569 }")"

          if [ "${SET_LAST_MODIFIED}" = "true" ] && [[ "${FINAL_LASTMOD_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${FINAL_LASTMOD_EPOCH}/86400) + 25569 }")"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "{
                \"valueInputOption\":\"RAW\",
                \"data\":[
                  {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                  {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial_next}]]},
                  {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}
                ]
              }"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "{
                \"valueInputOption\":\"RAW\",
                \"data\":[
                  {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                  {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial_next}]]}
                ]
              }"

      # ============================================================
      # 11) FINALIZE FAILURE — status failed + next_run = start+5m
      # ============================================================
      - name: Finalize (failed)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch=$((RUN_START_EPOCH + 300))
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"
