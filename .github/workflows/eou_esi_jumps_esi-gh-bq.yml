missing = []
rows = 0
with open(out_path, "w", encoding="utf-8") as out:
  for rec in data:
    sid = int(rec["system_id"])
    jumps = int(rec.get("ship_jumps", 0))
    name = mp.get(sid)
    if not name:
      missing.append(sid)
      continue
    if existing and name in existing:
      continue
    out.write(json.dumps({
      "snapshot_ts": snapshot_ts,
      "solarSystem": name,
      "ship_jumps": jumps
    }, ensure_ascii=False) + "\n")
    rows += 1

if missing:
  missing = sorted(set(missing))
  raise SystemExit(f"Unmapped system_id(s) after SDE+names fallback: {missing[:25]}")

print(rows)
PY

          rowcount="$(wc -l < "$ndjson" | tr -d ' ')"
          echo "Rows to load into BigQuery: ${rowcount}"

          if [ "${rowcount}" -gt 0 ]; then
            bq load \
              --project_id="${GCP_PROJECT_ID}" \
              --source_format=NEWLINE_DELIMITED_JSON \
              "${BQ_DATASET}.${BQ_TABLE}" \
              "$ndjson"
          fi

          # ---------- actualizar state etag ----------
          # Si volcamos o snapshot ya existía => actualizar etag
          if [ "$should_dump" = "true" ] || [ "${snapshot_count}" != "0" ]; then
            state_should_update="true"
          fi

          # last_modified SOLO si:
          # - volcamos datos correctamente (should_dump=true)
          # - o snapshot ya existía (state roto)
          if [ "$should_dump" = "true" ] || [ "${snapshot_count}" != "0" ]; then
            set_last_modified="true"
          fi

          if [ "$state_should_update" = "true" ]; then
            jq -n --arg etag "$new_etag" '{etag:$etag}' > "${STATE_PATH}"
          fi

          echo "final_next_epoch=${final_next_epoch}" >> "$GITHUB_OUTPUT"
          echo "final_lastmod_epoch=${final_lastmod_epoch}" >> "$GITHUB_OUTPUT"
          echo "set_last_modified=${set_last_modified}" >> "$GITHUB_OUTPUT"
          echo "state_should_update=${state_should_update}" >> "$GITHUB_OUTPUT"
          echo "universe_names_calls=${universe_names_calls}" >> "$GITHUB_OUTPUT"
          echo "universe_names_missing_ids=${universe_names_missing_ids}" >> "$GITHUB_OUTPUT"
          echo "sde_map_size=${sde_map_size}" >> "$GITHUB_OUTPUT"
          echo "sde_ok=${sde_ok}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8) Commit state si cambió
      # ============================================================
      - name: Commit state (if changed)
        if: success()
        run: |
          set -euo pipefail
          if git diff --quiet -- "${STATE_PATH}"; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${STATE_PATH}"
          git commit -m "chore(state): update system_jumps etag [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push

      # ============================================================
      # 9) FINALIZE SUCCESS — status + next_run + (last_modified si procede)
      #     + SUMMARY explícito
      # ============================================================
      - name: Finalize (completed)
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FINAL_NEXT_EPOCH: ${{ steps.objective.outputs.final_next_epoch }}
          FINAL_LASTMOD_EPOCH: ${{ steps.objective.outputs.final_lastmod_epoch }}
          SET_LAST_MODIFIED: ${{ steps.objective.outputs.set_last_modified }}
          NAMES_CALLS: ${{ steps.objective.outputs.universe_names_calls }}
          NAMES_MISSING: ${{ steps.objective.outputs.universe_names_missing_ids }}
          SDE_MAP_SIZE: ${{ steps.objective.outputs.sde_map_size }}
          SDE_OK: ${{ steps.objective.outputs.sde_ok }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          echo "SUMMARY: sde_map_size=${SDE_MAP_SIZE} (ok=${SDE_OK}), missing_ids=${NAMES_MISSING}, universe/names_calls=${NAMES_CALLS}"

          serial_next="$(awk "BEGIN { printf \"%.10f\", (${FINAL_NEXT_EPOCH}/86400) + 25569 }")"

          if [ "${SET_LAST_MODIFIED}" = "true" ] && [[ "${FINAL_LASTMOD_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${FINAL_LASTMOD_EPOCH}/86400) + 25569 }")"

            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "{
                \"valueInputOption\":\"RAW\",
                \"data\":[
                  {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                  {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial_next}]]},
                  {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}
                ]
              }"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "{
                \"valueInputOption\":\"RAW\",
                \"data\":[
                  {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                  {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial_next}]]}
                ]
              }"
          fi

      - name: Finalize (failed)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch=$((RUN_START_EPOCH + 300))
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"
