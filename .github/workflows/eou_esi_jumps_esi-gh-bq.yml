names_path = os.environ.get("NAMES_JSON", "")

id_keys = ["solarSystemID","solarSystemId","solarSystem_id","system_id","id"]
name_keys = ["solarSystem","solarSystemName","name","solarSystemName_en","solarSystem_name"]

existing = set()
if existing_path and os.path.exists(existing_path) and os.path.getsize(existing_path) > 0:
  with open(existing_path, "r", encoding="utf-8") as f:
    for line in f:
      v=line.strip()
      if v:
        existing.add(v)

