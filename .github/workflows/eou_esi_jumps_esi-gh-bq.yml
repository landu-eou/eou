name: ESI System Jumps (ESI → GH → BQ)

on:
  workflow_dispatch:

concurrency:
  group: eou_esi_jumps_esi-gh-bq
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_FILE: eou_esi_jumps_esi-gh-bq.yml

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "5"
      LOCK_TIME: 60

      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: system_jumps

      ESI_URL: https://esi.evetech.net/universe/system_jumps
      ESI_NAMES_URL: https://esi.evetech.net/universe/names

      STATE_PATH: states/system_jumps.json
      SDE_SOLARSYSTEMS_GZ: data/sde/solarsystems.jsonl.gz
      SDE_MIN_MAP_SIZE: "5000"

    steps:
      - name: Guard - decide proceed
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Record run start epoch (UTC)
        run: |
          set -euo pipefail
          echo "RUN_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # ---- AUTH (WIF) ----
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Assert Google credentials file exists
        env:
          CREDS: ${{ steps.gcp_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          test -n "$CREDS"
          test -f "$CREDS"
          ls -la "$CREDS"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # --- Crear programas jq y scripts Python (sin heredocs, sin python -c) ---
      - name: Prepare jq and python files
        env:
          JQ_LOCK: |
            {
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[["in_progress"]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
              ]
            }
          JQ_DONE_NO_LM: |
            {
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[["completed"]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
              ]
            }
          JQ_DONE_WITH_LM: |
            {
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[["completed"]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]},
                {range:($tab+"!I"+$row+":I"+$row), values:[[ $lm ]]}
              ]
            }
          JQ_FAILED: |
            {
              valueInputOption:"RAW",
              data:[
                {range:($tab+"!B"+$row+":B"+$row), values:[["failed"]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
              ]
            }

          PY_SDE_MISSING_IDS: |
            #!/usr/bin/env python3
            import gzip, json, os

            def pick(d, keys):
              for k in keys:
                v = d.get(k)
                if v is not None and str(v).strip() != "":
                  return v
              return None

            ID_KEYS = ["solarSystemID","solarSystemId","solarSystem_id","system_id","id"]
            NAME_KEYS = ["solarSystem","solarSystemName","solarSystem_name","solarSystemName_en","name","solarSystemNameEnglish"]

            def load_sde_map(path):
              mp = {}
              with gzip.open(path, "rt", encoding="utf-8") as f:
                for line in f:
                  line = line.strip()
                  if not line:
                    continue
                  o = json.loads(line)
                  sid = pick(o, ID_KEYS)
                  name = pick(o, NAME_KEYS)
                  if sid is None or name is None:
                    continue
                  try:
                    mp[int(sid)] = str(name)
                  except Exception:
                    continue
              return mp

            def main():
              sde = os.environ["SDE_SOLARSYSTEMS_GZ"]
              esi_body = os.environ["ESI_BODY"]
              missing_out = os.environ["MISSING_OUT"]
              stats_out = os.environ.get("STATS_OUT", "")

              mp = load_sde_map(sde)
              with open(esi_body, "r", encoding="utf-8") as f:
                data = json.load(f)

              missing = []
              for rec in data:
                sid = int(rec["system_id"])
                if sid not in mp:
                  missing.append(sid)

              missing = sorted(set(missing))
              with open(missing_out, "w", encoding="utf-8") as out:
                for sid in missing:
                  out.write(str(sid) + "\n")

              stats = {"sde_map_size": len(mp), "esi_records": len(data), "missing_ids": len(missing)}
              print(f"SDE map size: {stats['sde_map_size']}")
              print(f"ESI records: {stats['esi_records']}")
              print(f"Missing IDs: {stats['missing_ids']}")

              if stats_out:
                with open(stats_out, "w", encoding="utf-8") as f:
                  json.dump(stats, f)

            if __name__ == "__main__":
              main()

          PY_BUILD_NDJSON: |
            #!/usr/bin/env python3
            import gzip, json, os

            def pick(d, keys):
              for k in keys:
                v = d.get(k)
                if v is not None and str(v).strip() != "":
                  return v
              return None

            ID_KEYS = ["solarSystemID","solarSystemId","solarSystem_id","system_id","id"]
            NAME_KEYS = ["solarSystem","solarSystemName","solarSystem_name","solarSystemName_en","name","solarSystemNameEnglish"]

            def load_sde_map(path):
              mp = {}
              with gzip.open(path, "rt", encoding="utf-8") as f:
                for line in f:
                  line = line.strip()
                  if not line:
                    continue
                  o = json.loads(line)
                  sid = pick(o, ID_KEYS)
                  name = pick(o, NAME_KEYS)
                  if sid is None or name is None:
                    continue
                  try:
                    mp[int(sid)] = str(name)
                  except Exception:
                    continue
              return mp

            def load_existing_names(csv_path):
              existing = set()
              if not csv_path:
                return existing
              try:
                with open(csv_path, "r", encoding="utf-8") as f:
                  for line in f:
                    v = line.strip()
                    if v:
                      existing.add(v)
              except FileNotFoundError:
                pass
              return existing

            def merge_names_fallback(mp, names_json_path):
              if not names_json_path:
                return
              try:
                with open(names_json_path, "r", encoding="utf-8") as f:
                  arr = json.load(f)
              except FileNotFoundError:
                return
              for o in arr:
                try:
                  if o.get("category") == "solar_system":
                    mp[int(o["id"])] = str(o["name"])
                except Exception:
                  pass

            def main():
              sde = os.environ["SDE_SOLARSYSTEMS_GZ"]
              esi_body = os.environ["ESI_BODY"]
              ndjson_out = os.environ["NDJSON_OUT"]
              snapshot_ts = os.environ["SNAPSHOT_TS_ISO"]
              existing_csv = os.environ.get("EXISTING_CSV", "")
              names_json = os.environ.get("NAMES_JSON", "")

              mp = load_sde_map(sde)
              merge_names_fallback(mp, names_json)
              existing = load_existing_names(existing_csv)

              with open(esi_body, "r", encoding="utf-8") as f:
                data = json.load(f)

              missing = []
              rows = 0
              with open(ndjson_out, "w", encoding="utf-8") as out:
                for rec in data:
                  sid = int(rec["system_id"])
                  jumps = int(rec.get("ship_jumps", 0))
                  name = mp.get(sid)
                  if not name:
                    missing.append(sid)
                    continue
                  if existing and name in existing:
                    continue
                  out.write(json.dumps({
                    "snapshot_ts": snapshot_ts,
                    "solarSystem": name,
                    "ship_jumps": jumps
                  }, ensure_ascii=False) + "\n")
                  rows += 1

              if missing:
                missing = sorted(set(missing))
                raise SystemExit(f"Unmapped system_id(s) after fallback: {missing[:25]}")

              print(rows)

            if __name__ == "__main__":
              main()
        run: |
          set -euo pipefail
          mkdir -p .ci/jq .ci/py

          printf '%s' "$JQ_LOCK" > .ci/jq/lock.json.jq
          printf '%s' "$JQ_DONE_NO_LM" > .ci/jq/done_no_lm.json.jq
          printf '%s' "$JQ_DONE_WITH_LM" > .ci/jq/done_with_lm.json.jq
          printf '%s' "$JQ_FAILED" > .ci/jq/failed.json.jq

          printf '%s' "$PY_SDE_MISSING_IDS" > .ci/py/sde_missing_ids.py
          printf '%s' "$PY_BUILD_NDJSON" > .ci/py/build_ndjson.py
          chmod +x .ci/py/sde_missing_ids.py .ci/py/build_ndjson.py
          python3 -m py_compile .ci/py/sde_missing_ids.py
          python3 -m py_compile .ci/py/build_ndjson.py

      - name: Initial lock (Sheets)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          payload="$(mktemp)"
          jq -n -f .ci/jq/lock.json.jq \
            --arg tab "${SHEET_TAB}" \
            --arg row "${row}" \
            --argjson next "${serial}" \
            > "$payload"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d @"$payload"

      # ---- OBJECTIVE (idéntico al tuyo ya estable) ----
      - name: OBJECTIVE - ESI System Jumps -> BigQuery
        id: objective
        run: |
          set -euo pipefail
          # (Aquí va tu bloque OBJECTIVE estable tal cual lo tienes funcionando)
          # No lo repito para no introducir cambios no solicitados.
          # Importante: debe seguir seteando outputs:
          # final_next_epoch, final_lastmod_epoch, set_last_modified
          # universe_names_calls, universe_names_missing_ids, used_universe_names

          echo "final_next_epoch=$((RUN_START_EPOCH+300))" >> "$GITHUB_OUTPUT"
          echo "final_lastmod_epoch=" >> "$GITHUB_OUTPUT"
          echo "set_last_modified=false" >> "$GITHUB_OUTPUT"
          echo "universe_names_calls=0" >> "$GITHUB_OUTPUT"
          echo "universe_names_missing_ids=0" >> "$GITHUB_OUTPUT"
          echo "used_universe_names=false" >> "$GITHUB_OUTPUT"

      - name: Finalize (completed)
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FINAL_NEXT_EPOCH: ${{ steps.objective.outputs.final_next_epoch }}
          FINAL_LASTMOD_EPOCH: ${{ steps.objective.outputs.final_lastmod_epoch }}
          SET_LAST_MODIFIED: ${{ steps.objective.outputs.set_last_modified }}
          NAMES_CALLS: ${{ steps.objective.outputs.universe_names_calls }}
          NAMES_MISSING: ${{ steps.objective.outputs.universe_names_missing_ids }}
          USED_NAMES: ${{ steps.objective.outputs.used_universe_names }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          echo "SUMMARY: missing_ids=${NAMES_MISSING}, universe/names_calls=${NAMES_CALLS}, used_universe_names=${USED_NAMES}"

          serial_next="$(awk "BEGIN { printf \"%.10f\", (${FINAL_NEXT_EPOCH}/86400) + 25569 }")"
          payload="$(mktemp)"

          if [ "${SET_LAST_MODIFIED}" = "true" ] && [[ "${FINAL_LASTMOD_EPOCH:-}" =~ ^[0-9]+$ ]]; then
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${FINAL_LASTMOD_EPOCH}/86400) + 25569 }")"
            jq -n -f .ci/jq/done_with_lm.json.jq \
              --arg tab "${SHEET_TAB}" \
              --arg row "${row}" \
              --argjson next "${serial_next}" \
              --argjson lm "${lm_serial}" \
              > "$payload"
          else
            jq -n -f .ci/jq/done_no_lm.json.jq \
              --arg tab "${SHEET_TAB}" \
              --arg row "${row}" \
              --argjson next "${serial_next}" \
              > "$payload"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d @"$payload"

      - name: Finalize (failed)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch=$((RUN_START_EPOCH + 300))
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          payload="$(mktemp)"
          jq -n -f .ci/jq/failed.json.jq \
            --arg tab "${SHEET_TAB}" \
            --arg row "${row}" \
            --argjson next "${serial}" \
            > "$payload"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d @"$payload"
