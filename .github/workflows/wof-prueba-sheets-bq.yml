name: Prueba GH -> Sheets(row2) + BigQuery(timestamp)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # Sheets
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "2"         # <- fila 2
      WORKFLOW_FILE: wof-prueba-sheets-bq.yml

      # BigQuery (ajusta si tu tabla/dataset difiere)
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: prueba_aps_tick

    steps:
      - name: Guard - exit if overlapping run existed (no cancel)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${api}")"

          this="$(echo "$json" | jq --arg rid "$RUN_ID" '
            .workflow_runs
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ')"
          if [ -z "$this" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          this_created="$(echo "$this" | jq -r '.created_at')"
          this_num="$(echo "$this" | jq -r '.run_number')"

          # Si un run anterior siguió vivo después de que este se creara => este run es redundante
          alive_at_creation="$(echo "$json" | jq --arg rid "$RUN_ID" --arg tc "$this_created" '
            [.workflow_runs[]
              | select(.id != ($rid|tonumber))
              | select(.created_at < $tc)
              | select(.updated_at > $tc)
            ] | length')"

          if [ "$alive_at_creation" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Líder determinista entre activos (queued/in_progress): solo el menor run_number sigue
          leader="$(echo "$json" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress") | .run_number] | min // empty')"
          if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Auth to Google (WIF) - access token for Sheets + cloud-platform
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: If skipped (busy) - write minimal status and set next_run (+6m) then exit
        if: steps.guard.outputs.proceed != 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+6 minutes" +"%F %T")"

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"

          echo "Skipped due to overlap/busy. Exiting."
          exit 0

      - name: Mark running in Sheets (B2=running)
        if: steps.guard.outputs.proceed == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"running\"]]}
              ]
            }"

      - name: Setup gcloud
        if: steps.guard.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: BigQuery - insert timestamp row (test)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          now_iso="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bq query --project_id="${GCP_PROJECT_ID}" --use_legacy_sql=false \
            "INSERT INTO \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\` (ts_utc, source)
             VALUES (TIMESTAMP('${now_iso}'), '${WORKFLOW_FILE}');"

      - name: Mark completed and next_run (+6m from finish)
        if: steps.guard.outputs.proceed == 'true' && success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+6 minutes" +"%F %T")"

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"

      - name: Mark failed and next_run (+6m from finish)
        if: steps.guard.outputs.proceed == 'true' && failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+6 minutes" +"%F %T")"

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"
