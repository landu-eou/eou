name: TEMPLATE - GH → Sheets (guard + lock + cooldown) + OBJECTIVE

on:
  workflow_dispatch:

# Permisos:
# - actions:read  -> leer runs del workflow (Guard)
# - id-token:write -> WIF/OIDC hacia Google (sin claves)
permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # =====================================================================
      # 0) CONFIGURACIÓN (CAMBIAS ESTO POR WORKFLOW)
      # =====================================================================

      # --- Identidad del workflow ---
      # IMPORTANTE: debe coincidir con el filename real en .github/workflows/
      WORKFLOW_FILE: wof-prueba-sheets-bq.yml   # <-- CAMBIAR en cada workflow

      # --- Google Sheets (estado compartido) ---
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "2"                 # <-- CAMBIAR (fila en tab workflows)

      # --- Locking / planificación ---
      LOCK_TIME: 60        # segundos: al arrancar => next_run = now + LOCK_TIME
      COOLDOWN: 660        # segundos: al terminar => next_run = now + COOLDOWN

      # --- BigQuery (si tu objetivo lo usa) ---
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: prueba_aps_tick

    steps:
      # =====================================================================
      # 1) GUARD (COMÚN) — decide si este run debe trabajar o salir (busy)
      #
      # Política:
      # - Si este run fue creado mientras otro run anterior seguía “vivo”
      #   (updated_at > this_created), entonces SALIR.
      # - Si hay varios runs activos (queued/in_progress), solo el "líder"
      #   (menor run_number) trabaja. Los demás SALEN.
      #
      # Resultado: steps.guard.outputs.proceed = true/false
      # =====================================================================

      - name: Guard - compute decision
        id: guard_calc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "$proceed" > /tmp/proceed

      - name: Guard - publish decision
        id: guard
        run: |
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 2) AUTH GOOGLE (COMÚN) — WIF/OIDC (sin claves)
      #    Produce: steps.gcp_auth.outputs.access_token
      # =====================================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # =====================================================================
      # 3) BUSY EXIT (COMÚN) — si no procede, salir sin tocar nada
      #    (mantengo EXACTAMENTE tu comportamiento actual)
      # =====================================================================
      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # =====================================================================
      # 4) LOCK INICIAL (COMÚN) — status=in_progress + next_run=now+LOCK_TIME
      # =====================================================================
      - name: Initial lock (in_progress + next_run)
        if: steps.guard.outputs.proceed == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+${LOCK_TIME} seconds" +"%F %T")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"

      # =====================================================================
      # =====================================================================
      # 5) ✅ SECCIÓN OBJETIVO (ESTO ES LO QUE CAMBIA ENTRE WORKFLOWS)
      #
      # Reglas:
      # - TODO lo “útil” va aquí.
      # - Si este bloque no existe, el workflow no hace nada.
      # - Debe respetar que NO hay gateway: escribe a Sheets/BQ directamente.
      #
      # Plantilla:
      #   - Setup de herramientas necesarias
      #   - Trabajo objetivo real (ETL, consultas, descargas, etc.)
      # =====================================================================
      # =====================================================================

      # --- Ejemplo Objetivo: BigQuery LOAD de una fila (tu caso actual) ---
      - name: Setup gcloud (needed by Objective)
        if: steps.guard.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: OBJECTIVE - BigQuery LOAD timestamp row
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          now_iso="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > row.json <<EOF
          {"ts_utc":"${now_iso}","source":"${WORKFLOW_FILE}"}
          EOF

          bq load \
            --project_id="${GCP_PROJECT_ID}" \
            --source_format=NEWLINE_DELIMITED_JSON \
            "${BQ_DATASET}.${BQ_TABLE}" \
            row.json

      # =====================================================================
      # 6) FINALIZE (COMÚN) — completed/failed + next_run=now+COOLDOWN
      # =====================================================================

      - name: Finalize (completed + cooldown)
        if: steps.guard.outputs.proceed == 'true' && success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+${COOLDOWN} seconds" +"%F %T")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"

      - name: Finalize (failed + cooldown)
        if: steps.guard.outputs.proceed == 'true' && failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          next="$(date -u -d "+${COOLDOWN} seconds" +"%F %T")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[\"${next}\"]]}
              ]
            }"
