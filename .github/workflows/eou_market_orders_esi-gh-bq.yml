name: ESI Market Orders (ESI → GH)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write  # OBLIGATORIO para WIF/OIDC

concurrency:
  group: eou_market_orders_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WORKFLOW_FILE: eou_market_orders_esi-gh-bq.yml

      # Sheets orchestration
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "11"
      LOCK_TIME: "180"

      # Tokens policy (EXACT like ESI Structures)
      PRIMARY_CHAR_ID: "2124070822"
      RETRY_BUDGET: "3"

      # ESI
      ESI_BASE_URL: https://esi.evetech.net
      ESI_DATASOURCE: tranquility

      # Worker sizing (dynamic within min/max)
      REGIONS_WORKERS_MIN: "2"
      REGIONS_WORKERS_MAX: "6"
      REGIONS_TARGET_PAGES_PER_WORKER: "220"

      STRUCTS_WORKERS_MIN: "1"
      STRUCTS_WORKERS_MAX: "3"
      STRUCTS_TARGET_PAGES_PER_WORKER: "60"

      # Inputs (source of truth)
      SDE_REGIONS_PATH: data/sde/regions.jsonl.gz
      SDE_TYPES_PATH: data/sde/types.jsonl.gz
      SDE_EXCLUDED_TYPES_PATH: data/sde/excludedMarketTypes.jsonl.gz
      SDE_STATIONS_PATH: data/sde/stations.jsonl.gz
      SDE_SOLARSYSTEMS_PATH: data/sde/solarsystems.jsonl.gz
      STRUCTURES_FILE: data/esi/structures.jsonl.gz

      # Jita44
      JITA44_LOCATION_ID: "60003760"

      # Cache pages
      PAGES_CACHE_PATH: states/market_orders_pages.json

      # Output
      OUT_DIR: .tmp_eou_market_orders

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Anti-queue guard (exit if another run is in progress)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/esi/eou_market_orders_esi-gh-bq_guard.sh

      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements/esi/eou_market_orders_esi-gh-bq_requirements.txt

      - name: Sheets init (status=in progress, next_run=now+LOCK_TIME)
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py init

      - name: Run (ESI ingest → local outputs + pages cache temp)
        id: run
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_run.py | tee /tmp/objective_out.txt
          grep -E '^(max_expires_epoch|max_last_modified_epoch)=' /tmp/objective_out.txt >> "$GITHUB_OUTPUT" || true

      - name: Sheets finalize (status=completed, next_run=max(Expires)+5m, last_modified)
        if: success()
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          MAX_EXPIRES_EPOCH: ${{ steps.run.outputs.max_expires_epoch }}
          MAX_LAST_MODIFIED_EPOCH: ${{ steps.run.outputs.max_last_modified_epoch }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py finalize

      - name: Commit pages cache (only on success)
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PAGES_CACHE_PATH}" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "EOU: update market orders pages cache"
          git push

      - name: Sheets fail (status=failed, next_run=now+5m)
        if: failure()
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py fail
