name: ESI Market Orders (ESI → GH Actions)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_market_orders_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WORKFLOW_FILE: eou_market_orders_esi-gh-bq.yml

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "11"
      LOCK_TIME: "180"

      PRIMARY_CHAR_ID: "2124070822"
      RETRY_BUDGET: "3"

      ESI_BASE_URL: https://esi.evetech.net
      ESI_DATASOURCE: tranquility

      REGIONS_WORKERS_MIN: "2"
      REGIONS_TARGET_PAGES_PER_WORKER: "220"
      STRUCTS_WORKERS_MIN: "1"
      STRUCTS_TARGET_PAGES_PER_WORKER: "60"

      SDE_REGIONS_PATH: data/sde/regions.jsonl.gz
      SDE_TYPES_PATH: data/sde/types.jsonl.gz
      SDE_STATIONS_PATH: data/sde/stations.jsonl.gz
      STRUCTURES_FILE: data/esi/structures.jsonl.gz

      PAGES_CACHE_PATH: states/market_orders_pages.json
      HUBS_PATH: data/esi/hubs.json
      ORDERS_PATH: data/esi/Orders.jsonl

      OUT_DIR: .tmp_eou_market_orders

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard - exit if another run is in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "guard: checking in-progress runs for ${REPO}..."
          resp="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress&per_page=100")"

          other_count="$(echo "${resp}" | jq -r --arg rid "${RUN_ID}" '
            [.workflow_runs[] | select((.id|tostring) != $rid)] | length
          ')"

          if [ "${other_count}" != "0" ]; then
            echo "guard: another run is in_progress (${other_count}). exiting without work."
            exit 0
          fi

          echo "guard: ok (no other in_progress runs)."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements/esi/eou_market_orders_esi-gh-bq_requirements.txt

      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Sheets init
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py init

      - name: Run market orders
        id: run_market
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          python scripts/esi/eou_market_orders_esi-gh-bq_run.py | tee /tmp/objective_out.txt
          grep -E '^(max_expires_epoch|max_last_modified_epoch)=' /tmp/objective_out.txt >> "$GITHUB_OUTPUT" || true

      # ✅ FIX: commit primero (local), luego pull --rebase, luego push
      - name: Commit outputs (pages cache + hubs + Orders.jsonl)
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${PAGES_CACHE_PATH}" "${HUBS_PATH}" "${ORDERS_PATH}" || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "EOU: update market orders cache + hubs + Orders"

          # Ahora el working tree está limpio → ya se puede rebase
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "${GITHUB_REF_NAME}"

      - name: Sheets finalize (success)
        if: ${{ success() }}
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          MAX_EXPIRES_EPOCH: ${{ steps.run_market.outputs.max_expires_epoch }}
          MAX_LAST_MODIFIED_EPOCH: ${{ steps.run_market.outputs.max_last_modified_epoch }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py finalize_success

      - name: Sheets finalize (failure)
        if: ${{ failure() }}
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_sheets.py finalize_failure
