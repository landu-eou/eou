name: ESI Market Orders (ESI → GH Artifact + Pages Cache)

on:
  workflow_dispatch:

permissions:
  actions: read          # para el guard (listar runs)
  contents: write        # commit de states/market_orders_pages.json
  # id-token: write      # (ya no hace falta, sin GCP/BQ)

concurrency:
  group: eou_market_orders_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      WORKFLOW_FILE: eou_market_orders_esi-gh-bq.yml

      # Sheets
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "11"
      LOCK_TIME: "180"               # segundos

      # Tokens (igual que ESI Structures)
      PRIMARY_CHAR_ID: "2124070822"
      RETRY_BUDGET: "3"

      # ESI
      ESI_BASE_URL: https://esi.evetech.net
      ESI_DATASOURCE: tranquility

      # Inputs
      STRUCTURES_FILE: data/esi/structures.jsonl.gz
      JITA44_LOCATION_ID: "60003760"

      SDE_TYPES_PATH: data/sde/types.jsonl.gz
      SDE_EXCLUDED_TYPES_PATH: data/sde/excludedMarketTypes.jsonl.gz
      SDE_STATIONS_PATH: data/sde/stations.jsonl.gz
      SDE_SOLARSYSTEMS_PATH: data/sde/solarsystems.jsonl.gz
      SDE_REGIONS_PATH: data/sde/regions.jsonl.gz

      # Cache pages (repo)
      PAGES_CACHE_PATH: states/market_orders_pages.json

      # Out dir (runner local)
      OUT_DIR: .tmp_eou_market_orders

      # Workers (dinámicos dentro de rango)
      REGIONS_WORKERS_MIN: "2"
      REGIONS_WORKERS_MAX: "6"
      STRUCTS_WORKERS_MIN: "1"
      STRUCTS_WORKERS_MAX: "3"

      # Heurística: pages (cache) / target → workers
      TARGET_PAGES_PER_WORKER_REGIONS: "250"
      TARGET_PAGES_PER_WORKER_STRUCTS: "120"

      # Artifact final (único)
      ARTIFACT_RETENTION_DAYS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements/esi/eou_market_orders_esi-gh-bq_requirements.txt

      # ----------------------------------------------------------------------
      # Guard anti-colas (si ya hay otro run in_progress, este run sale)
      # ----------------------------------------------------------------------
      - name: Guard (exit if another run is in progress)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?status=in_progress&per_page=50"
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")"

          # Cuenta runs in_progress excluyendo este RUN_ID
          other_count="$(python - <<'PY'
import json, os
data=json.loads(os.environ["JSON"])
run_id=int(os.environ["RUN_ID"])
runs=data.get("workflow_runs", [])
c=0
for r in runs:
  try:
    if int(r.get("id"))!=run_id:
      c+=1
  except Exception:
    pass
print(c)
PY
          )"

          if [ "${other_count}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Guard: another run in progress (${other_count}). Exiting without work."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Guard: no other run in progress."
          fi
        shell: bash
        env:
          JSON: ${{ steps.guard.outputs.json }}

      # ----------------------------------------------------------------------
      # Inicial: status=in progress y next_run=now + LOCK_TIME
      # ----------------------------------------------------------------------
      - name: Set Sheets status=in progress (initial)
        if: steps.guard.outputs.skip == 'false'
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ secrets.GOOGLE_SHEETS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_run.py --sheets-initial

      # ----------------------------------------------------------------------
      # Run principal
      # ----------------------------------------------------------------------
      - name: Run ESI market orders (single-job workers)
        if: steps.guard.outputs.skip == 'false'
        id: run
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ secrets.GOOGLE_SHEETS_ACCESS_TOKEN }}
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_run.py | tee /tmp/objective_out.txt

          # Publicar outputs para finalize
          grep -E '^(max_expires_epoch|max_last_modified_epoch|run_completed)=' /tmp/objective_out.txt >> "$GITHUB_OUTPUT" || true

      # Artifact final único (si completed)
      - name: Upload artifact (final output)
        if: steps.guard.outputs.skip == 'false' && steps.run.outputs.run_completed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: eou_market_orders_output
          path: .tmp_eou_market_orders/final_outputs/**
          retention-days: 1

      # Commit del cache pages (si completed)
      - name: Commit pages cache
        if: steps.guard.outputs.skip == 'false' && steps.run.outputs.run_completed == '1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add states/market_orders_pages.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update market orders pages cache"
          git push

      # ----------------------------------------------------------------------
      # Finalize: status completed/failed, next_run, last_modified
      # ----------------------------------------------------------------------
      - name: Finalize Sheets (completed/failed)
        if: steps.guard.outputs.skip == 'false'
        env:
          GOOGLE_SHEETS_ACCESS_TOKEN: ${{ secrets.GOOGLE_SHEETS_ACCESS_TOKEN }}
          MAX_EXPIRES_EPOCH: ${{ steps.run.outputs.max_expires_epoch }}
          MAX_LAST_MODIFIED_EPOCH: ${{ steps.run.outputs.max_last_modified_epoch }}
          RUN_COMPLETED: ${{ steps.run.outputs.run_completed }}
        run: |
          set -euo pipefail
          python scripts/esi/eou_market_orders_esi-gh-bq_run.py --sheets-finalize

      - name: Done (guarded run skipped)
        if: steps.guard.outputs.skip == 'true'
        run: |
          echo "Skipped due to concurrency guard."
