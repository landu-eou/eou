name: SDE Routes to Jita (Safer, penalty=100)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SDEroutes.jsonl.gz
        run: |
          python -u scripts/build_sde_routes_to_jita.py

      - name: Commit & push (safe)
        run: |
          set -euo pipefail

          TARGET="data/test/SDEroutes.jsonl.gz"

          # Detecta cambios aunque el fichero sea nuevo (untracked)
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "No changes."
            exit 0
          fi

          # Validación rápida: gz válido
          gzip -t "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Añadir y commitear
          git add -- "$TARGET"
          git commit -m "test: rebuild SDEroutes to Jita (safer penalty=100)"

          # Sincronizar con remoto y reintentar push (evita non-fast-forward)
          # Reintentos por si hay carreras con otros workflows.
          for i in 1 2 3; do
            echo "Sync attempt $i/3"

            # Trae cambios remotos y rehace tu commit encima
            git fetch origin main
            git rebase origin/main

            # Intentar push
            if git push origin HEAD:main; then
              echo "Push OK"
              exit 0
            fi

            echo "Push failed, retrying after short delay..."
            sleep $((i * 2))
          done

          echo "Push failed after retries."
          exit 1
