name: SDE Routes to Jita (Safer, penalty=100)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_sde_routes_test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SDEroutes.jsonl.gz
        run: |
          python -u scripts/build_sde_routes_to_jita.py

      - name: Commit changes (if any)
        run: |
          set -e

          TARGET="data/test/SDEroutes.jsonl.gz"

          # Detecta cambios aunque el fichero sea nuevo (untracked)
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "No changes."
            exit 0
          fi

          # Validación rápida: gz válido
          gzip -t "$TARGET"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "$TARGET"
          git commit -m "test: rebuild SDEroutes to Jita (safer penalty=100)"
          git push
