# =======================
# PARTE INICIAL (lo que cambias para un clon)
# =======================

name: Access Token Refresh (SSO → GH)                            # <-- 001 CAMBIA el nombre visible del workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: eou_sso_at_refresh             # <-- 002 CAMBIA (debe estar también en ALLOW del gateway)
      WORKFLOW_NAME: "Access Token Refresh (SSO → GH)"          # <-- 001 CAMBIA el nombre visible del workflow
      SHEET_ROW: "2"                             # <-- 003 CAMBIA (fila del tab 'workflows' que va a tocar)
      EXPIRES: "900"                              # <-- 004 (opcional) cambia si quieres otra cadencia
      LOCK_SECONDS: "120"                          # <-- 005 (opcional) cambia si quieres otro lock

    steps:
      - name: Preflight
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"
          # canonical = workflow_id|wf_name|row|phase|expires|lock_seconds|conclusion|now_ms
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on START: $RESP"
            exit 1
          fi
          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

# =======================
# PARTE FUNCIÓN (solo cambia si cambia la función del workflow)
# =======================

      - name: DO WORK (dummy)
        run: sleep 3

# =======================
# PARTE FINAL (normalmente NO la tocas para un clon)
# =======================

      - name: FINISH
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW_MS="$(date -u +%s%3N)"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on FINISH: $RESP"
            exit 1
          fi
