# FILE TREE — RQ Gate Kills (RQ → GH → BQ)
# .
# ├── .github/
# │   └── workflows/
# │       └── eou_gate_kills_rq-gh-bq.yml
# │
# ├── data/
# │   ├── rq/
# │   │   └── raw_kills.jsonl                # Cola duradera (NDJSON, append + rewrite por enrich)
# │   │
# │   └── sde/
# │       ├── stargates.jsonl.gz             # Mapa stargateID → (stargate, group, solarSystem)
# │       └── types.jsonl.gz                 # typeID → (group, category, is_gategank)
# │
# ├── scripts/
# │   └── rq/
# │       ├── eou_gate_kills_poll.py         # RedisQ poller → filtra + flush a raw_kills.jsonl
# │       ├── eou_gate_kills_enrich.py       # ESI enrich 1x1 → NDJSON batch + requeue RAW
# │       ├── eou_gate_kills_load.py         # Dedupe + bq load (1 job)
# │       ├── eou_gate_kills_sheets_write.py # Sheets status/next_run/last_modified
# │       └── eou_gate_kills_ship_class.py   # Mapeo category/group → ship_class
# │
# └── (temporal en runtime)
#     ├── /tmp/gate_kills_batch.ndjson
#     ├── /tmp/gate_kills_enrich_pending.ndjson
#     ├── /tmp/gate_kills_enrich_post_poll.ndjson
#     ├── /tmp/gate_kills_to_load.ndjson
#     └── /tmp/gate_kills_schema.json
#


name: RQ Gate Kills (RQ → GH → BQ)

on:
  workflow_dispatch:
    inputs:
      queue_suffix:
        description: "Suffix opcional para queueID (pruebas/reset cola). Puede ser vacío."
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write
  id-token: write

# Candado oficial (GitHub): evita paralelismo del mismo workflow.
concurrency:
  group: eou_gate_kills_rq-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      WORKFLOW_FILE: eou_gate_kills_rq-gh-bq.yml

      # Sheets: solo escritura (status/next_run/last_modified) para orquestación externa.
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "7"
      LOCK_TIME: 1800

      # BigQuery
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: gate_kills

      # RedisQ
      REDISQ_BASE: https://zkillredisq.stream/listen.php
      POLL_MAX_SECONDS: 1200
      NULL_STREAK_MAX: 10
      TTW: 1

      # Repo state
      RAW_FILE: data/rq/raw_kills.jsonl
      SDE_STARGATES_GZ: data/sde/stargates.jsonl.gz
      SDE_TYPES_GZ: data/sde/types.jsonl.gz

      PYTHONUNBUFFERED: "1"

    steps:
      # ==========================================================
      # 1) GUARD: anti-cola/anti-solape (1 step, outputs oficiales)
      # ==========================================================
      - name: Guard (anti-overlap / anti-queue)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=40"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"
          reason="ok"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -z "$this" ]; then
            proceed="true"
            reason="this_not_found"
          else
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
              reason="overlap_at_creation"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
                reason="not_leader"
              fi
            fi
          fi

          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 2) CHECKOUT + PYTHON (solo si proceed=true)
      # ==========================================================
      - name: Checkout
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure raw queue file exists
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RAW_FILE}")"
          if [ ! -f "${RAW_FILE}" ]; then
            : > "${RAW_FILE}"
            git add "${RAW_FILE}"
            git commit -m "rq: create raw_kills queue file" || true
            git push || true
          fi

      # ==========================================================
      # 3) AUTH GOOGLE — WIF/OIDC (solo si proceed=true)
      # ==========================================================
      - name: Auth to Google (WIF)
        if: steps.guard.outputs.proceed == 'true'
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        if: steps.guard.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # ==========================================================
      # 4) FASE INICIO — status=in progress + next_run lock
      # ==========================================================
      - name: Phase start (in progress + next_run lock)
        if: steps.guard.outputs.proceed == 'true'
        env:
          SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_sheets_write.py \
            --sheets-id "${SHEETS_ID}" \
            --tab "${SHEET_TAB}" \
            --row "${SHEETS_WORKFLOW_ROW}" \
            --status "in progress" \
            --next-run-seconds "${LOCK_TIME}"

      # ==========================================================
      # 5) Enrich pendientes (#1)
      # ==========================================================
      - name: Init batch file
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          : > /tmp/gate_kills_batch.ndjson

      - name: Enrich pending kills (ESI 1x1, filter2, requeue)
        if: steps.guard.outputs.proceed == 'true'
        id: enrich_1
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_enrich.py \
            --raw "${RAW_FILE}" \
            --sde-stargates "${SDE_STARGATES_GZ}" \
            --sde-types "${SDE_TYPES_GZ}" \
            --mode pending \
            --repo "${GITHUB_REPOSITORY}"

      - name: Persist raw queue after enrich #1 (if changed)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "${RAW_FILE}"; then
            git add "${RAW_FILE}"
            git commit -m "rq: enrich requeue update (phase 1)" || true
            git push || true
          fi

      - name: Append enrich #1 NDJSON to batch
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          p="${{ steps.enrich_1.outputs.ndjson_path }}"
          if [ -n "$p" ] && [ -s "$p" ]; then
            cat "$p" >> /tmp/gate_kills_batch.ndjson
          fi

      # ==========================================================
      # 6) Heartbeat antes del poll (lock)
      # ==========================================================
      - name: Heartbeat before poll (next_run lock)
        if: steps.guard.outputs.proceed == 'true'
        env:
          SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_sheets_write.py \
            --sheets-id "${SHEETS_ID}" \
            --tab "${SHEET_TAB}" \
            --row "${SHEETS_WORKFLOW_ROW}" \
            --next-run-seconds "${LOCK_TIME}"

      # ==========================================================
      # 7) Poll RedisQ + flush duradero cada minuto
      # ==========================================================
      - name: Poll RedisQ (flush each minute to raw_kills.jsonl)
        if: steps.guard.outputs.proceed == 'true'
        id: poll
        env:
          QUEUE_SUFFIX: ${{ inputs.queue_suffix }}
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_poll.py \
            --base "${REDISQ_BASE}" \
            --raw "${RAW_FILE}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --queue-suffix "${QUEUE_SUFFIX}" \
            --ttw "${TTW}" \
            --poll-max-seconds "${POLL_MAX_SECONDS}" \
            --null-max "${NULL_STREAK_MAX}" \
            --busy-429-max 8

      # ==========================================================
      # 8) Enrich post-poll (#2)
      # ==========================================================
      - name: Enrich new kills (ESI 1x1, filter2, requeue)
        if: steps.guard.outputs.proceed == 'true'
        id: enrich_2
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_enrich.py \
            --raw "${RAW_FILE}" \
            --sde-stargates "${SDE_STARGATES_GZ}" \
            --sde-types "${SDE_TYPES_GZ}" \
            --mode post_poll \
            --repo "${GITHUB_REPOSITORY}"

      - name: Persist raw queue after enrich #2 (if changed)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "${RAW_FILE}"; then
            git add "${RAW_FILE}"
            git commit -m "rq: enrich requeue update (phase 2)" || true
            git push || true
          fi

      - name: Append enrich #2 NDJSON to batch
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          p="${{ steps.enrich_2.outputs.ndjson_path }}"
          if [ -n "$p" ] && [ -s "$p" ]; then
            cat "$p" >> /tmp/gate_kills_batch.ndjson
          fi

      # ==========================================================
      # 9) BigQuery: solo si hay payload
      # ==========================================================
      - name: Detect payload
        if: steps.guard.outputs.proceed == 'true'
        id: payload
        run: |
          set -euo pipefail
          if [ -s /tmp/gate_kills_batch.ndjson ]; then
            echo "has_payload=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load batch to BigQuery (dedupe + 1 load job)
        if: steps.payload.outputs.has_payload == 'true'
        id: load_bq
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_load.py \
            --project "${GCP_PROJECT_ID}" \
            --dataset "${BQ_DATASET}" \
            --table "${BQ_TABLE}" \
            --batch "/tmp/gate_kills_batch.ndjson"

      # ==========================================================
      # 10) FINAL — status + next_run + last_modified
      # ==========================================================
      - name: Finalize (completed + next_run + last_modified)
        if: success() && steps.guard.outputs.proceed == 'true'
        env:
          SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail

          reason="${{ steps.poll.outputs.poll_reason }}"
          cooldown=1800
          if [ "$reason" = "timeout" ]; then cooldown=300; fi
          if [ "$reason" = "null_streak" ]; then cooldown=1800; fi
          if [ "$reason" = "redisq_busy" ]; then cooldown=1800; fi

          max_iso=""
          iso1="${{ steps.enrich_1.outputs.max_killmail_time_iso }}"
          iso2="${{ steps.enrich_2.outputs.max_killmail_time_iso }}"

          if [ -n "$iso1" ]; then max_iso="$iso1"; fi
          if [ -n "$iso2" ]; then
            if [ -z "$max_iso" ]; then
              max_iso="$iso2"
            else
              e1="$(date -u -d "$max_iso" +%s || echo 0)"
              e2="$(date -u -d "$iso2" +%s || echo 0)"
              if [ "$e2" -gt "$e1" ]; then max_iso="$iso2"; fi
            fi
          fi

          if [ -n "$max_iso" ]; then
            python scripts/rq/eou_gate_kills_sheets_write.py \
              --sheets-id "${SHEETS_ID}" \
              --tab "${SHEET_TAB}" \
              --row "${SHEETS_WORKFLOW_ROW}" \
              --status "completed" \
              --next-run-seconds "${cooldown}" \
              --last-modified-iso "$max_iso"
          else
            python scripts/rq/eou_gate_kills_sheets_write.py \
              --sheets-id "${SHEETS_ID}" \
              --tab "${SHEET_TAB}" \
              --row "${SHEETS_WORKFLOW_ROW}" \
              --status "completed" \
              --next-run-seconds "${cooldown}"
          fi

      - name: Finalize (failed + next_run)
        if: failure() && steps.guard.outputs.proceed == 'true'
        env:
          SHEETS_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_sheets_write.py \
            --sheets-id "${SHEETS_ID}" \
            --tab "${SHEET_TAB}" \
            --row "${SHEETS_WORKFLOW_ROW}" \
            --status "failed" \
            --next-run-seconds "1800"
