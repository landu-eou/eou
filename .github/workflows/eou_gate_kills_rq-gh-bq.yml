name: RQ Gate Kills (RQ → GH → BQ)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_gate_kills_rq-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKFLOW_FILE: eou_gate_kills_rq-gh-bq.yml
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "7"
      LOCK_TIME: 120
      COOLDOWN: 1800

      # RedisQ queue ID
      QUEUE_SUFFIX: ""

      # Guard
      GH_API: https://api.github.com

      # BigQuery
      BQ_DATASET: eou
      BQ_TABLE: gate_kills
      BQ_STAGING_TABLE: gate_kills_incoming

      # ESI
      ESI_USER_AGENT: "EOU Gate Kills (GitHub Actions) <contact: you@example.com>"

    steps:
      - name: Guard (anti-cola)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
          THIS_RUN_NUMBER: ${{ github.run_number }}
          THIS_CREATED_AT: ${{ github.run_created_at }}
        run: |
          set -euo pipefail

          wf=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$OWNER_REPO/actions/workflows/$WORKFLOW_FILE")
          wf_id=$(echo "$wf" | jq -r '.id')

          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$OWNER_REPO/actions/workflows/$wf_id/runs?per_page=50")

          alive_at_creation=$(echo "$runs" | jq -r --arg created "$THIS_CREATED_AT" --argjson this_id "$THIS_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $this_id)
              | select((.status=="in_progress" or .status=="queued") and .created_at < $created and .updated_at > $created)
            ] | length')

          proceed=true
          if [ "$alive_at_creation" -gt 0 ]; then
            proceed=false
          fi

          if [ "$proceed" = "true" ]; then
            leader=$(echo "$runs" | jq -r '
              [.workflow_runs[]
                | select(.status=="in_progress" or .status=="queued")
                | .run_number
              ] | min // empty')

            if [ -n "$leader" ] && [ "$leader" != "$THIS_RUN_NUMBER" ]; then
              proceed=false
            fi
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Stop early if proceed=false
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Otro run ya estaba activo cuando este se creó. Salgo sin hacer trabajo."
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auth to Google (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/spreadsheets

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sheets (start) status=in progress, next_run=now+LOCK_TIME
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          row="$SHEETS_WORKFLOW_ROW"
          now_s=$(date -u +%s)
          next_s=$((now_s + LOCK_TIME))

          now_excel=$(awk -v s="$now_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')
          next_excel=$(awk -v s="$next_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')

          body=$(jq -n \
            --arg tab "$SHEET_TAB" \
            --arg row "$row" \
            --arg status "in progress" \
            --argjson next "$next_excel" \
            '{valueInputOption:"RAW", data:[
              {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
              {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
            ]}')

          curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_T_
