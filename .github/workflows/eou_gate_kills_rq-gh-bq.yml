name: RQ Gate Kills (RQ → GH → BQ)

on:
  workflow_dispatch:

# Permisos mínimos:
# - actions:read   -> Guard por REST (listar runs)
# - contents:write -> commit/push de data/rq/pending_gate_kills.jsonl.gz
# - id-token:write -> WIF/OIDC hacia Google
permissions:
  actions: read
  contents: write
  id-token: write

# Candado oficial: evita solapamiento real.
# cancel-in-progress:false => el nuevo run NO cancela al que está trabajando.
concurrency:
  group: eou_gate_kills_rq-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      WORKFLOW_FILE: eou_gate_kills_rq-gh-bq.yml
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "7"
      LOCK_TIME: 120
      COOLDOWN: 1800

      # RedisQ queue ID
      QUEUE_SUFFIX: ""

      # Guard
      GH_API: https://api.github.com

      # BigQuery
      BQ_DATASET: eou
      BQ_TABLE: gate_kills
      BQ_STAGING_TABLE: gate_kills_incoming

      # ESI (best practice: identify your app + contact)
      ESI_USER_AGENT: "EOU Gate Kills (GitHub Actions) <contact: you@example.com>"

    steps:
      # =======================
      # GUARD: cortar runs "duplicados" (anti-cola)
      # =======================
      - name: Guard (anti-cola)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
          THIS_RUN_NUMBER: ${{ github.run_number }}
          THIS_CREATED_AT: ${{ github.run_created_at }}
        run: |
          set -euo pipefail

          wf=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$OWNER_REPO/actions/workflows/$WORKFLOW_FILE")
          wf_id=$(echo "$wf" | jq -r '.id')

          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$OWNER_REPO/actions/workflows/$wf_id/runs?per_page=50")

          # 1) Si al crearse este run ya había otro run vivo (in_progress/queued), este run no debe hacer trabajo.
          alive_at_creation=$(echo "$runs" | jq -r --arg created "$THIS_CREATED_AT" --argjson this_id "$THIS_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $this_id)
              | select((.status=="in_progress" or .status=="queued") and .created_at < $created and .updated_at > $created)
            ] | length')

          proceed=true
          if [ "$alive_at_creation" -gt 0 ]; then
            proceed=false
          fi

          # 2) Si hay varios runs vivos a la vez (corner), solo el "líder" (run_number más bajo) hace trabajo.
          if [ "$proceed" = "true" ]; then
            leader=$(echo "$runs" | jq -r '
              [.workflow_runs[]
                | select(.status=="in_progress" or .status=="queued")
                | .run_number
              ] | min // empty')

            if [ -n "$leader" ] && [ "$leader" != "$THIS_RUN_NUMBER" ]; then
              proceed=false
            fi
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Stop early if proceed=false
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Otro run ya estaba activo cuando este se creó. Salgo sin hacer trabajo."
          exit 0

      # =======================
      # CHECKOUT + PYTHON
      # =======================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =======================
      # AUTH GOOGLE (WIF/OIDC)
      # =======================
      - name: Auth to Google (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/spreadsheets

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # =======================
      # SHEETS: fase inicial
      # =======================
      - name: Sheets (start) status=in progress, next_run=now+LOCK_TIME
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          row="$SHEETS_WORKFLOW_ROW"
          now_s=$(date -u +%s)
          next_s=$((now_s + LOCK_TIME))

          # Google Sheets serial date: days since 1899-12-30
          now_excel=$(awk -v s="$now_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')
          next_excel=$(awk -v s="$next_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')

          body=$(jq -n \
            --arg tab "$SHEET_TAB" \
            --arg row "$row" \
            --arg status "in progress" \
            --argjson next "$next_excel" \
            '{valueInputOption:"RAW", data:[
              {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
              {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
            ]}')

          curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/$SHEETS_ID/values:batchUpdate" \
            -d "$body" \
            | jq -e '.totalUpdatedCells >= 1' >/dev/null

      # =======================
      # OBJETIVO: RQ → ESI → preparar bulk load
      # =======================
      - name: Build insert_rows + pending candidates
        id: build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          python -m scripts.rq.run_gate_kills \
            --pending data/rq/pending_gate_kills.jsonl.gz \
            --stargates data/sde/stargates.jsonl.gz \
            --types data/sde/types.jsonl.gz \
            --out out \
            | tee out/metrics_print.json

          # Normaliza: el script ya deja out/metrics.json
          jq -e '.rq_ok != null and .rq_time_iso != null' out/metrics.json >/dev/null

          insert_count=$(jq -r '.insert_rows_count' out/metrics.json)
          echo "insert_rows_count=$insert_count" >> "$GITHUB_OUTPUT"

      # =======================
      # BIGQUERY: crear tablas + bulk load + dedup (sin DML)
      # =======================
      - name: BigQuery create tables if needed
        shell: bash
        run: |
          set -euo pipefail

          bq --project_id "$GCP_PROJECT_ID" query --use_legacy_sql=false \
            "CREATE TABLE IF NOT EXISTS \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_TABLE\` (
              snapshot_ts TIMESTAMP NOT NULL,
              killmailID INT64 NOT NULL,
              stargate STRING NOT NULL,
              stargateGroup STRING NOT NULL,
              solarSystem STRING NOT NULL,
              ship_class STRING NOT NULL,
              smartBomb BOOL NOT NULL,
              attackers INT64 NOT NULL,
              corporationID ARRAY<STRUCT<corporation_id INT64>>
            )
            PARTITION BY DATE(snapshot_ts)
            CLUSTER BY stargate"

          bq --project_id "$GCP_PROJECT_ID" query --use_legacy_sql=false \
            "CREATE TABLE IF NOT EXISTS \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_STAGING_TABLE\` (
              snapshot_ts TIMESTAMP NOT NULL,
              killmailID INT64 NOT NULL,
              stargate STRING NOT NULL,
              stargateGroup STRING NOT NULL,
              solarSystem STRING NOT NULL,
              ship_class STRING NOT NULL,
              smartBomb BOOL NOT NULL,
              attackers INT64 NOT NULL,
              corporationID ARRAY<STRUCT<corporation_id INT64>>
            )"

      - name: BigQuery bulk load + dedup
        id: bq
        shell: bash
        run: |
          set -euo pipefail

          insert_count=$(jq -r '.insert_rows_count' out/metrics.json)
          echo "new_count=0" >> "$GITHUB_OUTPUT"
          echo "bq_success=true" >> "$GITHUB_OUTPUT"

          if [ "$insert_count" -eq 0 ]; then
            echo "No hay filas listas para insertar."
            exit 0
          fi

          # Bulk load en staging (1 job)
          bq --project_id "$GCP_PROJECT_ID" load \
            --source_format=NEWLINE_DELIMITED_JSON \
            --replace \
            "$GCP_PROJECT_ID:$BQ_DATASET.$BQ_STAGING_TABLE" \
            out/insert_rows.ndjson

          # Cuántas killmailID son realmente nuevas (antes de dedup)
          new_count=$(bq --project_id "$GCP_PROJECT_ID" query --use_legacy_sql=false --format=json \
            "SELECT COUNT(1) AS new_count
             FROM \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_STAGING_TABLE\` s
             LEFT JOIN \`$GCP_PROJECT_id.$BQ_DATASET.$BQ_TABLE\` g
             USING(killmailID)
             WHERE g.killmailID IS NULL" \
            | jq -r '.[0].new_count')

          echo "new_count=$new_count" >> "$GITHUB_OUTPUT"

          if [ "$new_count" -eq 0 ]; then
            echo "Todas las filas eran duplicadas (killmailID ya existía)."
            exit 0
          fi

          # Dedup: 1 query DDL (sin DML). Mantiene 1 fila por killmailID.
          bq --project_id "$GCP_PROJECT_ID" query --use_legacy_sql=false \
            "CREATE OR REPLACE TABLE \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_TABLE\`
             PARTITION BY DATE(snapshot_ts)
             CLUSTER BY stargate AS
             SELECT * EXCEPT(rn) FROM (
               SELECT
                 snapshot_ts, killmailID, stargate, stargateGroup, solarSystem,
                 ship_class, smartBomb, attackers, corporationID,
                 ROW_NUMBER() OVER(PARTITION BY killmailID ORDER BY snapshot_ts DESC) AS rn
               FROM (
                 SELECT * FROM \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_TABLE\`
                 UNION ALL
                 SELECT * FROM \`$GCP_PROJECT_ID.$BQ_DATASET.$BQ_STAGING_TABLE\`
               )
             )
             WHERE rn = 1"

      # =======================
      # PENDING: aplicar pending_keep o pending_with_ready y commit
      # =======================
      - name: Update pending file
        shell: bash
        run: |
          set -euo pipefail

          insert_count=$(jq -r '.insert_rows_count' out/metrics.json)
          bq_success="${{ steps.bq.outputs.bq_success }}"

          if [ "$insert_count" -gt 0 ] && [ "$bq_success" != "true" ]; then
            echo "BQ falló con filas listas: conservo pending_with_ready (más seguro)."
            cp -f out/pending_with_ready.jsonl.gz data/rq/pending_gate_kills.jsonl.gz
          else
            echo "BQ OK (o no había filas listas): aplico pending_keep."
            cp -f out/pending_keep.jsonl.gz data/rq/pending_gate_kills.jsonl.gz
          fi

      - name: Commit pending (if changed)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/rq/pending_gate_kills.jsonl.gz; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rq/pending_gate_kills.jsonl.gz
          git commit -m "rq: update pending_gate_kills"
          git push

      # =======================
      # SHEETS: fase final (status/next_run/last_modified)
      # =======================
      - name: Sheets (finish)
        if: always()
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          row="$SHEETS_WORKFLOW_ROW"

          rq_ok=$(jq -r '.rq_ok' out/metrics.json)
          rq_time_iso=$(jq -r '.rq_time_iso' out/metrics.json)
          rq_time_s=$(date -u -d "$rq_time_iso" +%s)

          # next_run: si RedisQ respondió OK -> rq_time + COOLDOWN, si no -> rq_time + 10min
          if [ "$rq_ok" = "true" ]; then
            next_s=$((rq_time_s + COOLDOWN))
          else
            next_s=$((rq_time_s + 600))
          fi

          next_excel=$(awk -v s="$next_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')

          # status
          bq_success="${{ steps.bq.outputs.bq_success }}"
          if [ "$bq_success" = "true" ]; then
            status="completed"
          else
            status="failed"
          fi

          # last_modified solo si hubo inserciones nuevas
          new_count="${{ steps.bq.outputs.new_count }}"
          last_excel=""
          if [ "$bq_success" = "true" ] && [ "$new_count" -gt 0 ]; then
            last_excel=$(awk -v s="$rq_time_s" 'BEGIN{printf "%.10f", (s/86400)+25569}')
          fi

          body=$(jq -n \
            --arg tab "$SHEET_TAB" \
            --arg row "$row" \
            --arg status "$status" \
            --argjson next "$next_excel" \
            --arg last "$last_excel" \
            '{valueInputOption:"RAW", data:(
              [
                {range:($tab+"!B"+$row+":B"+$row), values:[[ $status ]]},
                {range:($tab+"!D"+$row+":D"+$row), values:[[ $next ]]}
              ] + ( $last == "" ? [] : [ {range:($tab+"!I"+$row+":I"+$row), values:[[ ($last|tonumber) ]] } ] )
            )}')

          curl -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/$SHEETS_ID/values:batchUpdate" \
            -d "$body" \
            | jq -e '.totalUpdatedCells >= 1' >/dev/null
