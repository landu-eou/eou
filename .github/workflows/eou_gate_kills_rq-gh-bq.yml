name: RQ Gate Kills (RQ → GH → BQ)

on:
  workflow_dispatch:
    inputs:
      queue_suffix:
        description: "Suffix opcional para queueID (pruebas/reset cola). Puede ser vacío."
        required: false
        type: string
        default: ""

permissions:
  actions: read          # Guard por REST (listar runs)
  contents: write        # persistir raw_kills.jsonl (commits)
  id-token: write        # WIF/OIDC hacia Google

concurrency:
  group: eou_gate_kills_rq-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # =====================================================================
      # CONFIG (según tu especificación)
      # =====================================================================
      WORKFLOW_FILE: eou_gate_kills_rq-gh-bq.yml

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "7"

      LOCK_TIME: 1800  # segundos

      # BigQuery
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou
      BQ_TABLE: gate_kills

      # RedisQ poll
      REDISQ_BASE: https://zkillredisq.stream/listen.php
      POLL_MAX_SECONDS: 1200          # 20 min
      NULL_STREAK_MAX: 10
      TTW: 1

      # Paths
      RAW_FILE: data/rq/raw_kills.jsonl
      SDE_STARGATES_GZ: data/sde/stargates.jsonl.gz
      SDE_TYPES_GZ: data/sde/types.jsonl.gz

    steps:
      # =====================================================================
      # 1) GUARD — decide si este run trabaja o sale (busy)
      # =====================================================================
      - name: Guard - compute decision
        id: guard_calc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "$proceed" > /tmp/proceed

      - name: Guard - publish decision
        id: guard
        run: |
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"

      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # =====================================================================
      # 2) CHECKOUT + GIT (para persistir raw_kills)
      # =====================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure raw queue file exists
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RAW_FILE}")"
          if [ ! -f "${RAW_FILE}" ]; then
            : > "${RAW_FILE}"
            git add "${RAW_FILE}"
            git commit -m "rq: create raw_kills queue file" || true
            git push || true
          fi

      # =====================================================================
      # 3) AUTH GOOGLE — WIF/OIDC (sin claves)
      # =====================================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # =====================================================================
      # 4) FASE INICIO — status=in progress + next_run=now+LOCK_TIME
      # =====================================================================
      - name: Phase start (in_progress + next_run lock)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # =====================================================================
      # 5) FASE TRATAMIENTO PENDIENTES — Enrich #1 (sobre RAW_FILE actual)
      #    (Scripts aún no implementados: aquí solo definimos el contrato)
      # =====================================================================
      - name: Heartbeat (next_run lock)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      - name: Enrich pending kills (ESI 1x1, filter2, requeue, batch output)
        id: enrich_1
        run: |
          set -euo pipefail
          # Contrato de salida (a implementar en el script):
          # - escribe en $GITHUB_OUTPUT:
          #   ndjson_path=<path o vacío>
          #   ndjson_rows=<int>
          #   max_killmail_time_iso=<ISO o vacío>
          python scripts/rq/eou_gate_kills_enrich.py \
            --raw "${RAW_FILE}" \
            --sde-stargates "${SDE_STARGATES_GZ}" \
            --sde-types "${SDE_TYPES_GZ}" \
            --mode pending

      - name: Persist raw queue after enrich #1 (if changed)
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "${RAW_FILE}"; then
            git add "${RAW_FILE}"
            git commit -m "rq: enrich requeue update (phase 1)" || true
            git push || true
          fi

      - name: Build batch file (append from enrich #1)
        run: |
          set -euo pipefail
          : > /tmp/gate_kills_batch.ndjson
          if [ -n "${{ steps.enrich_1.outputs.ndjson_path }}" ] && [ -f "${{ steps.enrich_1.outputs.ndjson_path }}" ]; then
            cat "${{ steps.enrich_1.outputs.ndjson_path }}" >> /tmp/gate_kills_batch.ndjson
          fi

      # =====================================================================
      # 6) FASE OBJETIVO — Poll RedisQ (20 min / 10 null)
      # =====================================================================
      - name: Heartbeat before poll (next_run lock)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"
          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      - name: Poll RedisQ (flush each minute to raw_kills.jsonl)
        id: poll
        env:
          QUEUE_SUFFIX: ${{ inputs.queue_suffix }}
        run: |
          set -euo pipefail
          # Contrato de salida (a implementar en el script):
          # - escribe en $GITHUB_OUTPUT:
          #   poll_reason=timeout|null_streak
          #   accepted=<int>
          #   null_streak=<int>
          # Nota: el script debe loguear kills + PASS/FAIL + null_streak X/10
          # y debe hacer flush cada minuto al RAW_FILE (append).
          python scripts/rq/eou_gate_kills_poll.py \
            --base "${REDISQ_BASE}" \
            --raw "${RAW_FILE}" \
            --workflow-file "${WORKFLOW_FILE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --queue-suffix "${QUEUE_SUFFIX}" \
            --ttw "${TTW}" \
            --poll-max-seconds "${POLL_MAX_SECONDS}" \
            --null-max "${NULL_STREAK_MAX}"

      # =====================================================================
      # 7) SUBFASE ENRICH #2 + batch append
      # =====================================================================
      - name: Enrich new kills (ESI 1x1, filter2, requeue, batch output)
        id: enrich_2
        run: |
          set -euo pipefail
          python scripts/rq/eou_gate_kills_enrich.py \
            --raw "${RAW_FILE}" \
            --sde-stargates "${SDE_STARGATES_GZ}" \
            --sde-types "${SDE_TYPES_GZ}" \
            --mode post_poll

      - name: Persist raw queue after enrich #2 (if changed)
        run: |
          set -euo pipefail
          if ! git diff --quiet -- "${RAW_FILE}"; then
            git add "${RAW_FILE}"
            git commit -m "rq: enrich requeue update (phase 2)" || true
            git push || true
          fi

      - name: Append from enrich #2 to batch file
        run: |
          set -euo pipefail
          if [ -n "${{ steps.enrich_2.outputs.ndjson_path }}" ] && [ -f "${{ steps.enrich_2.outputs.ndjson_path }}" ]; then
            cat "${{ steps.enrich_2.outputs.ndjson_path }}" >> /tmp/gate_kills_batch.ndjson
          fi

      # =====================================================================
      # 8) BigQuery — crear tabla si no existe + load (en batch)
      # =====================================================================
      - name: Ensure BigQuery table exists (partition + cluster)
        run: |
          set -euo pipefail
          if bq show --format=prettyjson "${GCP_PROJECT_ID}:${BQ_DATASET}.${BQ_TABLE}" >/dev/null 2>&1; then
            echo "BigQuery table exists: ${BQ_DATASET}.${BQ_TABLE}"
            exit 0
          fi

          cat > /tmp/gate_kills_schema.json <<'EOF'
          [
            {"name":"snapshot_ts","type":"TIMESTAMP","mode":"REQUIRED"},
            {"name":"killmailID","type":"INT64","mode":"REQUIRED"},
            {"name":"stargate","type":"STRING","mode":"REQUIRED"},
            {"name":"stargateGroup","type":"STRING","mode":"REQUIRED"},
            {"name":"solarSystem","type":"STRING","mode":"REQUIRED"},
            {"name":"ship_class","type":"STRING","mode":"REQUIRED"},
            {"name":"smartBomb","type":"BOOL","mode":"REQUIRED"},
            {"name":"attackers","type":"INT64","mode":"REQUIRED"},
            {"name":"corporationID","type":"RECORD","mode":"REPEATED","fields":[
              {"name":"corporation_id","type":"INT64","mode":"REQUIRED"}
            ]}
          ]
          EOF

          bq mk --table \
            --time_partitioning_field=snapshot_ts \
            --time_partitioning_type=DAY \
            --clustering_fields=stargate,solarSystem,ship_class \
            --schema=/tmp/gate_kills_schema.json \
            "${GCP_PROJECT_ID}:${BQ_DATASET}.${BQ_TABLE}"

      - name: Load batch to BigQuery (dedupe + 1 load job)
        id: load_bq
        run: |
          set -euo pipefail
          # Contrato (a implementar en el script):
          # - si /tmp/gate_kills_batch.ndjson está vacío => no hace nada
          # - dedupe por killmailID contra BQ (query pruning por partición)
          # - 1 load job append con los nuevos
          # - escribe en $GITHUB_OUTPUT:
          #   inserted_rows=<int>
          python scripts/rq/eou_gate_kills_load.py \
            --project "${GCP_PROJECT_ID}" \
            --dataset "${BQ_DATASET}" \
            --table "${BQ_TABLE}" \
            --batch "/tmp/gate_kills_batch.ndjson"

      # =====================================================================
      # 9) FINAL — status + next_run (5m/30m) + last_modified (col I si success)
      # =====================================================================
      - name: Finalize (completed + next_run + last_modified)
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          reason="${{ steps.poll.outputs.poll_reason }}"
          cooldown=1800
          if [ "$reason" = "timeout" ]; then cooldown=300; fi
          if [ "$reason" = "null_streak" ]; then cooldown=1800; fi

          # next_run
          epoch="$(date -u -d "+${cooldown} seconds" +%s)"
          next_serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          # last_modified: max(max_killmail_time_iso de enrich_1 y enrich_2)
          max_iso=""
          if [ -n "${{ steps.enrich_1.outputs.max_killmail_time_iso }}" ]; then
            max_iso="${{ steps.enrich_1.outputs.max_killmail_time_iso }}"
          fi
          if [ -n "${{ steps.enrich_2.outputs.max_killmail_time_iso }}" ]; then
            if [ -z "$max_iso" ]; then
              max_iso="${{ steps.enrich_2.outputs.max_killmail_time_iso }}"
            else
              e1="$(date -u -d "$max_iso" +%s || echo 0)"
              e2="$(date -u -d "${{ steps.enrich_2.outputs.max_killmail_time_iso }}" +%s || echo 0)"
              if [ "$e2" -gt "$e1" ]; then
                max_iso="${{ steps.enrich_2.outputs.max_killmail_time_iso }}"
              fi
            fi
          fi

          # Construye payload Sheets
          if [ -n "$max_iso" ]; then
            lm_epoch="$(date -u -d "$max_iso" +%s)"
            lm_serial="$(awk "BEGIN { printf \"%.10f\", (${lm_epoch}/86400) + 25569 }")"
            data_payload="[
              {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
              {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${next_serial}]]},
              {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}
            ]"
          else
            data_payload="[
              {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
              {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${next_serial}]]}
            ]"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\": ${data_payload}
            }"

      - name: Finalize (failed + next_run)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          # Conservador en fallo: 30 min
          cooldown=1800
          epoch="$(date -u -d "+${cooldown} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"
