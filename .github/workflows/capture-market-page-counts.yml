name: Capture market page counts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-market-page-counts
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Capture regional X-Pages counts
        run: python scripts/capture_market_page_counts.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit and push YAML when it changed
        run: |
          git add data/esi/mkt/pages.yml
          if git diff --cached --quiet; then
            echo "The market page counts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ESI market page counts"
          git push origin HEAD:main
