name: Refresh Access Tokens (SSO → GHs)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: eou-sso-token-refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: eou_refresh_access_tokens
      WORKFLOW_NAME: "Refresh Access Tokens (SSO -> GHs)"
      SHEET_ROW: "2"
      EXPIRES: "900"
      LOCK_SECONDS: "60"

      TOKENS_SPREADSHEET_ID: "1LDi6LFPYO99Rz6OBnwt58dI60aWyw1OFLEcnyt0yHAA"
      TOKENS_TAB_NAME: "access_tokens"

    steps:
      - name: Preflight
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          WF_NAME_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))')"
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"
          RESP="$(curl -sS -L "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          [[ "$(echo "$RESP" | jq -r '.ok')" == "true" ]]
          echo "locked=$(echo "$RESP" | jq -r '.locked')" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

      - id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Refresh tokens + write Sheets
        env:
          EOU_CLIENTS: ${{ secrets.EOU_CLIENTS }}
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}
          EOU_ACCESS_TOKENS: ${{ secrets.EOU_ACCESS_TOKENS }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone

          TOKEN_URL = "https://login.eveonline.com/v2/oauth/token"
          ORDER = [
            "90734547","91939203","92017833","91412962","92006397","92006494",
            "92816858","92817160","2118026235","2118561816","2124070822"
          ]

          def iso():
            return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")

          def gh_set(name, val):
            subprocess.run(["gh","secret","set",name], input=val.encode(),
                           stdout=subprocess.DEVNULL, check=True)

          clients = json.loads(os.environ["EOU_CLIENTS"])
          refresh = json.loads(os.environ["EOU_REFRESH_TOKENS"])
          prev = json.loads(os.environ.get("EOU_ACCESS_TOKENS","{}") or "{}")

          out = dict(prev)
          rows = []
          now = iso()

          for cid in ORDER:
            meta = refresh.get(cid,{})
            old = out.get(cid,{})
            token = old.get("access_token","")
            ts = old.get("ts_token","")
            code = 0

            try:
              app = meta["app"]
              rt = meta["refresh_token"]
              c = clients[app]
              basic = base64.b64encode(f"{c['client_id']}:{c['client_secret']}".encode()).decode()
              data = urllib.parse.urlencode({"grant_type":"refresh_token","refresh_token":rt}).encode()
              req = urllib.request.Request(TOKEN_URL, data=data, method="POST",
                headers={"Authorization":f"Basic {basic}","Content-Type":"application/x-www-form-urlencoded"})
              with urllib.request.urlopen(req, timeout=20) as r:
                p = json.loads(r.read())
              token = p["access_token"]
              ts = now
              code = 200
            except urllib.error.HTTPError as e:
              code = e.code
            except Exception:
              code = 0

            out[cid] = {"access_token":token,"ts_token":ts,"code_int":code}
            rows.append([
              meta.get("account",""),
              meta.get("char_name",""),
              cid, token, ts, code
            ])

          gh_set("EOU_ACCESS_TOKENS", json.dumps(out, separators=(",",":")))

          rng = f"access_tokens!A2:F{1+len(rows)}"
          url = f"https://sheets.googleapis.com/v4/spreadsheets/{os.environ['TOKENS_SPREADSHEET_ID']}/values/{urllib.parse.quote(rng)}?valueInputOption=RAW"
          body = json.dumps({"range":rng,"majorDimension":"ROWS","values":rows}).encode()
          req = urllib.request.Request(url, data=body, method="PUT",
            headers={"Authorization":f"Bearer {os.environ['GOOGLE_ACCESS_TOKEN']}",
                     "Content-Type":"application/json"})
          urllib.request.urlopen(req).read()
          print("[DONE]", len(rows))
          PY

      - name: FINISH
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          WF_NAME_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))')"
          STATUS="${{ job.status }}"
          [[ "$STATUS" == "success" ]] && CONCLUSION="success" || CONCLUSION="failure"
          NOW_MS="$(date -u +%s%3N)"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"
          curl -sS -L "$URL" | jq -e '.ok==true' >/dev/null
