# ==============================================================================
# Refresh Access Tokens (SSO → GH Secrets + Google Sheets)
# - NO lee NADA del spreadsheet (solo escribe)
# - Anti-solape oficial: concurrency
# - Anti-cola (run “encolado”): GUARD GitHub-only (sin cooldown)
# - EOU_ACCESS_TOKENS (compacto): { "<character_id>": "<access_token>" }
# - Rotación refresh_token: actualiza EOU_REFRESH_TOKENS y escribe refresh_time (col F)
# - Escritura a Sheets: 1 sola llamada values.batchUpdate por run (batch)
# ==============================================================================

name: Refresh Access Tokens (SSO → GHs + GS)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: eou_refresh_access_tokens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      WORKFLOW_FILE: "eou_refresh_access_tokens.yml"

      # Google Sheets (solo escritura)
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: 3

      ACCESS_TOKENS_TAB: access_tokens

      # Cadencia solo para monitorización (NO se usa para GUARD)
      COOLDOWN: 900

      # EVE SSO
      SSO_TOKEN_URL: "https://login.eveonline.com/v2/oauth/token"

      # GH secrets
      ACCESS_TOKENS_SECRET_NAME: "EOU_ACCESS_TOKENS"
      REFRESH_TOKENS_SECRET_NAME: "EOU_REFRESH_TOKENS"

      # Plan B preparado (48KB): por defecto NO particiona
      ENABLE_SECRET_PARTITION: "false"
      SECRET_MAX_BYTES: "46000"

    steps:
      # ==========================================================================
      # 1) GUARD (GitHub-only) - anti-cola (run encolado)
      #    Si este run fue creado antes de que terminara el último run completado,
      #    entonces este run es “viejo” (estuvo pending) => salir sin hacer trabajo.
      # ==========================================================================
      - name: "GUARD - skip queued runs (GitHub-only)"
        id: guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          RUN_ID="${GITHUB_RUN_ID}"
          WF="${WORKFLOW_FILE}"

          # created_at del run actual
          RUN_JSON="$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}")"
          THIS_CREATED_AT="$(echo "$RUN_JSON" | jq -r '.created_at')"
          THIS_CREATED_EPOCH="$(date -u -d "$THIS_CREATED_AT" +%s)"

          # último run completado del workflow (distinto a este)
          LIST_JSON="$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WF}/runs?status=completed&per_page=10")"

          LAST_COMPLETED_AT="$(echo "$LIST_JSON" | jq -r --arg rid "$RUN_ID" '
            .workflow_runs
            | map(select((.id|tostring) != $rid))
            | .[0].completed_at // empty
          ')"

          PROCEED="true"
          if [[ -n "${LAST_COMPLETED_AT}" ]]; then
            LAST_COMPLETED_EPOCH="$(date -u -d "$LAST_COMPLETED_AT" +%s)"

            # Si el último completed ocurrió DESPUÉS de que este run fuera creado,
            # significa que este run estaba en cola mientras otro run terminó.
            if (( LAST_COMPLETED_EPOCH > THIS_CREATED_EPOCH )); then
              PROCEED="false"
              echo "GUARD: queued run detected. last_completed_at=${LAST_COMPLETED_AT} > this_created_at=${THIS_CREATED_AT}"
            else
              echo "GUARD: proceed. last_completed_at=${LAST_COMPLETED_AT} <= this_created_at=${THIS_CREATED_AT}"
            fi
          else
            echo "GUARD: no previous completed runs found. proceed."
          fi

          echo "proceed=${PROCEED}" >> "$GITHUB_OUTPUT"

      - name: "BUSY EXIT"
        if: steps.guard.outputs.proceed != 'true'
        shell: bash
        run: |
          echo "Skipped (queued run / anti-duplicate)."
          exit 0

      # ==========================================================================
      # 2) AUTH GOOGLE (WIF/OIDC) - para escribir en Sheets (solo escritura)
      # ==========================================================================
      - name: "AUTH - Google WIF/OIDC"
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"
          token_format: "access_token"
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # ==========================================================================
      # 3) OBJECTIVE (refresh + persist GH secrets + preparar batch Sheets)
      #    - EOU_ACCESS_TOKENS: {char_id: access_token}
      #    - Si falla un char: NO se toca D/E/F en Sheets
      #    - Escritura Sheets: una sola llamada batchUpdate (con múltiples rangos)
      # ==========================================================================
      - name: "OBJECTIVE - refresh + persist + sheets batch (single call)"
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"
          GH_ADMIN_PAT: "${{ secrets.GH_SECRETS_ADMIN_TOKEN }}"

          EOU_CLIENTS: "${{ secrets.EOU_CLIENTS }}"
          EOU_REFRESH_TOKENS: "${{ secrets.EOU_REFRESH_TOKENS }}"
          EOU_ACCESS_TOKENS: "${{ secrets.EOU_ACCESS_TOKENS }}"
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install requests pynacl >/dev/null

          python3 - <<'PY'
          import os, json, base64, datetime, sys
          import requests
          from nacl.public import PublicKey, SealedBox

          # ----------------------------
          # Helpers
          # ----------------------------
          def utc_now():
              return datetime.datetime.now(datetime.timezone.utc)

          def utc_now_str():
              return utc_now().strftime("%Y-%m-%d %H:%M:%S")

          def col_letter(idx0: int) -> str:
              idx = idx0 + 1
              s = ""
              while idx:
                  idx, r = divmod(idx - 1, 26)
                  s = chr(65 + r) + s
              return s

          def gh_api_headers(token: str):
              return {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

          def gh_get_public_key(owner, repo, token):
              url = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key"
              r = requests.get(url, headers=gh_api_headers(token), timeout=30)
              r.raise_for_status()
              j = r.json()
              return j["key_id"], j["key"]  # base64

          def gh_put_secret(owner, repo, token, secret_name, plaintext_value: str):
              key_id, key_b64 = gh_get_public_key(owner, repo, token)
              pk = PublicKey(base64.b64decode(key_b64))
              sealed = SealedBox(pk)
              encrypted = sealed.encrypt(plaintext_value.encode("utf-8"))
              encrypted_b64 = base64.b64encode(encrypted).decode("utf-8")

              url = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/{secret_name}"
              payload = {"encrypted_value": encrypted_b64, "key_id": key_id}
              r = requests.put(url, headers=gh_api_headers(token), json=payload, timeout=30)
              r.raise_for_status()

          def sheets_batch_update(spreadsheet_id, data_ranges, access_token):
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{spreadsheet_id}/values:batchUpdate"
              body = {"valueInputOption": "RAW", "data": data_ranges}
              r = requests.post(
                  url,
                  headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
                  json=body,
                  timeout=60,
              )
              r.raise_for_status()

          # ----------------------------
          # Load env/secrets
          # ----------------------------
          repo_full = os.environ["GITHUB_REPOSITORY"]
          owner, repo = repo_full.split("/", 1)

          pat = os.environ.get("GH_ADMIN_PAT", "")
          if not pat:
              raise RuntimeError("GH_ADMIN_PAT is empty. Ensure repo secret GH_SECRETS_ADMIN_TOKEN exists.")

          g_access_token = os.environ["ACCESS_TOKEN"]

          sso_url = os.environ["SSO_TOKEN_URL"]
          sheets_id = os.environ["SHEETS_ID"]
          workflows_tab = os.environ["SHEET_TAB"]
          workflows_row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          access_tab = os.environ["ACCESS_TOKENS_TAB"]
          cooldown = int(os.environ["COOLDOWN"])

          secret_access_name = os.environ["ACCESS_TOKENS_SECRET_NAME"]
          secret_refresh_name = os.environ["REFRESH_TOKENS_SECRET_NAME"]

          enable_partition = os.environ.get("ENABLE_SECRET_PARTITION", "false").lower() == "true"
          secret_max_bytes = int(os.environ.get("SECRET_MAX_BYTES", "46000"))

          clients = json.loads(os.environ["EOU_CLIENTS"] or "{}")
          refresh_map = json.loads(os.environ["EOU_REFRESH_TOKENS"] or "{}")

          # EOU_ACCESS_TOKENS compact: {char_id: token}
          old_access = json.loads(os.environ.get("EOU_ACCESS_TOKENS") or "{}")

          # ----------------------------
          # Stable ordering -> deterministic row mapping in access_tokens
          # Row 1 = header, data starts at row 2
          # row_idx = 2 + i
          # ----------------------------
          def sort_key(item):
              char_id, info = item
              return (info.get("account",""), info.get("char_name",""), str(char_id))

          items = sorted(refresh_map.items(), key=sort_key)
          n = len(items)

          # ----------------------------
          # Refresh loop (partial success allowed)
          # ----------------------------
          now_str = utc_now_str()
          new_access = dict(old_access)
          new_refresh = dict(refresh_map)

          successes = set()
          failures = []
          rotated = set()

          session = requests.Session()

          for i, (char_id, info) in enumerate(items):
              char_id_s = str(char_id)
              app = info.get("app")
              rt = info.get("refresh_token")

              if not app or app not in clients:
                  failures.append(char_id_s); continue

              cid = clients[app].get("client_id")
              csec = clients[app].get("client_secret")
              if not cid or not csec or not rt:
                  failures.append(char_id_s); continue

              basic = base64.b64encode(f"{cid}:{csec}".encode("utf-8")).decode("ascii")
              headers = {
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
              }
              data = {"grant_type": "refresh_token", "refresh_token": rt}

              try:
                  r = session.post(sso_url, headers=headers, data=data, timeout=30)
                  if r.status_code != 200:
                      failures.append(char_id_s); continue
                  j = r.json()
              except Exception:
                  failures.append(char_id_s); continue

              at = j.get("access_token")
              if not at:
                  failures.append(char_id_s); continue

              # Mask ASAP
              print(f"::add-mask::{at}")

              # compact format {char_id: token}
              new_access[char_id_s] = at
              successes.add(char_id_s)

              # refresh token rotation
              new_rt = j.get("refresh_token")
              if new_rt and new_rt != rt:
                  print(f"::add-mask::{new_rt}")
                  new_refresh[char_id_s] = dict(info)
                  new_refresh[char_id_s]["refresh_token"] = new_rt
                  rotated.add(char_id_s)

          # ----------------------------
          # Persist GitHub secrets
          # ----------------------------
          access_json = json.dumps(new_access, ensure_ascii=False, separators=(",", ":"))
          access_bytes = len(access_json.encode("utf-8"))
          if access_bytes > secret_max_bytes and not enable_partition:
              raise RuntimeError(
                  f"{secret_access_name} size {access_bytes} exceeds safety limit {secret_max_bytes}. "
                  f"Enable partition by setting ENABLE_SECRET_PARTITION=true."
              )
          gh_put_secret(owner, repo, pat, secret_access_name, access_json)

          if rotated:
              refresh_json = json.dumps(new_refresh, ensure_ascii=False, separators=(",", ":"))
              refresh_bytes = len(refresh_json.encode("utf-8"))
              if refresh_bytes > secret_max_bytes and not enable_partition:
                  raise RuntimeError(
                      f"{secret_refresh_name} size {refresh_bytes} exceeds safety limit {secret_max_bytes}. "
                      f"Enable partition by setting ENABLE_SECRET_PARTITION=true."
                  )
              gh_put_secret(owner, repo, pat, secret_refresh_name, refresh_json)

          # ----------------------------
          # Prepare ONE Sheets batchUpdate call
          # - NO lectura previa del sheet
          # - A-C: se escribe SIEMPRE para todos (metadata no sensible)
          # - D/E: solo para éxitos (token + token_time)
          # - F: solo para rotaciones (refresh_time)
          # - workflows row: status + next_run (monitor)
          # ----------------------------
          data = []

          # 1) A-C block for all rows in one range
          if n > 0:
              ac_values = []
              for char_id, info in items:
                  ac_values.append([
                      info.get("account",""),
                      info.get("char_name",""),
                      str(char_id),
                  ])
              data.append({
                  "range": f"{access_tab}!A2:C{n+1}",
                  "majorDimension": "ROWS",
                  "values": ac_values
              })

          # 2) D/E/F sparse updates (each as a single-cell range) but all inside ONE batch call
          # Column letters: D=4th, E=5th, F=6th
          # Row number = 2 + i
          for i, (char_id, info) in enumerate(items):
              rownum = 2 + i
              cid = str(char_id)

              if cid in successes:
                  token = new_access.get(cid, "")
                  # D cell
                  data.append({"range": f"{access_tab}!D{rownum}", "majorDimension": "ROWS", "values": [[token]]})
                  # E cell (token_time)
                  data.append({"range": f"{access_tab}!E{rownum}", "majorDimension": "ROWS", "values": [[now_str]]})

              # refresh_time only if rotated
              if cid in rotated:
                  data.append({"range": f"{access_tab}!F{rownum}", "majorDimension": "ROWS", "values": [[now_str]]})

          # 3) workflows monitor: status + next_run (now + cooldown)
          # NOTE: assumes workflows tab columns:
          #   status in col? and next_run in col?
          # Since we must not READ headers, we assume fixed columns:
          #   status = column B, next_run = column C (ajusta si tu sheet es distinto)
          #
          # 👉 Si tu sheet no usa B/C, cambia solo estas dos referencias.
          status_col = "B"
          next_col = "C"
          now = utc_now()
          next_run = (now + datetime.timedelta(seconds=cooldown)).strftime("%Y-%m-%d %H:%M:%S")

          data.append({"range": f"{workflows_tab}!{status_col}{workflows_row}", "majorDimension": "ROWS", "values": [["completed"]]})
          data.append({"range": f"{workflows_tab}!{next_col}{workflows_row}", "majorDimension": "ROWS", "values": [[next_run]]})

          # Execute ONE Sheets call
          if data:
              sheets_batch_update(sheets_id, data, g_access_token)

          # Safe summary
          print(f"Access tokens refreshed: {len(successes)} ok, {len(failures)} failed. Rotated refresh: {len(rotated)}.")
          if failures:
              print("Failed character_ids:", ", ".join(failures))
          PY

      # ==========================================================================
      # 4) FINALIZE - si el job falló por infra (exception), marca failed en workflows
      #    (también en 1 sola llamada batchUpdate)
      # ==========================================================================
      - name: "FINALIZE - mark failed (single call, no reads)"
        if: failure()
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, datetime
          import requests

          def sheets_batch_update(spreadsheet_id, data_ranges, access_token):
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{spreadsheet_id}/values:batchUpdate"
              body = {"valueInputOption": "RAW", "data": data_ranges}
              r = requests.post(
                  url,
                  headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
                  json=body,
                  timeout=60,
              )
              r.raise_for_status()

          sheets_id = os.environ["SHEETS_ID"]
          workflows_tab = os.environ["SHEET_TAB"]
          workflows_row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          cooldown = int(os.environ["COOLDOWN"])
          token = os.environ["ACCESS_TOKEN"]

          # Assumed fixed columns (ajusta si difiere)
          status_col = "B"
          next_col = "C"

          now = datetime.datetime.now(datetime.timezone.utc)
          next_run = (now + datetime.timedelta(seconds=cooldown)).strftime("%Y-%m-%d %H:%M:%S")

          data = [
              {"range": f"{workflows_tab}!{status_col}{workflows_row}", "majorDimension": "ROWS", "values": [["failed"]]},
              {"range": f"{workflows_tab}!{next_col}{workflows_row}", "majorDimension": "ROWS", "values": [[next_run]]},
          ]
          sheets_batch_update(sheets_id, data, token)
          print("FINALIZE failed written.")
          PY
