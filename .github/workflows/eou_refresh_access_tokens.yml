name: Refresh Access Tokens (SSO → GHs + GS)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: eou_refresh_access_tokens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # ------------------------------------------------------------------------
      # Identidad del workflow
      # ------------------------------------------------------------------------
      WORKFLOW_FILE: "eou_refresh_access_tokens.yml"

      # ------------------------------------------------------------------------
      # Google Sheets
      # ------------------------------------------------------------------------
      SHEETS_ID: "1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8"
      WORKFLOWS_TAB: "workflows"
      ACCESS_TOKENS_TAB: "access_tokens"
      SHEETS_WORKFLOW_ROW: "3"

      # Planificación / monitor
      LOCK_TIME: "60"
      COOLDOWN: "900"

      # SSO
      SSO_TOKEN_URL: "https://login.eveonline.com/v2/oauth/token"

      # Secrets names
      REFRESH_TOKENS_SECRET_NAME: "EOU_REFRESH_TOKENS"

      # GitHub secret hard limit is 48 KB. Keep small margin.
      SECRET_MAX_BYTES: "49152"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Google auth (WIF) for Sheets API (access token with spreadsheets scope)
      - name: Auth to Google (WIF)
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/spreadsheets"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # Refresh tokens, build:
      # - access_tokens_1.json, access_tokens_2.json (char_id -> access_token)
      # - refresh_tokens_new.json (updated only if rotation happened)
      # - sheets_batch_payload.json (single request payload)
      - name: Refresh access tokens + prepare updates
        env:
          EOU_CLIENTS: ${{ secrets.EOU_CLIENTS }}
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
          SECRET_MAX_BYTES: ${{ env.SECRET_MAX_BYTES }}
          SSO_TOKEN_URL: ${{ env.SSO_TOKEN_URL }}
          ACCESS_TOKENS_TAB: ${{ env.ACCESS_TOKENS_TAB }}
          WORKFLOWS_TAB: ${{ env.WORKFLOWS_TAB }}
          SHEETS_WORKFLOW_ROW: ${{ env.SHEETS_WORKFLOW_ROW }}
          COOLDOWN: ${{ env.COOLDOWN }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          import time
          from datetime import datetime, timezone
          import requests

          # Sheets/Excel serial date system:
          # serial = days since 1899-12-30 (fractional part is time-of-day)
          # 1970-01-01 is serial 25569
          SHEETS_EPOCH_OFFSET = 25569.0
          SECONDS_PER_DAY = 86400.0

          def epoch_to_sheets_serial(epoch_seconds: float) -> float:
              return (epoch_seconds / SECONDS_PER_DAY) + SHEETS_EPOCH_OFFSET

          def utc_iso():
              return datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")

          def b64_basic(user: str, pwd: str) -> str:
              token = base64.b64encode(f"{user}:{pwd}".encode("utf-8")).decode("ascii")
              return f"Basic {token}"

          def safe_json_load(name: str):
              raw = os.environ.get(name, "")
              if not raw.strip():
                  return {}
              try:
                  return json.loads(raw)
              except Exception as e:
                  raise RuntimeError(f"{name} is not valid JSON: {e}")

          clients = safe_json_load("EOU_CLIENTS")
          refresh_map = safe_json_load("EOU_REFRESH_TOKENS")

          access_1 = safe_json_load("EOU_ACCESS_TOKENS_1")
          access_2 = safe_json_load("EOU_ACCESS_TOKENS_2")

          for app, cfg in clients.items():
              if "client_id" not in cfg or "client_secret" not in cfg or "access_tokens_secret" not in cfg:
                  raise RuntimeError(
                      f"EOU_CLIENTS entry '{app}' must include client_id, client_secret, access_tokens_secret"
                  )

          # Order rows by INTEGER character_id (ascending)
          # Each refresh_map entry must include: account, char_name, app, refresh_token
          items = []
          for char_id_str, info in refresh_map.items():
              try:
                  char_id_int = int(char_id_str)
              except Exception:
                  raise RuntimeError(f"Invalid character_id key in EOU_REFRESH_TOKENS: {char_id_str}")
              items.append((char_id_int, info))
          items.sort(key=lambda x: x[0])

          sso_url = os.environ["SSO_TOKEN_URL"]

          sheet_updates = []
          rotated_any = False

          ok = 0
          fail = 0

          # We'll compute numeric times as Sheets serial values
          now_epoch = time.time()
          token_time_serial = epoch_to_sheets_serial(now_epoch)

          refresh_time_serial_by_char = {}  # char_id_int -> serial, only when rotated

          for idx, (char_id_int, info) in enumerate(items):
              # Required fields in info
              account = info.get("account", "")
              char_name = info.get("char_name", "")
              app = info.get("app")
              rt_old = info.get("refresh_token")

              if not app or not rt_old:
                  fail += 1
                  continue

              cfg = clients.get(app)
              if not cfg:
                  fail += 1
                  continue

              client_id = cfg["client_id"]
              client_secret = cfg["client_secret"]
              target_secret = cfg["access_tokens_secret"]

              headers = {
                  "Authorization": b64_basic(client_id, client_secret),
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
                  "User-Agent": "eou-refresh-access-tokens/1.0",
              }
              data = {
                  "grant_type": "refresh_token",
                  "refresh_token": rt_old,
              }

              try:
                  r = requests.post(sso_url, headers=headers, data=data, timeout=30)
              except Exception:
                  fail += 1
                  continue

              if r.status_code != 200:
                  fail += 1
                  continue

              try:
                  payload = r.json()
              except Exception:
                  fail += 1
                  continue

              access_token = payload.get("access_token")
              if not access_token:
                  fail += 1
                  continue

              # Handle refresh token rotation
              rt_new = payload.get("refresh_token")
              if rt_new and rt_new != rt_old:
                  refresh_map[str(char_id_int)]["refresh_token"] = rt_new
                  rotated_any = True
                  refresh_time_serial_by_char[char_id_int] = epoch_to_sheets_serial(time.time())

              # Store access token into the correct secret map
              if target_secret == "EOU_ACCESS_TOKENS_1":
                  access_1[str(char_id_int)] = access_token
              elif target_secret == "EOU_ACCESS_TOKENS_2":
                  access_2[str(char_id_int)] = access_token
              else:
                  fail += 1
                  continue

              # Sheet row mapping: header in row 1, data starts row 2
              row = 2 + idx

              # refresh_time serial or blank
              refresh_time_serial = refresh_time_serial_by_char.get(char_id_int, "")

              # IMPORTANT:
              # - character_id must be INTEGER (not string)
              # - token_time/refresh_time must be numeric serial (float) (or blank)
              sheet_updates.append({
                  "range": f"{os.environ['ACCESS_TOKENS_TAB']}!A{row}:F{row}",
                  "values": [[
                      account,
                      char_name,
                      char_id_int,            # integer
                      access_token,
                      token_time_serial,      # numeric serial
                      refresh_time_serial     # numeric serial or ""
                  ]],
              })

              ok += 1

          def dump_json(path: str, obj: dict):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(",", ":"), sort_keys=True)

          dump_json("access_tokens_1.json", access_1)
          dump_json("access_tokens_2.json", access_2)
          dump_json("refresh_tokens_new.json", refresh_map)

          # Workflows tab update:
          # status in column B, next_run in column D
          # If status=completed -> next_run = now + COOLDOWN (as Sheets serial number)
          # If status=fail -> next_run not changed (so we simply don't update column D)
          status = "completed" if fail == 0 else "fail"
          row_wf = int(os.environ["SHEETS_WORKFLOW_ROW"])
          wf_tab = os.environ["WORKFLOWS_TAB"]

          wf_updates = [{
              "range": f"{wf_tab}!B{row_wf}:B{row_wf}",
              "values": [[status]],
          }]

          if status == "completed":
              cooldown = int(os.environ.get("COOLDOWN", "900"))
              next_run_epoch = time.time() + cooldown
              next_run_serial = epoch_to_sheets_serial(next_run_epoch)
              wf_updates.append({
                  "range": f"{wf_tab}!D{row_wf}:D{row_wf}",
                  "values": [[next_run_serial]],
              })

          # Single batch update payload (RAW so numbers stay numbers)
          payload = {
              "valueInputOption": "RAW",
              "data": wf_updates + sheet_updates,
              "includeValuesInResponse": False
          }

          with open("sheets_batch_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)

          # Size safety check
          max_bytes = int(os.environ.get("SECRET_MAX_BYTES", "49152"))

          def file_size(p):
              import os
              return os.path.getsize(p)

          sz1 = file_size("access_tokens_1.json")
          sz2 = file_size("access_tokens_2.json")

          if sz1 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_1 size {sz1} bytes exceeds limit {max_bytes}. Reduce accounts in secret 1.")
          if sz2 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_2 size {sz2} bytes exceeds limit {max_bytes}. Reduce accounts in secret 2.")

          print(f"Refreshed OK: {ok}, Failed: {fail}, Rotated refresh_token: {rotated_any}")
          print(f"EOU_ACCESS_TOKENS_1 bytes: {sz1}, EOU_ACCESS_TOKENS_2 bytes: {sz2}")

          with open("flags.env", "w", encoding="utf-8") as f:
              f.write(f"ROTATED_ANY={'true' if rotated_any else 'false'}\n")
              f.write(f"STATUS={'completed' if fail == 0 else 'fail'}\n")
              f.write(f"OK={ok}\n")
              f.write(f"FAIL={fail}\n")
          PY

      - name: Load flags
        run: |
          set -euo pipefail
          cat flags.env >> "$GITHUB_ENV"

      # GitHub CLI secrets update
      - name: Update access token secrets (split)
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_SECRETS_ADMIN_TOKEN is empty."
            exit 1
          fi

          # gh secret set reads from STDIN when --body is omitted
          gh secret set EOU_ACCESS_TOKENS_1 --repo "${GITHUB_REPOSITORY}" < access_tokens_1.json
          gh secret set EOU_ACCESS_TOKENS_2 --repo "${GITHUB_REPOSITORY}" < access_tokens_2.json

      - name: Update refresh tokens secret (only if rotated)
        if: env.ROTATED_ANY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set "${REFRESH_TOKENS_SECRET_NAME}" --repo "${GITHUB_REPOSITORY}" < refresh_tokens_new.json

      # Write Google Sheet (single batch update request)
      - name: Write Google Sheet (batchUpdate)
        env:
          ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "Empty Google ACCESS_TOKEN"
            exit 1
          fi

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_batch_payload.json \
            >/dev/null

      - name: Done
        run: echo "Refresh completed."
