      - name: Guard - skip only if another run is in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          owner_repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${owner_repo}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress&per_page=10"

          resp="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" -w '\n%{http_code}' "${api}" || true)"
          body="$(printf '%s\n' "${resp}" | sed '$d')"
          code="$(printf '%s\n' "${resp}" | tail -n 1)"

          if [ "${code}" != "200" ] || [ -z "${body}" ]; then
            echo "Guard: cannot query in_progress runs (HTTP ${code}). Continuing."
            exit 0
          fi

          others_count="$(python - <<'PY' <<<"${body}"
          import json, os, sys

          try:
              runs = json.loads(sys.stdin.read() or "{}")
          except Exception:
              print(0)
              raise SystemExit(0)

          me = int(os.environ.get("GITHUB_RUN_ID", "0"))
          wfruns = runs.get("workflow_runs") or []
          other = [r for r in wfruns if int(r.get("id", -1)) != me]
          print(len(other))
          PY
          )"

          if [ "${others_count}" -gt 0 ]; then
            echo "Skipped: another run is in progress (anti-overlap)."
            exit 0
          fi
