# ==============================================================================
# Refresh Access Tokens (SSO → GHs + GS)
# - Basado en plantilla_no_funcional_v1.txt (misma estructura de bloques)
# - Fuente de verdad: GitHub Secret EOU_ACCESS_TOKENS
# - Espejo: Google Sheet tab access_tokens
#
# CAMBIOS EN ESTA VERSIÓN:
#   1) GH_ADMIN_PAT ahora viene de secrets.GH_SECRETS_ADMIN
#   2) EOU_ACCESS_TOKENS: JSON compacto { "<character_id>": "<access_token>" }
# ==============================================================================

name: Refresh Access Tokens (SSO → GHs + GS)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: eou_refresh_access_tokens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      WORKFLOW_FILE: "eou_refresh_access_tokens.yml"

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: 3

      LOCK_TIME: 60
      COOLDOWN: 900

      ACCESS_TOKENS_TAB: access_tokens

      SSO_TOKEN_URL: "https://login.eveonline.com/v2/oauth/token"

      ACCESS_TOKENS_SECRET_NAME: "EOU_ACCESS_TOKENS"
      REFRESH_TOKENS_SECRET_NAME: "EOU_REFRESH_TOKENS"

      # Plan B preparado (48KB): por defecto NO particiona (mantiene 1 JSON).
      ENABLE_SECRET_PARTITION: "false"
      SECRET_MAX_BYTES: "46000"

    steps:
      # ==========================================================================
      # 1) GUARD (COMÚN) - evita trabajo en cola / duplicado
      # ==========================================================================
      - name: "GUARD (common) - compute proceed=true/false"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NOW_EPOCH="$(date -u +%s)"
          PROCEED="true"

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?status=completed&per_page=1"
          JSON="$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$API")"

          LAST_UPDATED_AT="$(echo "$JSON" | jq -r '.workflow_runs[0].updated_at // empty')"
          if [[ -n "${LAST_UPDATED_AT}" ]]; then
            LAST_EPOCH="$(date -u -d "${LAST_UPDATED_AT}" +%s)"
            DIFF="$(( NOW_EPOCH - LAST_EPOCH ))"
            if (( DIFF < COOLDOWN )); then
              PROCEED="false"
              echo "Guard: last completed run was ${DIFF}s ago (< COOLDOWN=${COOLDOWN}s). Skipping work."
            else
              echo "Guard: last completed run was ${DIFF}s ago (>= COOLDOWN). Proceed."
            fi
          else
            echo "Guard: no previous completed runs found. Proceed."
          fi

          echo "proceed=${PROCEED}" > /tmp/proceed

      - name: "GUARD (common) - publish proceed"
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          echo "proceed=$(sed -n 's/^proceed=//p' /tmp/proceed)" >> "$GITHUB_OUTPUT"

      # ==========================================================================
      # 2) AUTH GOOGLE (COMÚN) - WIF/OIDC sin claves
      # ==========================================================================
      - name: "AUTH (common) - Google WIF/OIDC"
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"
          token_format: "access_token"
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # ==========================================================================
      # 3) BUSY EXIT (COMÚN)
      # ==========================================================================
      - name: "BUSY EXIT (common)"
        if: steps.guard.outputs.proceed != 'true'
        shell: bash
        run: |
          echo "Skipped due to cooldown guard (anti-queue / anti-duplicate)"
          exit 0

      # ==========================================================================
      # 4) LOCK INICIAL EN SHEETS (COMÚN)
      # ==========================================================================
      - name: "LOCK (common) - in_progress + next_run"
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, datetime, sys
          import urllib.request

          def col_letter(idx0: int) -> str:
              idx = idx0 + 1
              s = ""
              while idx:
                  idx, r = divmod(idx - 1, 26)
                  s = chr(65 + r) + s
              return s

          sheets_id = os.environ["SHEETS_ID"]
          tab = os.environ["SHEET_TAB"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          lock_time = int(os.environ["LOCK_TIME"])
          token = os.environ["ACCESS_TOKEN"]

          now = datetime.datetime.now(datetime.timezone.utc)
          next_run = now + datetime.timedelta(seconds=lock_time)
          now_str = now.strftime("%Y-%m-%d %H:%M:%S")
          next_run_str = next_run.strftime("%Y-%m-%d %H:%M:%S")

          hdr_url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values/{tab}!1:1"
          req = urllib.request.Request(hdr_url, headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          headers = (data.get("values") or [[]])[0]
          headers_l = [h.strip().lower() for h in headers]

          def find_col(name: str):
              return headers_l.index(name) if name in headers_l else None

          c_status = find_col("status")
          c_next = find_col("next_run")

          if c_status is None or c_next is None:
              print("LOCK error: columns 'status' and/or 'next_run' not found in workflows header row.", file=sys.stderr)
              print(f"Headers seen: {headers}", file=sys.stderr)
              sys.exit(1)

          a1_status = f"{tab}!{col_letter(c_status)}{row}"
          a1_next = f"{tab}!{col_letter(c_next)}{row}"

          body = {
              "valueInputOption": "RAW",
              "data": [
                  {"range": a1_status, "majorDimension": "ROWS", "values": [["in_progress"]]},
                  {"range": a1_next,   "majorDimension": "ROWS", "values": [[next_run_str]]},
              ],
          }

          url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values:batchUpdate"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              _ = resp.read()
          print(f"LOCK ok: status=in_progress; next_run={next_run_str} UTC (now={now_str} UTC)")
          PY

      # ==========================================================================
      # 5) OBJECTIVE
      # ==========================================================================
      - name: "OBJECTIVE - step 1 (setup tools)"
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip >/dev/null
          python3 -m pip install requests pynacl >/dev/null

      - name: "OBJECTIVE - step 2 (refresh tokens + persist)"
        if: steps.guard.outputs.proceed == 'true'
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"

          # 👇 CAMBIO: usar el PAT admin renombrado
          GH_ADMIN_PAT: "${{ secrets.GH_SECRETS_ADMIN }}"

          EOU_CLIENTS: "${{ secrets.EOU_CLIENTS }}"
          EOU_REFRESH_TOKENS: "${{ secrets.EOU_REFRESH_TOKENS }}"
          EOU_ACCESS_TOKENS: "${{ secrets.EOU_ACCESS_TOKENS }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, datetime, sys
          import requests
          from nacl.public import PublicKey, SealedBox

          # ----------------------------
          # Helpers
          # ----------------------------
          def utc_now_str():
              return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S")

          def gh_api_headers(token: str):
              return {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

          def gh_get_public_key(owner, repo, token):
              url = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key"
              r = requests.get(url, headers=gh_api_headers(token), timeout=30)
              r.raise_for_status()
              j = r.json()
              return j["key_id"], j["key"]  # key is base64

          def gh_put_secret(owner, repo, token, secret_name, plaintext_value: str):
              key_id, key_b64 = gh_get_public_key(owner, repo, token)
              pk = PublicKey(base64.b64decode(key_b64))
              sealed = SealedBox(pk)
              encrypted = sealed.encrypt(plaintext_value.encode("utf-8"))
              encrypted_b64 = base64.b64encode(encrypted).decode("utf-8")

              url = f"https://api.github.com/repos/{owner}/{repo}/actions/secrets/{secret_name}"
              payload = {"encrypted_value": encrypted_b64, "key_id": key_id}
              r = requests.put(url, headers=gh_api_headers(token), json=payload, timeout=30)
              r.raise_for_status()

          def sheets_get_values(sheets_id, a1_range, access_token):
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values/{a1_range}"
              r = requests.get(url, headers={"Authorization": f"Bearer {access_token}"}, timeout=30)
              r.raise_for_status()
              return r.json().get("values", [])

          def sheets_batch_update(sheets_id, data_ranges, access_token):
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values:batchUpdate"
              body = {"valueInputOption": "RAW", "data": data_ranges}
              r = requests.post(
                  url,
                  headers={"Authorization": f"Bearer {access_token}", "Content-Type": "application/json"},
                  json=body,
                  timeout=60,
              )
              r.raise_for_status()

          # ----------------------------
          # Load config / secrets
          # ----------------------------
          repo_full = os.environ["GITHUB_REPOSITORY"]  # owner/repo
          owner, repo = repo_full.split("/", 1)

          pat = os.environ.get("GH_ADMIN_PAT", "")
          if not pat:
              raise RuntimeError("GH_ADMIN_PAT is empty. Ensure repo secret GH_SECRETS_ADMIN exists and is readable.")

          access_token = os.environ["ACCESS_TOKEN"]

          sso_url = os.environ["SSO_TOKEN_URL"]
          sheets_id = os.environ["SHEETS_ID"]
          tab_tokens = os.environ["ACCESS_TOKENS_TAB"]

          secret_access_name = os.environ["ACCESS_TOKENS_SECRET_NAME"]
          secret_refresh_name = os.environ["REFRESH_TOKENS_SECRET_NAME"]

          enable_partition = os.environ.get("ENABLE_SECRET_PARTITION", "false").lower() == "true"
          secret_max_bytes = int(os.environ.get("SECRET_MAX_BYTES", "46000"))

          clients = json.loads(os.environ["EOU_CLIENTS"] or "{}")
          refresh_map = json.loads(os.environ["EOU_REFRESH_TOKENS"] or "{}")

          # EOU_ACCESS_TOKENS ahora es formato compacto {char_id: token}
          old_access = json.loads(os.environ.get("EOU_ACCESS_TOKENS") or "{}")

          # ----------------------------
          # Read current sheet to preserve token_time / refresh_time on failures/no-rotation
          # A-F: account, character, character_id, access_token, token_time, refresh_time
          # ----------------------------
          sheet_values = sheets_get_values(sheets_id, f"{tab_tokens}!A1:F", access_token)
          existing = {}  # char_id -> {"token_time":..., "refresh_time":...}
          if sheet_values:
              header = [c.strip().lower() for c in sheet_values[0]] if sheet_values else []
              has_header = ("character_id" in header) or (header[:3] == ["account", "character", "character_id"])
              start_row = 1 if has_header else 0

              for row in sheet_values[start_row:]:
                  row = row + [""] * (6 - len(row))
                  char_id = (row[2] or "").strip()
                  if not char_id:
                      continue
                  existing[char_id] = {
                      "token_time": (row[4] or "").strip(),
                      "refresh_time": (row[5] or "").strip(),
                  }

          # ----------------------------
          # Refresh loop (partial success allowed)
          # ----------------------------
          now_str = utc_now_str()
          new_access = dict(old_access)    # merge base: preserve old tokens on failure
          new_refresh = dict(refresh_map)  # will update refresh_token if rotated

          successes = set()
          failures = []
          rotated = set()

          session = requests.Session()

          def sort_key(item):
              char_id, info = item
              return (info.get("account",""), info.get("char_name",""), str(char_id))

          for char_id, info in sorted(refresh_map.items(), key=sort_key):
              char_id_s = str(char_id)
              app = info.get("app")
              rt = info.get("refresh_token")

              if not app or app not in clients:
                  failures.append(char_id_s)
                  continue

              cid = clients[app].get("client_id")
              csec = clients[app].get("client_secret")
              if not cid or not csec or not rt:
                  failures.append(char_id_s)
                  continue

              basic = base64.b64encode(f"{cid}:{csec}".encode("utf-8")).decode("ascii")
              headers = {
                  "Authorization": f"Basic {basic}",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
              }
              data = {"grant_type": "refresh_token", "refresh_token": rt}

              try:
                  r = session.post(sso_url, headers=headers, data=data, timeout=30)
                  if r.status_code != 200:
                      failures.append(char_id_s)
                      continue
                  j = r.json()
              except Exception:
                  failures.append(char_id_s)
                  continue

              at = j.get("access_token")
              if not at:
                  failures.append(char_id_s)
                  continue

              # Mask ASAP
              print(f"::add-mask::{at}")

              # ✅ CAMBIO CLAVE: formato compacto {char_id: token}
              new_access[char_id_s] = at
              successes.add(char_id_s)

              # Refresh token rotation (if returned and changed)
              new_rt = j.get("refresh_token")
              if new_rt and new_rt != rt:
                  print(f"::add-mask::{new_rt}")
                  new_refresh[char_id_s] = dict(info)
                  new_refresh[char_id_s]["refresh_token"] = new_rt
                  rotated.add(char_id_s)

          # ----------------------------
          # Persist GitHub Secrets (EOU_ACCESS_TOKENS always; EOU_REFRESH_TOKENS if rotated)
          # ----------------------------
          access_json = json.dumps(new_access, ensure_ascii=False, separators=(",", ":"))
          access_bytes = len(access_json.encode("utf-8"))

          if access_bytes > secret_max_bytes and not enable_partition:
              raise RuntimeError(
                  f"{secret_access_name} size {access_bytes} bytes exceeds safety limit {secret_max_bytes}. "
                  f"Enable partition by setting ENABLE_SECRET_PARTITION=true."
              )

          gh_put_secret(owner, repo, pat, secret_access_name, access_json)

          refresh_rotated = len(rotated) > 0
          if refresh_rotated:
              refresh_json = json.dumps(new_refresh, ensure_ascii=False, separators=(",", ":"))
              refresh_bytes = len(refresh_json.encode("utf-8"))
              if refresh_bytes > secret_max_bytes and not enable_partition:
                  raise RuntimeError(
                      f"{secret_refresh_name} size {refresh_bytes} bytes exceeds safety limit {secret_max_bytes}. "
                      f"Enable partition by setting ENABLE_SECRET_PARTITION=true."
                  )
              gh_put_secret(owner, repo, pat, secret_refresh_name, refresh_json)

          # ----------------------------
          # Update Google Sheet tab access_tokens (A-F)
          # Rules:
          # - if char fails: do NOT overwrite token nor token_time
          # - if refresh rotated: set refresh_time (col F) = now
          # ----------------------------
          rows = []
          for char_id, info in sorted(refresh_map.items(), key=sort_key):
              char_id_s = str(char_id)
              account = info.get("account","")
              character = info.get("char_name","")

              # token: from new_access (updated) or old_access (preserved); empty if missing
              token = new_access.get(char_id_s, "")

              token_time = now_str if char_id_s in successes else existing.get(char_id_s, {}).get("token_time", "")
              refresh_time = now_str if char_id_s in rotated else existing.get(char_id_s, {}).get("refresh_time", "")

              rows.append([account, character, char_id_s, token, token_time, refresh_time])

          # Clear extra old rows by padding
          header = [c.strip().lower() for c in sheet_values[0]] if sheet_values else []
          has_header = ("character_id" in header) or (header[:3] == ["account", "character", "character_id"])
          existing_rows = max(0, len(sheet_values) - (1 if has_header and sheet_values else 0))
          target_rows = max(existing_rows, len(rows))
          while len(rows) < target_rows:
              rows.append(["", "", "", "", "", ""])

          if target_rows > 0:
              data_ranges = [{
                  "range": f"{tab_tokens}!A2:F{target_rows+1}",
                  "majorDimension": "ROWS",
                  "values": rows
              }]
              sheets_batch_update(sheets_id, data_ranges, access_token)

          # Safe summary
          print(f"Refreshed access tokens: {len(successes)} ok, {len(failures)} failed.")
          if failures:
              print("Failed character_ids:", ", ".join(failures))
          if refresh_rotated:
              print(f"Refresh token rotated for {len(rotated)} character_ids.")
          PY

      # ==========================================================================
      # 6) FINALIZE EN SHEETS (COMÚN)
      # ==========================================================================
      - name: "FINALIZE (common) - completed + cooldown"
        if: steps.guard.outputs.proceed == 'true' && success()
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, datetime, sys
          import urllib.request

          def col_letter(idx0: int) -> str:
              idx = idx0 + 1
              s = ""
              while idx:
                  idx, r = divmod(idx - 1, 26)
                  s = chr(65 + r) + s
              return s

          sheets_id = os.environ["SHEETS_ID"]
          tab = os.environ["SHEET_TAB"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          cooldown = int(os.environ["COOLDOWN"])
          token = os.environ["ACCESS_TOKEN"]

          now = datetime.datetime.now(datetime.timezone.utc)
          next_run = now + datetime.timedelta(seconds=cooldown)
          now_str = now.strftime("%Y-%m-%d %H:%M:%S")
          next_run_str = next_run.strftime("%Y-%m-%d %H:%M:%S")

          hdr_url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values/{tab}!1:1"
          req = urllib.request.Request(hdr_url, headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          headers = (data.get("values") or [[]])[0]
          headers_l = [h.strip().lower() for h in headers]

          if "status" not in headers_l or "next_run" not in headers_l:
              print("FINALIZE error: columns 'status' and/or 'next_run' not found in workflows header row.", file=sys.stderr)
              print(f"Headers seen: {headers}", file=sys.stderr)
              sys.exit(1)

          c_status = headers_l.index("status")
          c_next = headers_l.index("next_run")

          a1_status = f"{tab}!{col_letter(c_status)}{row}"
          a1_next = f"{tab}!{col_letter(c_next)}{row}"

          body = {
              "valueInputOption": "RAW",
              "data": [
                  {"range": a1_status, "majorDimension": "ROWS", "values": [["completed"]]},
                  {"range": a1_next,   "majorDimension": "ROWS", "values": [[next_run_str]]},
              ],
          }

          url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values:batchUpdate"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              _ = resp.read()

          print(f"FINALIZE ok: status=completed; next_run={next_run_str} UTC (now={now_str} UTC)")
          PY

      - name: "FINALIZE (common) - failed + cooldown"
        if: steps.guard.outputs.proceed == 'true' && failure()
        shell: bash
        env:
          ACCESS_TOKEN: "${{ steps.gcp_auth.outputs.access_token }}"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, datetime, sys
          import urllib.request

          def col_letter(idx0: int) -> str:
              idx = idx0 + 1
              s = ""
              while idx:
                  idx, r = divmod(idx - 1, 26)
                  s = chr(65 + r) + s
              return s

          sheets_id = os.environ["SHEETS_ID"]
          tab = os.environ["SHEET_TAB"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          cooldown = int(os.environ["COOLDOWN"])
          token = os.environ["ACCESS_TOKEN"]

          now = datetime.datetime.now(datetime.timezone.utc)
          next_run = now + datetime.timedelta(seconds=cooldown)
          now_str = now.strftime("%Y-%m-%d %H:%M:%S")
          next_run_str = next_run.strftime("%Y-%m-%d %H:%M:%S")

          hdr_url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values/{tab}!1:1"
          req = urllib.request.Request(hdr_url, headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          headers = (data.get("values") or [[]])[0]
          headers_l = [h.strip().lower() for h in headers]

          if "status" not in headers_l or "next_run" not in headers_l:
              print("FINALIZE error: columns 'status' and/or 'next_run' not found in workflows header row.", file=sys.stderr)
              print(f"Headers seen: {headers}", file=sys.stderr)
              sys.exit(1)

          c_status = headers_l.index("status")
          c_next = headers_l.index("next_run")

          a1_status = f"{tab}!{col_letter(c_status)}{row}"
          a1_next = f"{tab}!{col_letter(c_next)}{row}"

          body = {
              "valueInputOption": "RAW",
              "data": [
                  {"range": a1_status, "majorDimension": "ROWS", "values": [["failed"]]},
                  {"range": a1_next,   "majorDimension": "ROWS", "values": [[next_run_str]]},
              ],
          }

          url = f"https://sheets.googleapis.com/v4/spreadsheets/{sheets_id}/values:batchUpdate"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              _ = resp.read()

          print(f"FINALIZE ok: status=failed; next_run={next_run_str} UTC (now={now_str} UTC)")
          PY
