name: Refresh Access Tokens (SSO → GHs)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # necesario para WIF/OIDC (Google)

# Opcional: puedes quitarlo si confías 100% en el lock del gateway
concurrency:
  group: eou-sso-token-refresh
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # Gateway contract
      WORKFLOW_ID: eou_refresh_access_tokens
      WORKFLOW_NAME: "Refresh Access Tokens (SSO -> GHs)"
      SHEET_ROW: "2"         # fila de control del gateway (tu lock)
      EXPIRES: "900"         # lease del lock (seg)
      LOCK_SECONDS: "60"     # lock mínimo (seg)

      # Google Sheet destino (tokens)
      TOKENS_SPREADSHEET_ID: "1LDi6LFPYO99Rz6OBnwt58dI60aWyw1OFLEcnyt0yHAA"
      TOKENS_TAB_NAME: "access_tokens"

    steps:
      - name: Preflight (gateway sanity check)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START (gateway lock)
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          WF_NAME_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))')"
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"

          # canonical = workflow_id|wf_name|row|phase|expires|lock_seconds|conclusion|now_ms
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null

          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on START: $RESP"
            exit 1
          fi

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

      - id: gcp_auth
        name: Auth to Google (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Refresh tokens, persist to GH Secrets, and write to Sheets (no logs)
        env:
          # Config/estado en GH Secrets
          EOU_CLIENTS: ${{ secrets.EOU_CLIENTS }}
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}
          EOU_ACCESS_TOKENS: ${{ secrets.EOU_ACCESS_TOKENS }}

          # Para actualizar secrets desde Actions
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}

          # Google access token (WIF)
          GOOGLE_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import subprocess
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          TOKEN_URL = "https://login.eveonline.com/v2/oauth/token"

          SPREADSHEET_ID = os.environ["TOKENS_SPREADSHEET_ID"]
          TAB_NAME = os.environ["TOKENS_TAB_NAME"]
          G_TOKEN = os.environ.get("GOOGLE_ACCESS_TOKEN", "").strip()

          # ORDEN FIJO (fila 2..12)
          ORDERED_CHAR_IDS = [
            "90734547",
            "91939203",
            "92017833",
            "91412962",
            "92006397",
            "92006494",
            "92816858",
            "92817160",
            "2118026235",
            "2118561816",
            "2124070822",
          ]

          def iso_z(dt: datetime) -> str:
            return dt.replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def log(msg: str) -> None:
            # Nunca incluir tokens
            print(msg)

          def gh_set_secret(name: str, value: str) -> None:
            # Enviar por STDIN para no exponer en args/logs
            p = subprocess.run(
              ["gh", "secret", "set", name],
              input=value.encode("utf-8"),
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
              check=False,
              env=os.environ.copy(),
            )
            if p.returncode != 0:
              err = p.stderr.decode("utf-8", errors="replace").strip()
              raise RuntimeError(f"gh secret set {name} failed: {err}")

          def sheets_update(range_a1: str, values_rows: list) -> None:
            # PUT spreadsheets.values.update
            if not G_TOKEN:
              raise RuntimeError("Missing GOOGLE_ACCESS_TOKEN")
            url = (
              f"https://sheets.googleapis.com/v4/spreadsheets/{SPREADSHEET_ID}"
              f"/values/{urllib.request.quote(range_a1)}?valueInputOption=RAW"
            )
            payload = json.dumps({
              "range": range_a1,
              "majorDimension": "ROWS",
              "values": values_rows,
            }).encode("utf-8")

            req = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                "Authorization": f"Bearer {G_TOKEN}",
                "Content-Type": "application/json; charset=utf-8",
              },
            )
            with urllib.request.urlopen(req, timeout=25) as resp:
              resp.read()

          clients_raw = os.environ.get("EOU_CLIENTS", "").strip()
          refresh_raw = os.environ.get("EOU_REFRESH_TOKENS", "").strip()
          access_raw  = os.environ.get("EOU_ACCESS_TOKENS", "").strip()

          if not clients_raw:
            print("Missing EOU_CLIENTS", file=sys.stderr)
            sys.exit(2)
          if not refresh_raw:
            print("Missing EOU_REFRESH_TOKENS", file=sys.stderr)
            sys.exit(2)

          try:
            clients = json.loads(clients_raw)
            if not isinstance(clients, dict) or not clients:
              raise ValueError("EOU_CLIENTS must be a non-empty object")
          except Exception as e:
            print(f"Invalid EOU_CLIENTS JSON: {e}", file=sys.stderr)
            sys.exit(2)

          try:
            refresh_map = json.loads(refresh_raw)
            if not isinstance(refresh_map, dict) or not refresh_map:
              raise ValueError("EOU_REFRESH_TOKENS must be a non-empty object")
          except Exception as e:
            print(f"Invalid EOU_REFRESH_TOKENS JSON: {e}", file=sys.stderr)
            sys.exit(2)

          try:
            existing_access = json.loads(access_raw) if access_raw else {}
            if not isinstance(existing_access, dict):
              existing_access = {}
          except Exception:
            existing_access = {}

          updated_access = dict(existing_access)
          updated_refresh = dict(refresh_map)

          ok = 0
          fail = 0

          now_ts = iso_z(datetime.now(timezone.utc))

          # Refrescar EN TU ORDEN (no por sort)
          for char_id in ORDERED_CHAR_IDS:
            meta = refresh_map.get(char_id)
            prev = updated_access.get(char_id, {}) if isinstance(updated_access.get(char_id), dict) else {}

            # Defaults: mantener último token/ts si falla
            keep_access_token = prev.get("access_token", "")
            keep_ts_token = prev.get("ts_token", "")
            account = ""
            char_name = ""

            if isinstance(meta, dict):
              account = str(meta.get("account", "")).strip()
              char_name = str(meta.get("char_name", "")).strip()
              app = str(meta.get("app", "")).strip()
              rt  = str(meta.get("refresh_token", "")).strip()
            else:
              app = ""
              rt = ""

            if not isinstance(meta, dict):
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": "MISSING_REFRESH_ENTRY",
              }
              fail += 1
              continue

            if not app or not rt:
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": "MISSING_APP_OR_REFRESH_TOKEN",
              }
              fail += 1
              continue

            app_cfg = clients.get(app)
            if not isinstance(app_cfg, dict):
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": f"APP_NOT_FOUND:{app}",
              }
              fail += 1
              continue

            client_id = str(app_cfg.get("client_id", "")).strip()
            client_secret = str(app_cfg.get("client_secret", "")).strip()
            if not client_id or not client_secret:
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": f"APP_MISSING_CLIENT_CREDS:{app}",
              }
              fail += 1
              continue

            basic = base64.b64encode(f"{client_id}:{client_secret}".encode("utf-8")).decode("ascii")
            headers = {
              "Authorization": f"Basic {basic}",
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json",
            }

            data = urllib.parse.urlencode({
              "grant_type": "refresh_token",
              "refresh_token": rt,
            }).encode("utf-8")

            req = urllib.request.Request(TOKEN_URL, data=data, headers=headers, method="POST")

            try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                body = resp.read()
              payload = json.loads(body.decode("utf-8"))

              at = payload.get("access_token")
              expires_in = payload.get("expires_in")

              if not at or not expires_in:
                updated_access[char_id] = {
                  "access_token": keep_access_token,
                  "ts_token": keep_ts_token,
                  "code": "ERR_MISSING_ACCESS_OR_EXPIRES",
                }
                fail += 1
                continue

              # SUCCESS => actualizar access_token + ts_token
              updated_access[char_id] = {
                "access_token": at,
                "ts_token": now_ts,
                "code": "success",
              }

              # Rotación de refresh_token (si viene)
              new_rt = payload.get("refresh_token")
              if isinstance(new_rt, str) and new_rt.strip():
                new_item = dict(meta)
                new_item["refresh_token"] = new_rt.strip()
                updated_refresh[char_id] = new_item

              ok += 1

            except urllib.error.HTTPError as e:
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": f"ERR_HTTP_{e.code}",
              }
              fail += 1
            except Exception as e:
              updated_access[char_id] = {
                "access_token": keep_access_token,
                "ts_token": keep_ts_token,
                "code": f"ERR_{type(e).__name__}",
              }
              fail += 1

          # Persistir GH Secrets (estado + posibles rotaciones)
          access_out = json.dumps(updated_access, separators=(",", ":"), ensure_ascii=False)
          refresh_out = json.dumps(updated_refresh, separators=(",", ":"), ensure_ascii=False)

          gh_set_secret("EOU_ACCESS_TOKENS", access_out)
          gh_set_secret("EOU_REFRESH_TOKENS", refresh_out)

          # Construir filas para Sheets (A2:E12)
          rows = []
          for char_id in ORDERED_CHAR_IDS:
            meta = refresh_map.get(char_id, {}) if isinstance(refresh_map.get(char_id), dict) else {}
            acc = str(meta.get("account", "")).strip()
            name = str(meta.get("char_name", "")).strip()

            st = updated_access.get(char_id, {}) if isinstance(updated_access.get(char_id), dict) else {}
            token = st.get("access_token", "")
            ts_token = st.get("ts_token", "")

            rows.append([acc, name, char_id, token, ts_token])

          start_row = 2
          end_row = start_row + len(rows) - 1  # 12
          rng = f"{TAB_NAME}!A{start_row}:E{end_row}"

          try:
            sheets_update(rng, rows)
          except urllib.error.HTTPError as e:
            # No parar el workflow si Sheets falla: ya persistimos en GH Secrets.
            log(f"[WARN] Sheets write failed HTTP {e.code}")
          except Exception as e:
            log(f"[WARN] Sheets write failed ({type(e).__name__})")

          log(f"[DONE] refreshed_ok={ok} refreshed_fail={fail} total={len(ORDERED_CHAR_IDS)} wrote_sheet_rows={len(rows)}")
          PY

      - name: FINISH (gateway unlock)
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          WF_NAME_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["WORKFLOW_NAME"]))')"

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW_MS="$(date -u +%s%3N)"

          # canonical = workflow_id|wf_name|row|phase|expires|lock_seconds|conclusion|now_ms
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null

          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on FINISH: $RESP"
            exit 1
          fi
