name: Refresh Access Tokens (SSO → GHs + GS)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: eou_refresh_access_tokens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # ------------------------------------------------------------------------
      # Identidad del workflow
      # ------------------------------------------------------------------------
      WORKFLOW_FILE: "eou_refresh_access_tokens.yml"

      # ------------------------------------------------------------------------
      # Google Sheets (estado compartido)
      # ------------------------------------------------------------------------
      SHEETS_ID: "1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8"

      WORKFLOWS_TAB: "workflows"
      SHEETS_WORKFLOW_ROW: "3"

      ACCESS_TOKENS_TAB: "access_tokens"

      # ------------------------------------------------------------------------
      # Control (monitor)
      # ------------------------------------------------------------------------
      LOCK_TIME: "60"
      COOLDOWN: "900"

      # ------------------------------------------------------------------------
      # SSO
      # ------------------------------------------------------------------------
      SSO_TOKEN_URL: "https://login.eveonline.com/v2/oauth/token"

      # ------------------------------------------------------------------------
      # GitHub secrets
      # ------------------------------------------------------------------------
      REFRESH_TOKENS_SECRET_NAME: "EOU_REFRESH_TOKENS"

      # GitHub secret hard limit is 48 KB. Keep a small margin.
      SECRET_MAX_BYTES: "49152"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Google auth (WIF) with Sheets scope
      - name: Auth to Google (WIF) for Sheets
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/spreadsheets"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # Refresh tokens, build:
      # - access_tokens_1.json, access_tokens_2.json (char_id -> access_token)
      # - refresh_tokens_new.json (updated only if rotation happened)
      # - sheets_batch_payload.json (single request payload with BOTH tabs)
      - name: Refresh access tokens + prepare Sheets updates
        env:
          GOOGLE_SHEETS_TOKEN: ${{ steps.gauth.outputs.access_token }}

          EOU_CLIENTS: ${{ secrets.EOU_CLIENTS }}
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}

          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}

          SECRET_MAX_BYTES: ${{ env.SECRET_MAX_BYTES }}

          SSO_TOKEN_URL: ${{ env.SSO_TOKEN_URL }}

          SHEETS_ID: ${{ env.SHEETS_ID }}
          WORKFLOWS_TAB: ${{ env.WORKFLOWS_TAB }}
          SHEETS_WORKFLOW_ROW: ${{ env.SHEETS_WORKFLOW_ROW }}
          ACCESS_TOKENS_TAB: ${{ env.ACCESS_TOKENS_TAB }}

          COOLDOWN: ${{ env.COOLDOWN }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          from datetime import datetime, timezone, timedelta
          import requests

          # --------------------------
          # Helpers
          # --------------------------
          def safe_json_load(env_name: str) -> dict:
              raw = os.environ.get(env_name, "")
              if not raw or not raw.strip():
                  return {}
              try:
                  return json.loads(raw)
              except Exception as e:
                  raise RuntimeError(f"{env_name} is not valid JSON: {e}")

          def b64_basic(user: str, pwd: str) -> str:
              token = base64.b64encode(f"{user}:{pwd}".encode("utf-8")).decode("ascii")
              return f"Basic {token}"

          def now_utc_dt() -> datetime:
              return datetime.now(timezone.utc)

          # Google Sheets serial number:
          # days since 1899-12-30, fraction is time of day
          SHEETS_EPOCH = datetime(1899, 12, 30, tzinfo=timezone.utc)

          def to_sheets_serial(dt: datetime) -> float:
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              delta = dt - SHEETS_EPOCH
              return delta.total_seconds() / 86400.0

          def sheets_get_value(token: str, spreadsheet_id: str, a1: str):
              url = f"https://sheets.googleapis.com/v4/spreadsheets/{spreadsheet_id}/values/{a1}"
              r = requests.get(url, headers={"Authorization": f"Bearer {token}"}, timeout=30)
              if r.status_code != 200:
                  return None
              j = r.json()
              vals = j.get("values", [])
              if not vals or not vals[0]:
                  return None
              return vals[0][0]

          def dump_json(path: str, obj):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(",", ":"), sort_keys=True)

          # --------------------------
          # Load inputs
          # --------------------------
          clients = safe_json_load("EOU_CLIENTS")
          refresh_map = safe_json_load("EOU_REFRESH_TOKENS")

          access_1 = safe_json_load("EOU_ACCESS_TOKENS_1")
          access_2 = safe_json_load("EOU_ACCESS_TOKENS_2")

          # Validate required structure
          for app, cfg in clients.items():
              if "client_id" not in cfg or "client_secret" not in cfg or "access_tokens_secret" not in cfg:
                  raise RuntimeError(
                      f"EOU_CLIENTS entry '{app}' must include client_id, client_secret, access_tokens_secret"
                  )

          sso_url = os.environ["SSO_TOKEN_URL"]

          # --------------------------
          # Build items and sort by character_id DESC for the sheet
          # --------------------------
          items = []
          for char_id, info in refresh_map.items():
              items.append((int(char_id), info))
          items.sort(key=lambda x: x[0], reverse=True)  # DESC

          ok = 0
          fail = 0

          rotated_any = False
          refresh_time_serial_by_char = {}  # char_id -> serial number (only if rotated)

          # We'll write sheet updates only for successful refreshes
          access_sheet_updates = []

          for idx, (char_id_int, info) in enumerate(items):
              char_id = str(char_id_int)

              account = info.get("account", "")
              char_name = info.get("char_name", "")
              app = info.get("app")
              rt_old = info.get("refresh_token")

              cfg = clients.get(app)
              if not cfg or not rt_old:
                  fail += 1
                  continue

              client_id = cfg["client_id"]
              client_secret = cfg["client_secret"]
              target_secret = cfg["access_tokens_secret"]

              headers = {
                  "Authorization": b64_basic(client_id, client_secret),
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
                  "User-Agent": "eou-refresh-access-tokens/1.0",
              }
              data = {
                  "grant_type": "refresh_token",
                  "refresh_token": rt_old,
              }

              try:
                  r = requests.post(sso_url, headers=headers, data=data, timeout=30)
              except Exception:
                  fail += 1
                  continue

              if r.status_code != 200:
                  fail += 1
                  continue

              try:
                  payload = r.json()
              except Exception:
                  fail += 1
                  continue

              access_token = payload.get("access_token")
              if not access_token:
                  fail += 1
                  continue

              # refresh token rotation
              rt_new = payload.get("refresh_token")
              refresh_serial = ""
              if rt_new and rt_new != rt_old:
                  refresh_map[char_id]["refresh_token"] = rt_new
                  rotated_any = True
                  refresh_serial = to_sheets_serial(now_utc_dt())
                  refresh_time_serial_by_char[char_id] = refresh_serial

              # store access token into correct secret
              if target_secret == "EOU_ACCESS_TOKENS_1":
                  access_1[char_id] = access_token
              elif target_secret == "EOU_ACCESS_TOKENS_2":
                  access_2[char_id] = access_token
              else:
                  fail += 1
                  continue

              token_time_str = now_utc_dt().strftime("%Y-%m-%d %H:%M:%S")

              # Sheet row mapping: header row 1, data from row 2
              row = 2 + idx

              access_sheet_updates.append({
                  "range": f"{os.environ['ACCESS_TOKENS_TAB']}!A{row}:F{row}",
                  "values": [[
                      account,
                      char_name,
                      char_id,
                      access_token,
                      token_time_str,
                      refresh_serial  # NUMERIC serial if rotated else ""
                  ]],
              })

              ok += 1

          # --------------------------
          # Workflows tab update (row SHEETS_WORKFLOW_ROW)
          # Logic:
          #  - status = completed => next_run = now + COOLDOWN
          #  - status = fail      => next_run unchanged
          # --------------------------
          token = os.environ.get("GOOGLE_SHEETS_TOKEN", "")
          sheets_id = os.environ["SHEETS_ID"]
          workflows_tab = os.environ["WORKFLOWS_TAB"]
          wf_row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          cooldown_s = int(os.environ.get("COOLDOWN", "900"))

          status = "completed" if fail == 0 else "fail"

          old_next_run = None
          if status == "fail":
              # read existing D{row} so we don't change it
              if token:
                  old_next_run = sheets_get_value(token, sheets_id, f"{workflows_tab}!D{wf_row}")

          if status == "completed":
              next_run_serial = to_sheets_serial(now_utc_dt() + timedelta(seconds=cooldown_s))
          else:
              # keep old value if present; else keep blank
              try:
                  next_run_serial = float(old_next_run) if old_next_run is not None and str(old_next_run).strip() else ""
              except Exception:
                  next_run_serial = ""

          workflow_updates = [
              {"range": f"{workflows_tab}!B{wf_row}:B{wf_row}", "values": [[status]]},
              {"range": f"{workflows_tab}!D{wf_row}:D{wf_row}", "values": [[next_run_serial]]},
          ]

          # --------------------------
          # Write files
          # --------------------------
          dump_json("access_tokens_1.json", access_1)
          dump_json("access_tokens_2.json", access_2)
          dump_json("refresh_tokens_new.json", refresh_map)

          # Combined Sheets payload for BOTH tabs
          with open("sheets_batch_payload.json", "w", encoding="utf-8") as f:
              json.dump({
                  "valueInputOption": "RAW",
                  "data": workflow_updates + access_sheet_updates,
                  "includeValuesInResponse": False
              }, f, ensure_ascii=False)

          # Size check for GH secrets
          max_bytes = int(os.environ.get("SECRET_MAX_BYTES", "49152"))

          def file_size(p):
              import os
              return os.path.getsize(p)

          sz1 = file_size("access_tokens_1.json")
          sz2 = file_size("access_tokens_2.json")

          if sz1 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_1 size {sz1} bytes exceeds limit {max_bytes}. Reduce accounts in secret 1.")
          if sz2 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_2 size {sz2} bytes exceeds limit {max_bytes}. Reduce accounts in secret 2.")

          # Flag for later steps
          with open("flags.env", "w", encoding="utf-8") as f:
              f.write(f"ROTATED_ANY={'true' if rotated_any else 'false'}\n")

          print(f"Refreshed OK: {ok}, Failed: {fail}, Rotated refresh_token: {rotated_any}")
          print(f"EOU_ACCESS_TOKENS_1 bytes: {sz1}, EOU_ACCESS_TOKENS_2 bytes: {sz2}")
          PY

      - name: Load flags
        run: |
          set -euo pipefail
          cat flags.env >> "$GITHUB_ENV"

      - name: Update access token secrets (split)
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_SECRETS_ADMIN_TOKEN is empty."
            exit 1
          fi
          gh secret set EOU_ACCESS_TOKENS_1 --repo "${GITHUB_REPOSITORY}" < access_tokens_1.json
          gh secret set EOU_ACCESS_TOKENS_2 --repo "${GITHUB_REPOSITORY}" < access_tokens_2.json

      - name: Update refresh tokens secret (only if rotated)
        if: env.ROTATED_ANY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set "${REFRESH_TOKENS_SECRET_NAME}" --repo "${GITHUB_REPOSITORY}" < refresh_tokens_new.json

      - name: Write Google Sheet (single batch update request)
        env:
          ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_batch_payload.json \
            >/dev/null

      - name: Done
        run: echo "Refresh completed."
