name: Refresh Access Tokens (SSO → GHs + GS)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: eou_refresh_access_tokens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # ------------------------------------------------------------------------
      # Identidad del workflow
      # ------------------------------------------------------------------------
      WORKFLOW_FILE: "eou_refresh_access_tokens.yml"

      # ------------------------------------------------------------------------
      # Google Sheets (estado compartido)
      # ------------------------------------------------------------------------
      SHEETS_ID: "1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8"
      SHEET_TAB_WORKFLOWS: "workflows"
      SHEET_TAB_ACCESS_TOKENS: "access_tokens"
      SHEETS_WORKFLOW_ROW: "3"

      # ------------------------------------------------------------------------
      # Control de planificación (solo para sheet/monitor; el disparador externo manda)
      # ------------------------------------------------------------------------
      LOCK_TIME: "60"
      COOLDOWN: "900"

      # ------------------------------------------------------------------------
      # SSO (refresh)
      # ------------------------------------------------------------------------
      SSO_TOKEN_URL: "https://login.eveonline.com/v2/oauth/token"

      # ------------------------------------------------------------------------
      # Secrets
      # ------------------------------------------------------------------------
      REFRESH_TOKENS_SECRET_NAME: "EOU_REFRESH_TOKENS"

      # GitHub secret hard limit is 48 KB. Keep a small margin.
      SECRET_MAX_BYTES: "49152"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sheets: mint access token with proper scope
      - name: Auth to Google (WIF) for Sheets
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/spreadsheets"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      # GUARD: only skip if there is ANOTHER run currently in progress.
      - name: Guard - skip only if another run is in progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner_repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/${owner_repo}/actions/workflows/${WORKFLOW_FILE}/runs?status=in_progress&per_page=10"
          runs_json="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "${api}")"

          others_count="$(python - <<'PY' <<<"${runs_json}"
          import json, os, sys
          runs = json.load(sys.stdin)
          me = int(os.environ["GITHUB_RUN_ID"])
          wfruns = runs.get("workflow_runs", [])
          other = [r for r in wfruns if int(r.get("id", -1)) != me]
          print(len(other))
          PY
          )"

          if [ "${others_count}" -gt 0 ]; then
            echo "Skipped: another run is in progress (anti-overlap)."
            exit 0
          fi

      # Mark workflow as running (status only; do NOT touch next_run)
      - name: Sheets - mark workflow running
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os
          tab = os.environ["SHEET_TAB_WORKFLOWS"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          payload = {
            "valueInputOption": "RAW",
            "data": [
              {"range": f"{tab}!B{row}:B{row}", "values": [["running"]]},
            ],
            "includeValuesInResponse": False
          }
          with open("sheets_workflows_running.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False)
          PY

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_workflows_running.json \
            >/dev/null

      # Refresh tokens, build:
      # - access_tokens_1.json, access_tokens_2.json (char_id -> access_token)
      # - refresh_tokens_new.json (updated only if rotation happened)
      # - sheets_access_tokens_payload.json (single request payload)
      - name: Refresh access tokens + prepare updates
        env:
          EOU_CLIENTS: ${{ secrets.EOU_CLIENTS }}
          EOU_REFRESH_TOKENS: ${{ secrets.EOU_REFRESH_TOKENS }}
          EOU_ACCESS_TOKENS_1: ${{ secrets.EOU_ACCESS_TOKENS_1 }}
          EOU_ACCESS_TOKENS_2: ${{ secrets.EOU_ACCESS_TOKENS_2 }}
          SECRET_MAX_BYTES: ${{ env.SECRET_MAX_BYTES }}
          SSO_TOKEN_URL: ${{ env.SSO_TOKEN_URL }}
          ACCESS_TOKENS_TAB: ${{ env.SHEET_TAB_ACCESS_TOKENS }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          from datetime import datetime, timezone, timedelta
          import requests

          def utc_now():
              return datetime.now(timezone.utc)

          def utc_ts_str():
              return utc_now().strftime("%Y-%m-%d %H:%M:%S")

          # Google Sheets serial date number: days since 1899-12-30
          def gs_serial(dt: datetime) -> float:
              base = datetime(1899, 12, 30, tzinfo=timezone.utc)
              return (dt - base).total_seconds() / 86400.0

          def b64_basic(user: str, pwd: str) -> str:
              token = base64.b64encode(f"{user}:{pwd}".encode("utf-8")).decode("ascii")
              return f"Basic {token}"

          def safe_json_load(env_name: str) -> dict:
              raw = os.environ.get(env_name, "")
              if not raw.strip():
                  return {}
              try:
                  return json.loads(raw)
              except Exception as e:
                  raise RuntimeError(f"{env_name} is not valid JSON: {e}")

          clients = safe_json_load("EOU_CLIENTS")
          refresh_map = safe_json_load("EOU_REFRESH_TOKENS")

          access_1 = safe_json_load("EOU_ACCESS_TOKENS_1")
          access_2 = safe_json_load("EOU_ACCESS_TOKENS_2")

          for app, cfg in clients.items():
              if "client_id" not in cfg or "client_secret" not in cfg or "access_tokens_secret" not in cfg:
                  raise RuntimeError(f"EOU_CLIENTS entry '{app}' must include client_id, client_secret, access_tokens_secret")

          sso_url = os.environ["SSO_TOKEN_URL"]
          max_bytes = int(os.environ.get("SECRET_MAX_BYTES", "49152"))

          rotated_any = False
          refresh_time_serial_by_char = {}  # char_id -> serial date (number)

          ok = 0
          fail = 0

          # We want the sheet paste order to be: character_id DESC (mayor -> menor).
          # This will define row mapping deterministically:
          # header row is 1, data starts at row 2.
          items = []
          for char_id, info in refresh_map.items():
              items.append((int(char_id), info))
          items.sort(key=lambda x: x[0], reverse=True)

          sheet_updates = []

          for idx, (char_id_int, info) in enumerate(items, start=0):
              char_id = str(char_id_int)
              app = info.get("app")
              rt_old = info.get("refresh_token")
              account = info.get("account", "")
              char_name = info.get("char_name", "")

              cfg = clients.get(app, None)
              if not cfg or not rt_old:
                  fail += 1
                  continue

              client_id = cfg["client_id"]
              client_secret = cfg["client_secret"]
              target_secret = cfg["access_tokens_secret"]

              headers = {
                  "Authorization": b64_basic(client_id, client_secret),
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json",
                  "User-Agent": "eou-refresh-access-tokens/1.0",
              }
              data = {
                  "grant_type": "refresh_token",
                  "refresh_token": rt_old,
              }

              try:
                  r = requests.post(sso_url, headers=headers, data=data, timeout=30)
              except Exception:
                  fail += 1
                  continue

              if r.status_code != 200:
                  fail += 1
                  continue

              try:
                  payload = r.json()
              except Exception:
                  fail += 1
                  continue

              access_token = payload.get("access_token")
              if not access_token:
                  fail += 1
                  continue

              # Refresh token rotation (if present and changed)
              rt_new = payload.get("refresh_token")
              if rt_new and rt_new != rt_old:
                  refresh_map[char_id]["refresh_token"] = rt_new
                  rotated_any = True
                  refresh_time_serial_by_char[char_id] = gs_serial(utc_now())

              # Store access token into the correct secret map
              if target_secret == "EOU_ACCESS_TOKENS_1":
                  access_1[char_id] = access_token
              elif target_secret == "EOU_ACCESS_TOKENS_2":
                  access_2[char_id] = access_token
              else:
                  fail += 1
                  continue

              token_time_str = utc_ts_str()
              refresh_time_serial = refresh_time_serial_by_char.get(char_id, "")

              # Row mapping: idx 0 => row 2, idx 1 => row 3, ...
              row = 2 + idx

              # Columns:
              # A account (string)
              # B character (string)
              # C character_id (number/string ok; we write as string to preserve big ids)
              # D access_token (string)
              # E token_time (string)
              # F refresh_time (NUMBER serial or blank)
              sheet_updates.append({
                  "range": f"{os.environ['ACCESS_TOKENS_TAB']}!A{row}:F{row}",
                  "values": [[account, char_name, char_id, access_token, token_time_str, refresh_time_serial]],
              })

              ok += 1

          def dump_json(path: str, obj: dict):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, separators=(",", ":"), sort_keys=True)

          dump_json("access_tokens_1.json", access_1)
          dump_json("access_tokens_2.json", access_2)
          dump_json("refresh_tokens_new.json", refresh_map)

          with open("sheets_access_tokens_payload.json", "w", encoding="utf-8") as f:
              json.dump({
                  "valueInputOption": "RAW",
                  "data": sheet_updates,
                  "includeValuesInResponse": False
              }, f, ensure_ascii=False)

          import os as _os
          sz1 = _os.path.getsize("access_tokens_1.json")
          sz2 = _os.path.getsize("access_tokens_2.json")
          if sz1 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_1 size {sz1} bytes exceeds limit {max_bytes}. Reduce accounts in secret 1.")
          if sz2 > max_bytes:
              raise RuntimeError(f"EOU_ACCESS_TOKENS_2 size {sz2} bytes exceeds limit {max_bytes}. Reduce accounts in secret 2.")

          print(f"Refreshed OK: {ok}, Failed: {fail}, Rotated refresh_token: {rotated_any}")
          print(f"EOU_ACCESS_TOKENS_1 bytes: {sz1}, EOU_ACCESS_TOKENS_2 bytes: {sz2}")

          with open("flags.env", "w", encoding="utf-8") as f:
              f.write(f"ROTATED_ANY={'true' if rotated_any else 'false'}\n")
          PY

      - name: Load flags
        run: |
          set -euo pipefail
          cat flags.env >> "$GITHUB_ENV"

      - name: Auth gh CLI (PAT for secrets)
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_SECRETS_ADMIN_TOKEN is empty."
            exit 1
          fi
          echo "${GH_TOKEN}" | gh auth login --with-token >/dev/null 2>&1 || true
          gh auth status >/dev/null 2>&1

      - name: Update access token secrets (split)
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set EOU_ACCESS_TOKENS_1 --repo "${GITHUB_REPOSITORY}" < access_tokens_1.json
          gh secret set EOU_ACCESS_TOKENS_2 --repo "${GITHUB_REPOSITORY}" < access_tokens_2.json

      - name: Update refresh tokens secret (only if rotated)
        if: env.ROTATED_ANY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set "${REFRESH_TOKENS_SECRET_NAME}" --repo "${GITHUB_REPOSITORY}" < refresh_tokens_new.json

      - name: Write Google Sheet - access_tokens (batchUpdate)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_access_tokens_payload.json \
            >/dev/null

      # If success => status=completed and next_run=now+COOLDOWN (NUMERIC serial)
      - name: Sheets - mark workflow completed + next_run
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta

          def gs_serial(dt):
              base = datetime(1899, 12, 30, tzinfo=timezone.utc)
              return (dt - base).total_seconds() / 86400.0

          tab = os.environ["SHEET_TAB_WORKFLOWS"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          cooldown = int(os.environ["COOLDOWN"])

          now = datetime.now(timezone.utc)
          next_run = now + timedelta(seconds=cooldown)
          next_run_serial = gs_serial(next_run)

          payload = {
            "valueInputOption": "RAW",
            "data": [
              {"range": f"{tab}!B{row}:B{row}", "values": [["completed"]]},
              {"range": f"{tab}!D{row}:D{row}", "values": [[next_run_serial]]},
            ],
            "includeValuesInResponse": False
          }

          with open("sheets_workflows_completed.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_workflows_completed.json \
            >/dev/null

      # If failure => status=fail only (do NOT touch next_run)
      - name: Sheets - mark workflow fail (keep next_run)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os
          tab = os.environ["SHEET_TAB_WORKFLOWS"]
          row = int(os.environ["SHEETS_WORKFLOW_ROW"])
          payload = {
            "valueInputOption": "RAW",
            "data": [
              {"range": f"{tab}!B{row}:B{row}", "values": [["fail"]]},
            ],
            "includeValuesInResponse": False
          }
          with open("sheets_workflows_failed.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -sS -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            --data-binary @sheets_workflows_failed.json \
            >/dev/null

      - name: Done
        run: echo "Refresh completed."
