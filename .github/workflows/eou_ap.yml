name: EOU Autopilot Routes (SDE → eou_ap_list)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eou_ap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate eou_ap_list.txt
        run: |
          python -u eou_ap/eou_ap_generate.py

      - name: Commit changes (single commit)
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eou_ap/eou_ap_list.txt
          git commit -m "EOU AP: generate eou_ap_list.txt"
          git push
