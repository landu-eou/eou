name: ESI System Kills (ESI → GH → BQ)

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: eou_kills_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: eou_kills_esi-gh-bq
      WORKFLOW_NAME: "ESI System Kills (ESI -> GH -> BQ)"
      SHEET_ROW: "5"
      EXPIRES: "86400"
      LOCK_SECONDS: "60"

      ESI_URL: "https://esi.evetech.net/latest/universe/system_kills/?datasource=tranquility"
      STATE_PATH: "data/esi_gh_bq/eou_kills_esi-gh-bq.json"
      SDE_MAP_PATH: "data/gh_sde/gh_sde_ss.jsonl.gz"

      BQ_DATASET: "eou"
      BQ_TABLE: "system_kills"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight (gateway)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          EXPIRES_START="${LOCK_SECONDS}"
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES_START}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          WF_NAME_ESC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES_START}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on START: $RESP"
            exit 1
          fi
          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Objective (ESI -> transform -> BQ -> state)
        id: objective
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          echo "NEXT_RUN_EPOCH=$(( $(date -u +%s) + 600 ))" >> "$GITHUB_ENV"
          echo "WILL_COMMIT_STATE=false" >> "$GITHUB_ENV"

          ETAG=""
          LAST_MOD=""
          if [[ -f "$STATE_PATH" ]]; then
            ETAG="$(jq -r '.lastCommitted.etag // empty' "$STATE_PATH" || true)"
            LAST_MOD="$(jq -r '.lastCommitted.lastModifiedRfc1123 // empty' "$STATE_PATH" || true)"
          fi

          rm -f headers.txt body.json
          CURL_HEADERS=(-H "Accept: application/json" -H "User-Agent: landu-eou/eou (GitHub Actions)")
          if [[ -n "$ETAG" && "$ETAG" != "null" ]]; then
            CURL_HEADERS+=(-H "If-None-Match: $ETAG")
          fi
          if [[ -n "$LAST_MOD" && "$LAST_MOD" != "null" ]]; then
            CURL_HEADERS+=(-H "If-Modified-Since: $LAST_MOD")
          fi

          HTTP_CODE="$(curl -sS --compressed -D headers.txt -o body.json -w "%{http_code}" "${CURL_HEADERS[@]}" "$ESI_URL" || true)"
          echo "HTTP_CODE=$HTTP_CODE"

          python3 - <<'PY'
          import os, json, time, urllib.request
          from email.utils import parsedate_to_datetime

          def parse_headers(path):
            headers={}
            with open(path,'r',encoding='utf-8',errors='ignore') as f:
              for line in f:
                line=line.strip('\r\n')
                if not line or line.lower().startswith('http/'):
                  continue
                if ':' in line:
                  k,v=line.split(':',1)
                  headers[k.strip()]=v.strip()
            return headers

          def hget(headers, key):
            for k,v in headers.items():
              if k.lower()==key.lower():
                return v.strip()
            return ""

          def now_epoch():
            return int(time.time())

          http_code=os.environ.get("HTTP_CODE","")
          state_path=os.environ["STATE_PATH"]
          expires_fallback=int(os.environ.get("EXPIRES","86400"))

          headers=parse_headers("headers.txt") if os.path.exists("headers.txt") else {}
          etag=hget(headers,"ETag")
          last_mod=hget(headers,"Last-Modified")
          expires=hget(headers,"Expires")
          retry_after=hget(headers,"Retry-After")
          err_reset=hget(headers,"X-ESI-Error-Limit-Reset")
          err_limited=hget(headers,"X-ESI-Error-Limited")

          # Error-limited (420 / header) :contentReference[oaicite:7]{index=7}
          if http_code == "420" or (err_limited and err_limited.lower()=="true"):
            wait=600
            for v in (retry_after, err_reset):
              try:
                if v: wait=max(wait,int(float(v)))
              except Exception:
                pass
            with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"NEXT_RUN_EPOCH={now_epoch()+wait}\n")
              f.write("WILL_COMMIT_STATE=false\n")
            raise SystemExit(0)

          if http_code == "304":
            with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"NEXT_RUN_EPOCH={now_epoch()+600}\n")
              f.write("WILL_COMMIT_STATE=false\n")
            raise SystemExit(0)

          if http_code != "200" or not last_mod:
            with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"NEXT_RUN_EPOCH={now_epoch()+600}\n")
              f.write("WILL_COMMIT_STATE=false\n")
            raise SystemExit(0)

          # (ETag, Last-Modified) igual al estado => no cambios :contentReference[oaicite:8]{index=8}
          if os.path.exists(state_path):
            try:
              st=json.load(open(state_path,'r',encoding='utf-8'))
              lc=st.get("lastCommitted") or {}
              if lc.get("etag")==etag and lc.get("lastModifiedRfc1123")==last_mod:
                with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write(f"NEXT_RUN_EPOCH={now_epoch()+600}\n")
                  f.write("WILL_COMMIT_STATE=false\n")
                raise SystemExit(0)
            except Exception:
              pass

          ts_iso=parsedate_to_datetime(last_mod).astimezone().isoformat().replace("+00:00","Z")
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"TS_ISO={ts_iso}\n")
            f.write(f"ETAG_NEW={etag}\n")
            f.write(f"LAST_MOD_RFC1123={last_mod}\n")
            f.write(f"EXPIRES_RFC1123={expires}\n")
          PY

          FULL_TABLE="${GCP_PROJECT_ID}:${BQ_DATASET}.${BQ_TABLE}"
          if ! bq show --format=prettyjson "$FULL_TABLE" >/dev/null 2>&1; then
            echo "Table missing, creating: $FULL_TABLE"
            bq mk --table \
              --time_partitioning_type=DAY \
              --time_partitioning_field=ts \
              "$FULL_TABLE" \
              ts:TIMESTAMP,solarSystem:STRING,npc_kills:INTEGER,pod_kills:INTEGER,ship_kills:INTEGER
          fi

          TS_ISO="${TS_ISO:-}"
          if [[ -z "$TS_ISO" ]]; then
            echo "Missing TS_ISO; backoff."
            echo "NEXT_RUN_EPOCH=$(( $(date -u +%s) + 600 ))" >> "$GITHUB_ENV"
            exit 0
          fi

          COUNT="$(bq query --use_legacy_sql=false --format=csv \
            --parameter=ts:TIMESTAMP:"$TS_ISO" \
            "SELECT COUNT(1) c FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\` WHERE ts=@ts" | tail -n 1 | tr -d '\r')"

          if [[ "${COUNT:-0}" != "0" ]]; then
            echo "ts already ingested in BQ => treat as fulfilled; will commit state."
            python3 - <<'PY'
            import os, json, time
            from email.utils import parsedate_to_datetime

            state_path=os.environ["STATE_PATH"]
            committed=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

            etag=os.environ.get("ETAG_NEW","")
            lm=os.environ.get("LAST_MOD_RFC1123","")
            exp=os.environ.get("EXPIRES_RFC1123","")

            doc={
              "schemaVersion": 1,
              "workflowId": os.environ["WORKFLOW_ID"],
              "endpoint": os.environ["ESI_URL"],
              "bq": {"dataset": os.environ["BQ_DATASET"], "table": os.environ["BQ_TABLE"]},
              "lastCommitted": {
                "etag": etag,
                "lastModifiedRfc1123": lm,
                "expiresRfc1123": exp,
                "committedAtUtc": committed
              }
            }
            os.makedirs(os.path.dirname(state_path), exist_ok=True)
            with open(state_path,"w",encoding="utf-8") as f:
              json.dump(doc,f,ensure_ascii=False,indent=2); f.write("\n")

            next_run=int(time.time()) + int(os.environ.get("EXPIRES","86400")) + 60
            if exp:
              try: next_run=int(parsedate_to_datetime(exp).timestamp()) + 60
              except Exception: pass

            with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"NEXT_RUN_EPOCH={next_run}\n")
              f.write("WILL_COMMIT_STATE=true\n")
            PY
            exit 0
          fi

          python3 - <<'PY'
          import os, json, gzip, time, urllib.request
          from email.utils import parsedate_to_datetime

          state_path=os.environ["STATE_PATH"]
          sde_map_path=os.environ["SDE_MAP_PATH"]
          ts_iso=os.environ["TS_ISO"]
          etag=os.environ.get("ETAG_NEW","")
          lm=os.environ.get("LAST_MOD_RFC1123","")
          exp=os.environ.get("EXPIRES_RFC1123","")
          expires_fallback=int(os.environ.get("EXPIRES","86400"))

          with open("body.json","r",encoding="utf-8") as f:
            data=json.load(f)

          mapping={}
          with gzip.open(sde_map_path,"rt",encoding="utf-8") as f:
            for line in f:
              o=json.loads(line)
              mapping[int(o["solarSystemId"])]=o["solarSystem"]

          missing=[int(x["system_id"]) for x in data if int(x["system_id"]) not in mapping]
          if missing:
            def chunks(lst,n):
              for i in range(0,len(lst),n):
                yield lst[i:i+n]
            for ch in chunks(missing, 500):
              req=urllib.request.Request(
                "https://esi.evetech.net/latest/universe/names/?datasource=tranquility",
                data=json.dumps(ch).encode("utf-8"),
                headers={
                  "Content-Type":"application/json",
                  "Accept":"application/json",
                  "User-Agent":"landu-eou/eou (GitHub Actions)"
                },
                method="POST"
              )
              try:
                with urllib.request.urlopen(req, timeout=20) as resp:
                  arr=json.loads(resp.read().decode("utf-8"))
                  for it in arr:
                    if it.get("category") == "solar_system" and "id" in it and "name" in it:
                      mapping[int(it["id"])]=it["name"]
              except Exception:
                pass

          out=[]
          for row in data:
            sid=int(row["system_id"])
            out.append({
              "ts": ts_iso,
              "solarSystem": mapping.get(sid, str(sid)),
              "npc_kills": int(row.get("npc_kills",0)),
              "pod_kills": int(row.get("pod_kills",0)),
              "ship_kills": int(row.get("ship_kills",0))
            })

          with open("out.ndjson","w",encoding="utf-8") as f:
            for o in out:
              f.write(json.dumps(o, ensure_ascii=False) + "\n")

          committed=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          doc={
            "schemaVersion": 1,
            "workflowId": os.environ["WORKFLOW_ID"],
            "endpoint": os.environ["ESI_URL"],
            "bq": {"dataset": os.environ["BQ_DATASET"], "table": os.environ["BQ_TABLE"]},
            "lastCommitted": {
              "etag": etag,
              "lastModifiedRfc1123": lm,
              "expiresRfc1123": exp,
              "committedAtUtc": committed
            }
          }
          os.makedirs(os.path.dirname(state_path), exist_ok=True)
          with open(state_path,"w",encoding="utf-8") as f:
            json.dump(doc,f,ensure_ascii=False,indent=2); f.write("\n")

          next_run=int(time.time()) + expires_fallback + 60
          if exp:
            try: next_run=int(parsedate_to_datetime(exp).timestamp()) + 60
            except Exception: pass

          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"NEXT_RUN_EPOCH={next_run}\n")
            f.write("WILL_COMMIT_STATE=true\n")
          PY

          bq load --quiet \
            --source_format=NEWLINE_DELIMITED_JSON \
            "${GCP_PROJECT_ID}:${BQ_DATASET}.${BQ_TABLE}" \
            out.ndjson

      - name: Commit state JSON (pull --rebase + retry)
        if: env.WILL_COMMIT_STATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$STATE_PATH"; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$STATE_PATH"
          git commit -m "state(${WORKFLOW_ID}): commit Last-Modified/ETag" || exit 0

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || (git rebase --abort && true)
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed, retry $i..."
            sleep $((i*2))
          done

          echo "Push failed after retries."
          exit 1

      - name: FINISH
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          NOW_S="$(date -u +%s)"
          NEXT_RUN="${NEXT_RUN_EPOCH:-$((NOW_S+600))}"
          EXPIRES_TO_SEND="$(( NEXT_RUN - NOW_S ))"
          if (( EXPIRES_TO_SEND < 0 )); then EXPIRES_TO_SEND=0; fi

          NOW_MS="$(date -u +%s%3N)"
          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES_TO_SEND}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
          WF_NAME_ESC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES_TO_SEND}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null
          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on FINISH: $RESP"
            exit 1
          fi
