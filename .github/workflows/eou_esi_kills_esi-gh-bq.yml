# .github/workflows/eou_esi_kills_esi-gh-bq.yml

name: ESI System Kills (ESI → GH → BQ)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: eou_esi_kills_esi-gh-bq
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Guard (anti-cola)
      WORKFLOW_FILE: eou_esi_kills_esi-gh-bq.yml
      GH_API: https://api.github.com

      # Sheets (tabla de control)
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "6"
      LOCK_TIME: "120" # segundos

      # ESI + estado local
      ESI_URL: https://esi.evetech.net/universe/system_kills
      STATE_PATH: states/system_kills.json
      SDE_SOLARSYSTEMS_GZ: data/sde/solarsystems.jsonl.gz

      # BigQuery
      BQ_DATASET: eou
      BQ_TABLE: system_kills

    steps:
      # ============================================================
      # 0) GUARD (anti-cola / anti-duplicados)
      # ============================================================
      - name: Guard - decide proceed (anti-cola)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          run_id="${GITHUB_RUN_ID}"
          auth_hdr="Authorization: Bearer ${GH_TOKEN}"
          acc_hdr="Accept: application/vnd.github+json"

          wf_id="$(
            curl -sS -H "${auth_hdr}" -H "${acc_hdr}" \
              "${GH_API}/repos/${repo}/actions/workflows/${WORKFLOW_FILE}" \
            | jq -r '.id'
          )"
          if [[ -z "${wf_id}" || "${wf_id}" == "null" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          self_created="$(
            curl -sS -H "${auth_hdr}" -H "${acc_hdr}" \
              "${GH_API}/repos/${repo}/actions/runs/${run_id}" \
            | jq -r '.created_at'
          )"
          if [[ -z "${self_created}" || "${self_created}" == "null" ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          runs_json="$(
            curl -sS -H "${auth_hdr}" -H "${acc_hdr}" \
              "${GH_API}/repos/${repo}/actions/workflows/${wf_id}/runs?per_page=50"
          )"

          other_inprog="$(
            echo "${runs_json}" | jq -r --arg rid "${run_id}" '
              [.workflow_runs[] | select(.status=="in_progress" and (.id|tostring)!=$rid)] | length
            '
          )"

          stale_by_success="$(
            echo "${runs_json}" | jq -r --arg created "${self_created}" --arg rid "${run_id}" '
              [
                .workflow_runs[]
                | select((.id|tostring)!=$rid)
                | select(.status=="completed" and .conclusion=="success")
                | select(.created_at < $created and (.updated_at // "") > $created)
              ] | length
            '
          )"

          if [[ "${other_inprog}" -gt 0 || "${stale_by_success}" -gt 0 ]]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Guard - exit early (no work)
        if: ${{ steps.guard.outputs.proceed != 'true' }}
        run: echo "Queued/duplicate dispatch detected. Exiting without work."

      # ============================================================
      # 1) BOOTSTRAP (serials de Sheets)
      # ============================================================
      - name: Bootstrap - compute epoch and Sheets serials
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: boot
        shell: bash
        run: |
          set -euo pipefail
          to_serial(){ awk -v s="$1" 'BEGIN{printf "%.10f", (s/86400.0)+25569.0}'; }

          run_start_epoch="$(date -u +%s)"
          echo "RUN_START_EPOCH=${run_start_epoch}" >> "${GITHUB_ENV}"

          echo "lock_serial=$(to_serial "$((run_start_epoch + LOCK_TIME))")" >> "${GITHUB_OUTPUT}"
          echo "fail_plus5_serial=$(to_serial "$((run_start_epoch + 300))")" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 2) BOOTSTRAP runtime (repo + auth + gcloud/bq)
      # ============================================================
      - name: Checkout
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auth to Google (WIF)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/cloud-platform

      # --- NUEVO: warm-up OIDC token con retries (mitiga #790–#793) ---
      - name: OIDC warm-up (retry subject token)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # GitHub documenta estas variables para solicitar el JWT OIDC. :contentReference[oaicite:3]{index=3}
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "Missing ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN (check id-token: write permission)."
            exit 1
          fi

          # Reintentos con backoff por fallos transitorios (conectividad/proxy).
          # Esto reduce las probabilidades de que gcloud falle al refrescar el subject token.
          attempts=6
          delay=2

          for i in $(seq 1 "${attempts}"); do
            echo "OIDC warm-up attempt ${i}/${attempts} ..."
            set +e
            resp="$(
              curl -sS -m 15 \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=googleapis.com" \
                -w "\nHTTP_STATUS:%{http_code}\n"
            )"
            rc=$?
            set -e

            http="$(echo "${resp}" | awk -F: '/^HTTP_STATUS:/ {print $2}' | tr -d '\r' | tail -n 1)"
            token="$(echo "${resp}" | sed '/^HTTP_STATUS:/,$d' | jq -r '.value // empty' 2>/dev/null || true)"

            if [[ "${rc}" -eq 0 && "${http}" == "200" && -n "${token}" ]]; then
              echo "OIDC warm-up OK (received JWT)."
              exit 0
            fi

            echo "OIDC warm-up failed (rc=${rc}, http=${http:-unknown})."
            # Si hay JSON de error, imprímelo (sin exponer secretos; GitHub enmascara tokens).
            echo "${resp}" | sed '/^HTTP_STATUS:/,$d' | head -c 800 || true

            if [[ "${i}" -lt "${attempts}" ]]; then
              echo "Sleeping ${delay}s before retry..."
              sleep "${delay}"
              delay="$((delay * 2))"
              [[ "${delay}" -gt 30 ]] && delay=30
            fi
          done

          echo "OIDC warm-up failed after ${attempts} attempts."
          exit 1

      # --- NUEVO: setup-gcloud con reintentos (mitiga #790–#793) ---
      - name: Setup gcloud (attempt 1)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: gcloud1
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup gcloud (attempt 2)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.gcloud1.outcome == 'failure' }}
        id: gcloud2
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "setup-gcloud attempt 1 failed; backoff 8s and retrying..."
          sleep 8
        # Re-ejecutamos la action en un step separado
      - name: Setup gcloud (attempt 2 - action)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.gcloud1.outcome == 'failure' }}
        id: gcloud2a
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup gcloud (attempt 3)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.gcloud1.outcome == 'failure' && steps.gcloud2a.outcome == 'failure' }}
        id: gcloud3
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "setup-gcloud attempt 2 failed; backoff 16s and retrying..."
          sleep 16
      - name: Setup gcloud (attempt 3 - action)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.gcloud1.outcome == 'failure' && steps.gcloud2a.outcome == 'failure' }}
        id: gcloud3a
        continue-on-error: false
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ============================================================
      # 3) ESI headers + snapshot
      # ============================================================
      - name: Read state + fetch ESI headers (ETag/Expires/Last-Modified)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: esi
        shell: bash
        run: |
          set -euo pipefail
          to_serial(){ awk -v s="$1" 'BEGIN{printf "%.10f", (s/86400.0)+25569.0}'; }

          state_exists="false"
          [[ -f "${STATE_PATH}" ]] && state_exists="true"
          echo "state_exists=${state_exists}" >> "${GITHUB_OUTPUT}"

          local_etag=""
          if [[ "${state_exists}" == "true" ]]; then
            local_etag="$(jq -r '.etag // empty' "${STATE_PATH}" 2>/dev/null | sed -E 's/^"//; s/"$//' || true)"
          fi
          echo "local_etag=${local_etag}" >> "${GITHUB_OUTPUT}"

          headers_file="$(mktemp)"
          if [[ -n "${local_etag}" ]]; then
            curl -sS -L -o /dev/null -D "${headers_file}" -H "If-None-Match: ${local_etag}" "${ESI_URL}" >/dev/null
          else
            curl -sS -L -o /dev/null -D "${headers_file}" "${ESI_URL}" >/dev/null
          fi

          remote_etag="$(grep -i '^etag:' "${headers_file}" | tail -1 \
            | sed -E 's/^[Ee][Tt][Aa][Gg]:[[:space:]]*//' | tr -d '\r' | sed -E 's/^"//; s/"$//' || true)"

          last_mod="$(grep -i '^last-modified:' "${headers_file}" | tail -1 \
            | sed -E 's/^[Ll]ast-[Mm]odified:[[:space:]]*//' | tr -d '\r' || true)"

          expires="$(grep -i '^expires:' "${headers_file}" | tail -1 \
            | sed -E 's/^[Ee]xpires:[[:space:]]*//' | tr -d '\r' || true)"

          [[ -z "${last_mod}" ]] && { echo "Missing Last-Modified header from ESI."; exit 1; }

          lm_epoch="$(date -u -d "${last_mod}" +%s)"
          lm_iso="$(date -u -d "@${lm_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          lm_serial="$(to_serial "${lm_epoch}")"

          if [[ -n "${expires}" ]]; then
            exp_epoch="$(date -u -d "${expires}" +%s)"
          else
            exp_epoch="$((lm_epoch + 3600))"
          fi
          exp_plus5_serial="$(to_serial "$((exp_epoch + 300))")"

          echo "remote_etag=${remote_etag}" >> "${GITHUB_OUTPUT}"
          echo "last_modified_iso=${lm_iso}" >> "${GITHUB_OUTPUT}"
          echo "last_modified_serial=${lm_serial}" >> "${GITHUB_OUTPUT}"
          echo "expires_plus5_serial=${exp_plus5_serial}" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 4) BigQuery ensure table (idempotente)
      # ============================================================
      - name: Ensure BigQuery table exists
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bq --project_id="${GCP_PROJECT_ID}" query --quiet --use_legacy_sql=false "
          CREATE TABLE IF NOT EXISTS \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\` (
            snapshot_ts TIMESTAMP NOT NULL,
            solarSystem STRING,
            npc_kills INT64,
            pod_kills INT64,
            ship_kills INT64
          )
          PARTITION BY DATE(snapshot_ts)
          CLUSTER BY solarSystem
          "

      # ============================================================
      # 5) Decide mode + update_state flag
      #    NUEVO: bq query con retries y log de stderr (diagnóstico tipo #794)
      # ============================================================
      - name: Decide mode (noop/full/reconcile/repair)
        if: ${{ steps.guard.outputs.proceed == 'true' }}
        id: mode
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          bq_query_csv_retry() {
            # $1 = SQL
            local sql="$1"
            local attempts=5
            local delay=2
            local out
            local rc

            for i in $(seq 1 "${attempts}"); do
              echo "bq query attempt ${i}/${attempts}..."
              set +e
              out="$(
                bq --project_id="${GCP_PROJECT_ID}" query --quiet --use_legacy_sql=false --format=csv --headless \
                  "${sql}" 2> bq_err.txt
              )"
              rc=$?
              set -e

              if [[ "${rc}" -eq 0 ]]; then
                echo "${out}"
                return 0
              fi

              echo "bq query failed (rc=${rc}). stderr:"
              sed -e 's/[[:cntrl:]]//g' bq_err.txt | tail -n 200 || true

              if [[ "${i}" -lt "${attempts}" ]]; then
                echo "Retrying in ${delay}s..."
                sleep "${delay}"
                delay="$((delay * 2))"
                [[ "${delay}" -gt 30 ]] && delay=30
              fi
            done

            echo "bq query failed after ${attempts} attempts."
            return 1
          }

          lm_iso="${{ steps.esi.outputs.last_modified_iso }}"
          local_etag="${{ steps.esi.outputs.local_etag }}"
          remote_etag="${{ steps.esi.outputs.remote_etag }}"
          state_exists="${{ steps.esi.outputs.state_exists }}"

          echo "DEBUG: lm_iso=${lm_iso}"
          echo "DEBUG: local_etag=${local_etag}"
          echo "DEBUG: remote_etag=${remote_etag}"
          echo "DEBUG: state_exists=${state_exists}"

          sql="SELECT COUNT(1) AS c
               FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
               WHERE snapshot_ts = TIMESTAMP('${lm_iso}')"

          snap_count="$(
            bq_query_csv_retry "${sql}" \
              | tr -d '\r' | tail -n 1 | tr -cd '0-9'
          )"
          snap_count="${snap_count:-0}"
          echo "DEBUG: snap_count=${snap_count}"

          mode="noop"
          if [[ "${snap_count}" == "0" ]]; then
            if [[ -z "${local_etag}" || "${local_etag}" != "${remote_etag}" ]]; then
              mode="full"
            else
              mode="repair"
            fi
          else
            if [[ -z "${local_etag}" || "${local_etag}" != "${remote_etag}" ]]; then
              mode="reconcile"
            else
              mode="noop"
            fi
          fi

          update_state="false"
          if [[ "${state_exists}" != "true" || -z "${local_etag}" || "${local_etag}" != "${remote_etag}" ]]; then
            update_state="true"
          fi

          printf 'mode=%s\n' "$mode" >> "${GITHUB_OUTPUT}"
          printf 'update_state=%s\n' "$update_state" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 6) Prepare load (download ESI + validate mapping + build ndjson)
      # ============================================================
      - name: Prepare load (download ESI + validate mapping + build ndjson)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.mode.outputs.mode != 'noop' }}
        id: prep
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ steps.mode.outputs.mode }}"
          lm_iso="${{ steps.esi.outputs.last_modified_iso }}"

          curl -sS -L "${ESI_URL}" -o esi_body.json

          gzip -cd "${SDE_SOLARSYSTEMS_GZ}" \
            | jq -s 'map({(.solarSystemID|tostring): .solarSystem}) | add' \
            > sde_map.json

          if [[ "${mode}" == "reconcile" ]]; then
            bq --project_id="${GCP_PROJECT_ID}" query --quiet --format=json --use_legacy_sql=false \
              "SELECT solarSystem
               FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.${BQ_TABLE}\`
               WHERE snapshot_ts = TIMESTAMP('${lm_iso}')" \
              | jq 'map(.solarSystem) | map({(.): true}) | add // {}' \
              > existing_map.json
          else
            echo '{}' > existing_map.json
          fi

          if [[ "${mode}" == "reconcile" ]]; then
            jq -c --arg ts "${lm_iso}" --slurpfile map sde_map.json --slurpfile exist existing_map.json '
              .[] |
              {
                snapshot_ts: $ts,
                solarSystem: ($map[0][(.system_id|tostring)] // error("missing solarSystem mapping for system_id=" + (.system_id|tostring))),
                npc_kills: (.npc_kills|tonumber),
                pod_kills: (.pod_kills|tonumber),
                ship_kills: (.ship_kills|tonumber)
              } |
              select( ($exist[0][.solarSystem] // false) | not )
            ' esi_body.json > load.ndjson
          else
            jq -c --arg ts "${lm_iso}" --slurpfile map sde_map.json '
              .[] |
              {
                snapshot_ts: $ts,
                solarSystem: ($map[0][(.system_id|tostring)] // error("missing solarSystem mapping for system_id=" + (.system_id|tostring))),
                npc_kills: (.npc_kills|tonumber),
                pod_kills: (.pod_kills|tonumber),
                ship_kills: (.ship_kills|tonumber)
              }
            ' esi_body.json > load.ndjson
          fi

          echo "load_lines=$(wc -l < load.ndjson | tr -d ' ')" >> "${GITHUB_OUTPUT}"
          echo "prepared=true" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 7) Sheets lock (fase inicial)
      # ============================================================
      - name: Sheets - initial lock (in_progress + next_run = now + LOCK_TIME)
        if: ${{ steps.guard.outputs.proceed == 'true' && (steps.mode.outputs.mode == 'noop' || steps.prep.outputs.prepared == 'true') }}
        id: sheets_lock
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          send_batch() {
            curl -sS -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "$1" >/dev/null
          }

          make_body_lock() {
            jq -n \
              --arg tab "${SHEET_TAB}" \
              --arg row "${SHEETS_WORKFLOW_ROW}" \
              --arg status "in_progress" \
              --argjson next_run "$1" \
              '{
                valueInputOption: "RAW",
                data: [
                  {range: ($tab + "!B" + $row), values: [[ $status ]]},
                  {range: ($tab + "!D" + $row), values: [[ $next_run ]]}
                ]
              }'
          }

          body="$(make_body_lock "${{ steps.boot.outputs.lock_serial }}")"
          send_batch "${body}"

          echo "locked=true" >> "${GITHUB_OUTPUT}"

      # ============================================================
      # 8) BigQuery load (single batch)
      #    NUEVO: retry + log stderr
      # ============================================================
      - name: BigQuery load (single batch)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.mode.outputs.mode != 'noop' && steps.prep.outputs.load_lines != '0' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          bq_load_retry() {
            local attempts=4
            local delay=3
            local rc

            for i in $(seq 1 "${attempts}"); do
              echo "bq load attempt ${i}/${attempts}..."
              set +e
              bq --project_id="${GCP_PROJECT_ID}" load --quiet \
                --source_format=NEWLINE_DELIMITED_JSON \
                "${BQ_DATASET}.${BQ_TABLE}" \
                load.ndjson \
                schema.json 2> bq_load_err.txt
              rc=$?
              set -e

              if [[ "${rc}" -eq 0 ]]; then
                echo "bq load OK."
                return 0
              fi

              echo "bq load failed (rc=${rc}). stderr:"
              sed -e 's/[[:cntrl:]]//g' bq_load_err.txt | tail -n 200 || true

              if [[ "${i}" -lt "${attempts}" ]]; then
                echo "Retrying in ${delay}s..."
                sleep "${delay}"
                delay="$((delay * 2))"
                [[ "${delay}" -gt 30 ]] && delay=30
              fi
            done

            echo "bq load failed after ${attempts} attempts."
            return 1
          }

          printf '%s' \
            '[{"name":"snapshot_ts","type":"TIMESTAMP","mode":"REQUIRED"},'\
            '{"name":"solarSystem","type":"STRING","mode":"NULLABLE"},'\
            '{"name":"npc_kills","type":"INT64","mode":"NULLABLE"},'\
            '{"name":"pod_kills","type":"INT64","mode":"NULLABLE"},'\
            '{"name":"ship_kills","type":"INT64","mode":"NULLABLE"}]' \
            > schema.json

          bq_load_retry

      # ============================================================
      # 9) Update state (commit etag)
      # ============================================================
      - name: Update state etag (commit to repo)
        if: ${{ steps.guard.outputs.proceed == 'true' && steps.sheets_lock.outputs.locked == 'true' && steps.mode.outputs.update_state == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${STATE_PATH}")"
          jq -n --arg etag "${{ steps.esi.outputs.remote_etag }}" '{etag: $etag}' > "${STATE_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${STATE_PATH}"
          git diff --cached --quiet && exit 0

          git commit -m "state: update system_kills etag"
          git pull --rebase
          git push

      # ============================================================
      # 10) Sheets finalize (fase final)
      # ============================================================
      - name: Sheets - finalize (status + next_run + optional last_modified)
        if: ${{ always() && steps.sheets_lock.outputs.locked == 'true' }}
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          send_batch() {
            curl -sS -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
              -d "$1" >/dev/null
          }

          make_body_finalize() {
            # $1=status, $2=next_run(serial), $3=include_last_modified(true/false), $4=last_modified(serial)
            if [[ "$3" == "true" ]]; then
              jq -n \
                --arg tab "${SHEET_TAB}" \
                --arg row "${SHEETS_WORKFLOW_ROW}" \
                --arg status "$1" \
                --argjson next_run "$2" \
                --argjson last_modified "$4" \
                '{
                  valueInputOption: "RAW",
                  data: [
                    {range: ($tab + "!B" + $row), values: [[ $status ]]},
                    {range: ($tab + "!D" + $row), values: [[ $next_run ]]},
                    {range: ($tab + "!I" + $row), values: [[ $last_modified ]]}
                  ]
                }'
            else
              jq -n \
                --arg tab "${SHEET_TAB}" \
                --arg row "${SHEETS_WORKFLOW_ROW}" \
                --arg status "$1" \
                --argjson next_run "$2" \
                '{
                  valueInputOption: "RAW",
                  data: [
                    {range: ($tab + "!B" + $row), values: [[ $status ]]},
                    {range: ($tab + "!D" + $row), values: [[ $next_run ]]}
                  ]
                }'
            fi
          }

          if [[ "${JOB_STATUS}" == "success" ]]; then
            status="completed"
            next_run="${{ steps.esi.outputs.expires_plus5_serial }}"
            if [[ "${{ steps.mode.outputs.update_state }}" == "true" ]]; then
              body="$(make_body_finalize "${status}" "${next_run}" "true" "${{ steps.esi.outputs.last_modified_serial }}")"
            else
              body="$(make_body_finalize "${status}" "${next_run}" "false" "0")"
            fi
          else
            status="failed"
            next_run="${{ steps.boot.outputs.fail_plus5_serial }}"
            body="$(make_body_finalize "${status}" "${next_run}" "false" "0")"
          fi

          send_batch "${body}"
