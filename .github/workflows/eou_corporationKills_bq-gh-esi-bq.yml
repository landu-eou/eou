#
# .
# ├── .github/
# │   └── workflows/
# │      └── eou_corporationKills_bq-gh-esi-bq.yml
# │         # Workflow principal:
# │         # - se lanza por workflow_dispatch
# │         # - autentica contra Google Cloud con WIF
# │         # - instala dependencias Python
# │         # - ejecuta el pipeline BQ -> ESI -> BQ
# │         # - versiona el state si hubo escritura real
# │         # - actualiza workflows!I9 en Google Sheets solo si el job termina en success
# │
# ├── requirements/
# │   └── eou_corporationKills_bq-gh-esi-bq.txt
# │      # Dependencias mínimas del pipeline:
# │      # - google-cloud-bigquery
# │      # - google-api-python-client
# │      # - requests
# │
# ├── sql/
# │   └── eou_corporationKills_bq-gh-esi-bq_ids.sql
# │      # SQL base para extraer todos los corporation_id únicos
# │      # desde la tabla fuente:
# │      # - hace UNNEST(corporationID)
# │      # - filtra NULL
# │      # - aplica DISTINCT
# │      # - ordena ASC por corporation_id
# │      # Usa placeholder {{SOURCE_TABLE}} para inyectar la tabla real desde env.
# │
# ├── scripts/
# │   └── esi/
# │      ├── eou_corporationKills_bq-gh-esi-bq_run.py
# │      │   # Orquestador principal del pipeline.
# │      │   # Flujo:
# │      │   # 1) lee IDs desde BigQuery
# │      │   # 2) resuelve nombres en ESI
# │      │   # 3) usa fallback desde la tabla actual si ESI deja huecos
# │      │   # 4) canonicaliza filas y calcula hash estable
# │      │   # 5) decide si reescribe o no la tabla destino
# │      │   # 6) actualiza el state solo si hubo escritura real
# │      │   # 7) publica outputs para GitHub Actions:
# │      │   #    - table_written
# │      │   #    - state_changed
# │      │   #    - resolved_count
# │      │   #    - unresolved_count
# │      │   #    - decision_reason
# │      │
# │      ├── eou_corporationKills_bq-gh-esi-bq_bq.py
# │      │   # Acceso a BigQuery.
# │      │   # Responsabilidades:
# │      │   # - crear el cliente
# │      │   # - cargar/renderizar la SQL
# │      │   # - leer corporation_id únicos desde gate_kills
# │      │   # - leer corporation_kills actual para fallback
# │      │   # - recrear la tabla final usando staging temporal
# │      │   # - permitir tabla final vacía con esquema correcto
# │      │
# │      ├── eou_corporationKills_bq-gh-esi-bq_esi.py
# │      │   # Resolución de nombres mediante ESI:
# │      │   # POST /latest/universe/names/?datasource=tranquility
# │      │   # Estrategia:
# │      │   # - requests.Session()
# │      │   # - User-Agent explícito
# │      │   # - lotes de hasta 1000 IDs
# │      │   # - pocos reintentos transitorios con backoff + jitter
# │      │   # - atención a X-ESI-Error-Limit-Remain / Reset
# │      │   # - si un lote devuelve 404, se divide recursivamente
# │      │   #   para aislar IDs problemáticos sin perder el resto
# │      │   # Devuelve:
# │      │   # - mapping resuelto {corporation_id: corporation}
# │      │   # - lista de unresolved_ids
# │      │
# │      ├── eou_corporationKills_bq-gh-esi-bq_hash.py
# │      │   # Canonicalización + hashing del dataset final.
# │      │   # El hash:
# │      │   # - se calcula sobre el dataset ya resuelto
# │      │   # - no sobre la lista de IDs
# │      │   # - ordena por corporation_id ASC
# │      │   # - serializa de forma estable
# │      │   # - produce SHA-256 determinista
# │      │
# │      ├── eou_corporationKills_bq-gh-esi-bq_state.py
# │      │   # Lectura y escritura del state persistente en GitHub.
# │      │   # Formato:
# │      │   # {
# │      │   #   "hash": "...",
# │      │   #   "last-modified": "YYYY-MM-DDTHH:MM:SSZ"
# │      │   # }
# │      │   # Significado:
# │      │   # - hash del último dataset realmente escrito en BigQuery
# │      │   # - fecha UTC del último volcado exitoso real
# │      │
# │      └── eou_corporationKills_bq-gh-esi-bq_log.py
# │          # Logger silencioso.
# │          # Se conserva para mantener la estructura del pipeline,
# │          # pero sin emitir salida visible innecesaria en el workflow.
# │
# └── states/
#    └── eou_corporationKills_bq-gh-esi-bq.json
#       # State persistente versionado en el repo.
#       # Solo se actualiza cuando hubo escritura real en BigQuery.
#       # Se commitea y pushea con manejo de non-fast-forward:
#       # - fetch
#       # - pull --rebase
#       # - reintentos de push
#
# BigQuery
# ├── Fuente:
# │   └── eou-ht.eou.gate_kills
# │      # Tabla fuente de verdad completa.
# │      # corporationID = ARRAY<STRUCT<corporation_id INT64>>
# │
# ├── Destino:
# │   └── eou-ht.eou.corporation_kills
# │      # Tabla derivada final:
# │      # - corporation_id INT64
# │      # - corporation STRING
# │
# └── Staging:
#    └── eou-ht.eou._stg_corporation_kills
#       # Nombre base de staging temporal usado durante la recreación.
#       # El script añade sufijo aleatorio para evitar colisiones entre tablas temporales.
#
# Google Sheets
# └── Spreadsheet: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
#    └── Tab: workflows
#       └── Celda: I9
#          # Se escribe solo al final del workflow y solo si el resultado global es success.
#          # Se envía como serial numérico de Google Sheets (UTC), no como texto.
#
# Regla funcional del pipeline
# ├── Siempre:
# │   # 1) leer IDs desde BigQuery fuente
# │   # 2) consultar ESI
# │   # 3) construir dataset final canónico
# │   # 4) calcular hash final
# │
# ├── Luego decidir escritura:
# │   # - force_refresh=true           -> escribir siempre
# │   # - missing_ids sin fallback     -> NO escribir
# │   # - state inexistente            -> escribir
# │   # - hash nuevo != hash previo    -> escribir
# │   # - hash igual y >55 días        -> escribir
# │   # - hash igual y <=55 días       -> NO escribir
# │
# └── Objetivo de la regla de 55 días:
#    # Renovar la tabla antes del vencimiento de 60 días de BigQuery Sandbox.
#

name: BQ Corporation Kills (BQ → GH → ESI → BQ)

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Recrear la tabla aunque el hash final sea idéntico"
        required: false
        type: boolean
        default: false
      source_run_id:
        description: "ID del run que disparó este workflow"
        required: false
        type: string
      source_workflow:
        description: "Nombre del workflow que disparó este workflow"
        required: false
        type: string

concurrency:
  group: eou_corporationKills_bq-gh-esi-bq
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_LOCATION: EU
      BQ_SOURCE_TABLE: eou-ht.eou.gate_kills
      BQ_TARGET_TABLE: eou-ht.eou.corporation_kills
      BQ_STAGING_TABLE: eou-ht.eou._stg_corporation_kills

      STATE_FILE: states/eou_corporationKills_bq-gh-esi-bq.json
      SQL_IDS_FILE: sql/eou_corporationKills_bq-gh-esi-bq_ids.sql

      FORCE_REFRESH: ${{ inputs.force_refresh && 'true' || 'false' }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_WORKFLOW: ${{ inputs.source_workflow }}

      ESI_USER_AGENT: "eou_corporationKills/1.0 (+https://github.com/landu-eou/eou)"

      SHEETS_SPREADSHEET_ID: "1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8"
      SHEETS_WORKFLOWS_TAB: "workflows"
      SHEETS_WORKFLOWS_SUCCESS_ROW: "9"
      SHEETS_WORKFLOWS_SUCCESS_COL: "I"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/eou_corporationKills_bq-gh-esi-bq.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements/eou_corporationKills_bq-gh-esi-bq.txt

      # Paso principal del pipeline:
      # 1) lee corporation_id desde BigQuery,
      # 2) resuelve nombres en ESI,
      # 3) decide si reescribe la tabla destino,
      # 4) actualiza el state local si hubo escritura real.
      - name: Build corporation_kills
        id: build
        run: |
          python scripts/esi/eou_corporationKills_bq-gh-esi-bq_run.py

      # El state solo se versiona cuando cambió de verdad tras una escritura real.
      - name: Commit state file
        if: steps.build.outputs.state_changed == 'true'
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$STATE_FILE"

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(states): update corporation_kills state"

          # Si otro workflow avanzó la rama, se hace fetch/rebase y se reintenta.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"

            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true

              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi

              sleep $((attempt * 2))
              continue
            fi

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 2))
          done

      # Esta marca temporal solo se escribe al final cuando el workflow ha sido success.
      - name: Update workflows sheet success timestamp
        if: success()
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os

          from google.auth import default
          from googleapiclient.discovery import build

          spreadsheet_id = os.environ["SHEETS_SPREADSHEET_ID"]
          sheet_tab = os.environ["SHEETS_WORKFLOWS_TAB"]
          row = os.environ["SHEETS_WORKFLOWS_SUCCESS_ROW"]
          col = os.environ["SHEETS_WORKFLOWS_SUCCESS_COL"]
          target_range = f"{sheet_tab}!{col}{row}"

          now_utc = datetime.now(timezone.utc)
          serial_epoch = datetime(1899, 12, 30, tzinfo=timezone.utc)
          serial_value = (now_utc - serial_epoch).total_seconds() / 86400.0

          credentials, _ = default(
              scopes=["https://www.googleapis.com/auth/spreadsheets"]
          )
          service = build(
              "sheets",
              "v4",
              credentials=credentials,
              cache_discovery=False,
          )

          body = {
              "valueInputOption": "RAW",
              "data": [
                  {
                      "range": target_range,
                      "majorDimension": "ROWS",
                      "values": [[serial_value]],
                  }
              ],
              "includeValuesInResponse": False,
          }

          service.spreadsheets().values().batchUpdate(
              spreadsheetId=spreadsheet_id,
              body=body,
          ).execute()
          PY
