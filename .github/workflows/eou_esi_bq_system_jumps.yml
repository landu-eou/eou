name: System Jumps (ESI → BQ)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Fuerza ejecución: ignora If-None-Match (puede reingestar el snapshot)"
        required: false
        default: "false"
      dry_run:
        description: "Solo prueba: no escribe en BigQuery ni commitea state"
        required: false
        default: "false"
  repository_dispatch:
    types: [esi_system_jumps]

permissions:
  contents: write
  id-token: write

concurrency:
  group: eou_esi_bq_system_jumps-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # --- requeridos por los orquestadores ---
      WORKFLOW_ID: eou_esi_bq_system_jumps
      WORKFLOW_NAME: "System Jumps (ESI -> BQ)"
      SHEET_ROW: "3"
      EXPIRES: "1200"
      LOCK_SECONDS: "120"

      # --- GCP / BQ ---
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou

      # --- ESI ---
      ESI_BASE_URL: https://esi.evetech.net/latest
      ESI_DATASOURCE: tranquility
      USER_AGENT: "landu-eou/eou (ESI system_jumps) contact: landueve78@gmail.com"

      # --- state en main ---
      STATE_PATH: eou/state/system_jumps.json

    steps:
      # -------------------------------------------------------------------
      # PRECHECK: validar que el gateway responde JSON correcto (robusto)
      # -------------------------------------------------------------------
      - name: Preflight (gateway)
        id: preflight
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          hdr="$tmp/hdr.txt"
          body="$tmp/body.txt"

          max=5
          i=1
          ok=0

          while (( i <= max )); do
            url="${GATEWAY_URL}?ping=1&nocache=$(date -u +%s%N)"

            http_code="$(curl -sS -L \
              --connect-timeout 5 --max-time 15 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -D "$hdr" -o "$body" -w "%{http_code}" \
              "$url" || true)"

            content_type="$(grep -i '^content-type:' "$hdr" | tail -n 1 | cut -d: -f2- | tr -d '\r' | xargs || true)"
            body_len="$(wc -c < "$body" | tr -d ' ' || true)"

            echo "Preflight attempt $i/$max: http_code=$http_code content_type='${content_type:-unknown}' body_len=${body_len:-0}"

            if [[ "$http_code" == "200" && "${body_len:-0}" -gt 0 ]]; then
              if head -c 200 "$body" | grep -qi '<html'; then
                echo "WARN: preflight returned HTML. Retrying..." >&2
              else
                python3 - <<'PY' < "$body"
import json,sys
j=json.load(sys.stdin)
assert j.get("service")=="eou_gateway_webapp", j
PY
                ok=1
                break
              fi
            fi

            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: gateway preflight failed after $max attempts" >&2
            echo "Last http_code=$http_code content_type='${content_type:-unknown}' body_len=${body_len:-0}" >&2
            echo "Body (first 200 chars):" >&2
            head -c 200 "$body" >&2 || true
            exit 1
          fi

      # -------------------------------------------------------------------
      # START: pedir lock al gateway (robusto + output started/locked)
      # -------------------------------------------------------------------
      - name: START (gateway lock)
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          max=5
          i=1
          ok=0
          locked="true"

          while (( i <= max )); do
            NOW_MS="$(date -u +%s%3N)"
            CONCLUSION="-"
            CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
            SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
            WF_NAME_ESC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"

            URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}&nocache=$(date -u +%s%N)"

            RESP="$(curl -sS -L \
              --connect-timeout 5 --max-time 20 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -H "Accept: application/json" \
              "$URL" || true)"

            if [[ -z "${RESP:-}" ]]; then
              echo "WARN: START empty response (attempt $i/$max). Retrying..." >&2
              sleep 1
              ((i++))
              continue
            fi

            locked="$(printf '%s' "$RESP" | python3 - <<'PY'
import json,sys
j=json.load(sys.stdin)
if not j.get("ok", False):
  raise SystemExit(2)
print("true" if j.get("locked", False) else "false")
PY
            )" || locked="PARSE_OR_NOT_OK"

            if [[ "$locked" == "true" || "$locked" == "false" ]]; then
              ok=1
              break
            fi

            echo "WARN: START bad response token='$locked' (attempt $i/$max). Retrying..." >&2
            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: START failed after $max attempts" >&2
            exit 1
          fi

          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

      # -------------------------------------------------------------------
      # DO WORK
      # -------------------------------------------------------------------
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install jq (needed by script)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run ingest (ESI → BQ)
        env:
          FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
        run: |
          bash eou/scripts/esi_system_jumps_to_bq.sh

      # -------------------------------------------------------------------
      # FINISH: SOLO si START ocurrió (y no estaba locked), robusto
      # -------------------------------------------------------------------
      - name: FINISH (gateway)
        if: always() && steps.start.outputs.started == 'true' && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          max=5
          i=1
          ok=0

          while (( i <= max )); do
            NOW_MS="$(date -u +%s%3N)"
            CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
            SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"
            WF_NAME_ESC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"

            URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}&nocache=$(date -u +%s%N)"

            RESP="$(curl -sS -L \
              --connect-timeout 5 --max-time 20 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -H "Accept: application/json" \
              "$URL" || true)"

            if [[ -z "${RESP:-}" ]]; then
              echo "WARN: FINISH empty response (attempt $i/$max). Retrying..." >&2
              sleep 1
              ((i++))
              continue
            fi

            python3 - <<'PY' < <(printf '%s' "$RESP") && ok=1 && break || true
import json,sys
j=json.load(sys.stdin)
assert j.get("ok", False), j
PY

            echo "WARN: FINISH non-ok response (attempt $i/$max). Retrying..." >&2
            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: FINISH failed after $max attempts" >&2
            exit 1
          fi
