name: Init pending_gate_kills file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty pending file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/rq
          gzip -n -c /dev/null > data/rq/pending_gate_kills.jsonl.gz

      - name: Commit & push (only if changed)
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/rq/pending_gate_kills.jsonl.gz; then
            echo "File already exists and is unchanged. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rq/pending_gate_kills.jsonl.gz
          git commit -m "init empty pending_gate_kills"
          git push
