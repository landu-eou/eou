name: Capture EVE SDE

on:
  schedule:
    - cron: "0 */12 * * *"
  repository_dispatch:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the snapshot even when the ETag is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: capture-sde
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Zstandard support
        run: python -m pip install --disable-pip-version-check zstandard

      - name: Download SDE and build one SQLite database per JSONL
        run: |
          if [ "$FORCE_SDE" = "true" ]; then
            python scripts/capture_sde.py --force
          else
            python scripts/capture_sde.py
          fi
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_SDE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Commit and push database and metadata
        run: |
          git add -A data/sde
          if git diff --cached --quiet; then
            echo "The SDE snapshot is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SDE SQLite snapshot"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          echo "Failed to push after multiple attempts."
          exit 1
