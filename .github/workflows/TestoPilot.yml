name: Add Autopilot Waypoints (polite pacing, wait reset)

on:
  workflow_dispatch:
    inputs:
      access_token:
        description: "ESI access_token (scope: esi-ui.write_waypoint.v1). Pégalo aquí (sin 'Bearer ')."
        required: true
        type: string
      clear_existing_waypoints:
        description: "Borrar waypoints existentes antes de insertar la ruta (solo en el primer destino)"
        required: true
        default: true
        type: boolean
      base_delay_ms:
        description: "Delay base entre inserciones (ms). Recomendado 700-1200 para ser respetuoso."
        required: true
        default: "900"
        type: string
      min_remain_threshold:
        description: "Si X-Esi-Error-Limit-Remain <= este valor, se espera al Reset (modo respetuoso)."
        required: true
        default: "10"
        type: string
      reset_padding_sec:
        description: "Segundos extra al esperar por Reset."
        required: true
        default: "2"
        type: string
      retry_after_padding_sec:
        description: "Segundos extra al respetar Retry-After."
        required: true
        default: "2"
        type: string
      max_retries:
        description: "Reintentos máximos por waypoint (solo para 429/420/5xx/transient)."
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: eou_add_waypoints_manual
  cancel-in-progress: false

jobs:
  add-waypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CHAR_ID: "2124070822"
      ROUTE_FILE: "test/routes_ap.txt"
      ESI_BASE: "https://esi.evetech.net/latest"
      USER_AGENT: "landu-eou/eou-waypoints-gha (manual-token; polite)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate route file exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${ROUTE_FILE}" ]]; then
            echo "ERROR: No existe ${ROUTE_FILE} en el repo."
            exit 1
          fi
          echo "OK: Encontrado ${ROUTE_FILE}"
          head -n 10 "${ROUTE_FILE}" || true

      - name: Add waypoints in order (polite pacing + wait reset)
        shell: bash
        env:
          ACCESS_TOKEN: ${{ inputs.access_token }}
          CLEAR_FIRST: ${{ inputs.clear_existing_waypoints }}
          BASE_DELAY_MS: ${{ inputs.base_delay_ms }}
          MIN_REMAIN: ${{ inputs.min_remain_threshold }}
          RESET_PAD: ${{ inputs.reset_padding_sec }}
          RA_PAD: ${{ inputs.retry_after_padding_sec }}
          MAX_RETRIES: ${{ inputs.max_retries }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ACCESS_TOKEN}"

          # Validaciones numéricas
          for v in BASE_DELAY_MS MIN_REMAIN RESET_PAD RA_PAD MAX_RETRIES; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: ${v} debe ser numérico. Valor recibido: ${!v}"
              exit 1
            fi
          done

          BASE_SLEEP_SEC="$(python3 - << 'PY'
          import os
          print(int(os.environ["BASE_DELAY_MS"]) / 1000)
          PY
          )"

          # Extrae header (case-insensitive) y devuelve el 2º token (valor)
          hdr_get() {
            local header_file="$1"
            local key="$2"
            awk -v k="${key}" 'BEGIN{IGNORECASE=1}
              $0 ~ ("^" k ":") {sub(/\r$/,""); print $2}
            ' "${header_file}" | tail -n 1 || true
          }

          # Si el error-limit budget es bajo, espera al reset (más padding)
          maybe_wait_reset() {
            local header_file="$1"
            local remain reset
            remain="$(hdr_get "${header_file}" "X-Esi-Error-Limit-Remain")"
            reset="$(hdr_get "${header_file}" "X-Esi-Error-Limit-Reset")"

            if [[ "${remain}" =~ ^[0-9]+$ && "${reset}" =~ ^[0-9]+$ ]]; then
              if (( remain <= MIN_REMAIN )); then
                local wait_sec=$(( reset + RESET_PAD ))
                echo "INFO: Error-limit bajo (Remain=${remain} <= ${MIN_REMAIN}). Esperando Reset: ${wait_sec}s (Reset=${reset}, pad=${RESET_PAD})."
                sleep "${wait_sec}"
              fi
            fi
          }

          # Espera siguiendo Retry-After, con padding (si existe)
          wait_retry_after_or_fallback() {
            local header_file="$1"
            local fallback_sec="$2"  # si no hay Retry-After
            local ra
            ra="$(hdr_get "${header_file}" "Retry-After")"
            if [[ "${ra}" =~ ^[0-9]+$ ]]; then
              local wait_sec=$(( ra + RA_PAD ))
              echo "INFO: Retry-After=${ra}s → sleep ${wait_sec}s (pad=${RA_PAD})."
              sleep "${wait_sec}"
            else
              echo "INFO: Sin Retry-After → sleep ${fallback_sec}s."
              sleep "${fallback_sec}"
            fi
          }

          post_waypoint_polite() {
            local dest_id="$1"
            local clear="$2"

            local url="${ESI_BASE}/ui/autopilot/waypoint/?add_to_beginning=false&clear_other_waypoints=${clear}&destination_id=${dest_id}"

            local attempt=0
            local fallback_wait=5  # espera conservadora si no hay Retry-After

            while (( attempt <= MAX_RETRIES )); do
              attempt=$((attempt+1))

              local hdr body code
              hdr="$(mktemp)"
              body="$(mktemp)"

              code="$(curl -sS -D "${hdr}" -o "${body}" -w '%{http_code}' -X POST "${url}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Accept: application/json" \
                -H "User-Agent: ${USER_AGENT}" || echo "000")"

              # Siempre chequea si conviene esperar al reset (si headers presentes)
              maybe_wait_reset "${hdr}"

              if [[ "${code}" == "204" ]]; then
                rm -f "${hdr}" "${body}"
                return 0
              fi

              # Auth / parámetros: fail-fast (no insistir)
              if [[ "${code}" == "401" || "${code}" == "403" || "${code}" == "400" ]]; then
                echo "ERROR: HTTP ${code} destination_id=${dest_id} (no reintento; revisa token/scope/ID)."
                if [[ -s "${body}" ]]; then
                  echo "Body (head):"
                  head -n 40 "${body}" || true
                fi
                rm -f "${hdr}" "${body}"
                return 1
              fi

              # Throttle / transient:
              if [[ "${code}" == "429" || "${code}" == "420" || "${code}" == "500" || "${code}" == "502" || "${code}" == "503" || "${code}" == "504" || "${code}" == "000" ]]; then
                echo "WARN: HTTP ${code} destination_id=${dest_id} attempt=${attempt}/${MAX_RETRIES}."

                # Si hay body, muestra una pista mínima
                if [[ -s "${body}" ]]; then
                  echo "Body (head):"
                  head -n 10 "${body}" || true
                fi

                # Estrategia "polite":
                # - Primero, si error-limit headers indican budget bajo, maybe_wait_reset ya habrá dormido.
                # - Luego, respeta Retry-After con padding; si no existe, espera fallback conservador.
                wait_retry_after_or_fallback "${hdr}" "${fallback_wait}"

                # Aumenta fallback_wait suavemente por si no hay Retry-After y sigue fallando.
                if (( fallback_wait < 30 )); then
                  fallback_wait=$(( fallback_wait + 5 ))
                fi

                rm -f "${hdr}" "${body}"
                continue
              fi

              echo "ERROR: HTTP ${code} inesperado destination_id=${dest_id} attempt=${attempt}/${MAX_RETRIES}"
              if [[ -s "${body}" ]]; then
                echo "Body (head):"
                head -n 40 "${body}" || true
              fi
              rm -f "${hdr}" "${body}"
              return 1
            done

            echo "ERROR: Superado max_retries=${MAX_RETRIES} para destination_id=${dest_id}"
            return 1
          }

          i=0
          cleared_once="false"

          echo "== Insertando waypoints para CHAR_ID=${CHAR_ID} desde ${ROUTE_FILE} =="
          echo "Delay base: ${BASE_DELAY_MS} ms (${BASE_SLEEP_SEC} s)"
          echo "Polite thresholds: MIN_REMAIN=${MIN_REMAIN}, RESET_PAD=${RESET_PAD}s, RA_PAD=${RA_PAD}s"
          echo "max_retries: ${MAX_RETRIES}"
          echo "clear_existing_waypoints (solo 1ª inserción): ${CLEAR_FIRST}"
          echo

          while IFS= read -r raw || [[ -n "${raw}" ]]; do
            line="${raw//$'\r'/}"
            line="$(echo "${line}" | xargs)"
            [[ -z "${line}" ]] && continue
            [[ "${line}" =~ ^# ]] && continue

            if ! [[ "${line}" =~ ^[0-9]+$ ]]; then
              echo "ERROR: Línea inválida (no numérica): '${line}'"
              exit 1
            fi

            dest_id="${line}"
            i=$((i+1))

            clear_flag="false"
            if [[ "${CLEAR_FIRST}" == "true" && "${cleared_once}" == "false" ]]; then
              clear_flag="true"
              cleared_once="true"
            fi

            echo "[$i] destination_id=${dest_id} clear_other_waypoints=${clear_flag}"

            if ! post_waypoint_polite "${dest_id}" "${clear_flag}"; then
              echo "ERROR: Falló la inserción del waypoint [$i] destination_id=${dest_id}"
              exit 1
            fi

            # Delay base "respetuoso" entre inserciones
            sleep "${BASE_SLEEP_SEC}"

          done < "${ROUTE_FILE}"

          if [[ "${i}" -eq 0 ]]; then
            echo "ERROR: No se encontraron destination_id válidos en ${ROUTE_FILE}"
            exit 1
          fi

          echo
          echo "OK: Insertados ${i} waypoints en orden."
