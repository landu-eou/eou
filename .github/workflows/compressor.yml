name: Compress JSONL to GZ

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "Path of the .jsonl file to compress"
        required: true
        default: "data/esi/packaged.jsonl"

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compress file
        run: |
          FILE="${{ github.event.inputs.file_path }}"

          if [ ! -f "$FILE" ]; then
            echo "File not found: $FILE"
            exit 1
          fi

          gzip -9 "$FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Compress ${{ github.event.inputs.file_path }} to .gz" || echo "No changes to commit"

          git pull --rebase origin main
          git push

