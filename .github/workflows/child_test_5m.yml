name: child_test_5m

on:
  workflow_dispatch:

# ====== FÁCIL DE EDITAR POR EL USUARIO ======
env:
  # Identificador del workflow (debe coincidir con lo que haya en workflows!A2 si lo validas en el gateway)
  WORKFLOW_ID: child_test_5m.yml

  # Fila fija en el tab 'workflows'
  ROW: "2"

  # expires (segundos). next_run final = now + EXPIRES
  EXPIRES: "300"

  # lock_until (segundos). evita solapes mientras corre
  LOCK_SECONDS: "1200"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1º: CRÍTICO nada más empezar el run
      - name: Mark start (set last_run + lock_until + status=in_progress)
        id: start
        shell: bash
        run: |
          set -euo pipefail

          resp="$(curl -sS -X POST "${{ secrets.SHEET_GATEWAY_URL }}?api=1" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg key "${{ secrets.SHEET_GATEWAY_KEY }}" \
              --arg action "start" \
              --arg workflow "${WORKFLOW_ID}" \
              --arg row "${ROW}" \
              --arg expires "${EXPIRES}" \
              --arg lock_seconds "${LOCK_SECONDS}" \
              '{key:$key, action:$action, workflow:$workflow, row:$row, expires:$expires, lock_seconds:$lock_seconds}' \
            )")"

          echo "$resp" > start.json

      # ... aquí va la lógica del workflow (muy simple para test)
      - name: Do work (test)
        run: |
          echo "Hello from child_test_5m"
          sleep 2

      # 3º: CRÍTICO lo último antes de finalizar (siempre, incluso si falla)
      - name: Mark end (set final next_run = now + expires)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          next_run="$(date -u -d "${now} + ${EXPIRES} seconds" +%Y-%m-%dT%H:%M:%SZ)"

          # job.status -> success|failure|cancelled
          conclusion="${{ job.status }}"

          curl -sS -X POST "${{ secrets.SHEET_GATEWAY_URL }}?api=1" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc \
              --arg key "${{ secrets.SHEET_GATEWAY_KEY }}" \
              --arg action "end" \
              --arg workflow "${WORKFLOW_ID}" \
              --arg row "${ROW}" \
              --arg expires "${EXPIRES}" \
              --arg status "completed" \
              --arg conclusion "${conclusion}" \
              --arg next_run "${next_run}" \
              '{key:$key, action:$action, workflow:$workflow, row:$row, expires:$expires, status:$status, conclusion:$conclusion, next_run:$next_run}' \
            )" >/dev/null
