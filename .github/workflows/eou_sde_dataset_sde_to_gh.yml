name: SDE Dataset (SDE → GH)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Fuerza ejecución: ignora If-None-Match (puede reingestar el snapshot)"
        required: false
        default: "false"
      dry_run:
        description: "Solo prueba: no escribe en BigQuery ni commitea state"
        required: false
        default: "false"
  repository_dispatch:
    types: [esi_system_jumps]

permissions:
  contents: write
  id-token: write

concurrency:
  group: eou_esi_bq_system_jumps-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_ID: eou_sde_dataset_sde_to_gh
      WORKFLOW_NAME: "SDE Dataset (SDE -> GH)"
      SHEET_ROW: "3"
      EXPIRES: "300"
      LOCK_SECONDS: "160"

      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BQ_DATASET: eou

      ESI_BASE_URL: https://esi.evetech.net/latest
      ESI_DATASOURCE: tranquility
      USER_AGENT: "landu-eou/eou (ESI system_jumps) contact: landueve78@gmail.com"

      STATE_PATH: eou/state/system_jumps.json

    steps:
      - name: Install jq (gateway parsing)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      # ------------------------------------------------------------
      # Preflight: gateway healthcheck (robusto)
      # ------------------------------------------------------------
      - name: Preflight (gateway)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail

          max=5
          i=1
          ok=0

          while (( i <= max )); do
            url="${GATEWAY_URL}?ping=1&nocache=$(date -u +%s%N)"
            resp="$(curl -sS -L \
              --connect-timeout 5 --max-time 15 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -H "Accept: application/json" \
              "$url" || true)"

            if [[ -n "${resp:-}" ]]; then
              service="$(printf '%s' "$resp" | jq -r '.service // empty' 2>/dev/null || true)"
              if [[ "$service" == "eou_gateway_webapp" ]]; then
                ok=1
                break
              fi
              echo "WARN: preflight got non-matching service='$service' (attempt $i/$max)" >&2
            else
              echo "WARN: preflight empty response (attempt $i/$max)" >&2
            fi

            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: gateway preflight failed after $max attempts" >&2
            exit 1
          fi

      # ------------------------------------------------------------
      # START: lock (robusto) -> outputs locked/started
      # ------------------------------------------------------------
      - name: START (gateway lock)
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          max=5
          i=1
          ok=0
          locked="true"

          # URL-encode del nombre con jq (sin python)
          WF_NAME_ESC="$(jq -rn --arg s "$WORKFLOW_NAME" '$s|@uri')"

          while (( i <= max )); do
            NOW_MS="$(date -u +%s%3N)"
            CONCLUSION="-"
            CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
            SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

            URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}&nocache=$(date -u +%s%N)"

            resp="$(curl -sS -L \
              --connect-timeout 5 --max-time 20 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -H "Accept: application/json" \
              "$URL" || true)"

            if [[ -z "${resp:-}" ]]; then
              echo "WARN: START empty response (attempt $i/$max). Retrying..." >&2
              sleep 1
              ((i++))
              continue
            fi

            ok_field="$(printf '%s' "$resp" | jq -r '.ok // empty' 2>/dev/null || true)"
            if [[ "$ok_field" != "true" ]]; then
              echo "WARN: START gateway ok!=true (attempt $i/$max). Retrying..." >&2
              sleep 1
              ((i++))
              continue
            fi

            locked_field="$(printf '%s' "$resp" | jq -r '.locked // false' 2>/dev/null || true)"
            if [[ "$locked_field" == "true" ]]; then
              locked="true"
              ok=1
              break
            elif [[ "$locked_field" == "false" ]]; then
              locked="false"
              ok=1
              break
            fi

            echo "WARN: START bad locked field='$locked_field' (attempt $i/$max). Retrying..." >&2
            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: START failed after $max attempts" >&2
            exit 1
          fi

          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Exit if locked
        if: steps.start.outputs.locked == 'true'
        run: exit 0

      # ------------------------------------------------------------
      # DO WORK
      # ------------------------------------------------------------
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run ingest (ESI → BQ)
        env:
          FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
        run: |
          bash scripts/system_jumps_esi_to_bq.sh

      # ------------------------------------------------------------
      # FINISH: solo si START ocurrió y no estaba locked
      # ------------------------------------------------------------
      - name: FINISH (gateway)
        if: always() && steps.start.outputs.started == 'true' && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success) CONCLUSION="success" ;;
            failure) CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *) CONCLUSION="neutral" ;;
          esac

          max=5
          i=1
          ok=0
          WF_NAME_ESC="$(jq -rn --arg s "$WORKFLOW_NAME" '$s|@uri')"

          while (( i <= max )); do
            NOW_MS="$(date -u +%s%3N)"
            CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
            SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

            URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ESC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}&nocache=$(date -u +%s%N)"

            resp="$(curl -sS -L \
              --connect-timeout 5 --max-time 20 \
              --retry 2 --retry-all-errors --retry-delay 1 \
              -H "Accept: application/json" \
              "$URL" || true)"

            if [[ -z "${resp:-}" ]]; then
              echo "WARN: FINISH empty response (attempt $i/$max). Retrying..." >&2
              sleep 1
              ((i++))
              continue
            fi

            ok_field="$(printf '%s' "$resp" | jq -r '.ok // empty' 2>/dev/null || true)"
            if [[ "$ok_field" == "true" ]]; then
              ok=1
              break
            fi

            echo "WARN: FINISH ok!=true (attempt $i/$max). Retrying..." >&2
            sleep 1
            ((i++))
          done

          if [[ "$ok" != "1" ]]; then
            echo "ERROR: FINISH failed after $max attempts" >&2
            exit 1
          fi
