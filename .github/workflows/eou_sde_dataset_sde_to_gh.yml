name: SDE Dataset (SDE → GH)

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force refresh (ignore etag comparison) and treat as updated for Sheets"
        required: false
        type: boolean
        default: false

concurrency:
  group: eou_sde_dataset_sde_to_gh
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      WORKFLOW_FILE: eou_sde_dataset_sde_to_gh.yml

      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "4"

      LOCK_TIME: 120

      SDE_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip

    steps:
      # =====================================================================
      # 1) GUARD — salir si hay solapamiento / runs duplicados
      # =====================================================================
      - name: Guard - compute decision
        id: guard_calc
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "$proceed" > /tmp/proceed

      - name: Guard - publish decision
        id: guard
        run: |
          echo "proceed=$(cat /tmp/proceed)" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 2) AUTH GOOGLE — WIF/OIDC
      # =====================================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets

      # =====================================================================
      # 3) BUSY EXIT
      # =====================================================================
      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # =====================================================================
      # 4) LOCK INICIAL (Sheets)
      # =====================================================================
      - name: Initial lock (in_progress + next_run as value)
        if: steps.guard.outputs.proceed == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # =====================================================================
      # 5) OBJETIVO — SDE → repo
      # =====================================================================
      - name: Checkout
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Headers robustos: follow redirects y tomar el último bloque HTTP
      - name: Fetch remote SDE headers (ETag + Last-Modified)
        if: steps.guard.outputs.proceed == 'true'
        id: sde_headers
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            -L -D "$tmp" -o /dev/null \
            "${SDE_URL}"

          etag="$(
            awk '
              BEGIN { IGNORECASE=1; etag=""; }
              /^HTTP\// { etag=""; }
              /^ETag:/  { sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/\r/, "", $0); etag=$0; }
              END { print etag; }
            ' "$tmp"
          )"

          lm="$(
            awk '
              BEGIN { IGNORECASE=1; lm=""; }
              /^HTTP\// { lm=""; }
              /^Last-Modified:/ { sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/\r/, "", $0); lm=$0; }
              END { print lm; }
            ' "$tmp"
          )"

          if [ -z "$etag" ] || [ -z "$lm" ]; then
            echo "Missing ETag/Last-Modified headers after redirects" >&2
            echo "---- headers (tail) ----" >&2
            tail -n 60 "$tmp" >&2 || true
            exit 1
          fi

          lm_epoch="$(date -u -d "$lm" +%s)"

          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          echo "last_modified=$lm" >> "$GITHUB_OUTPUT"
          echo "last_modified_epoch=$lm_epoch" >> "$GITHUB_OUTPUT"

      - name: Read local state (states/sde.json)
        if: steps.guard.outputs.proceed == 'true'
        id: sde_state
        run: |
          set -euo pipefail

          if [ -f "states/sde.json" ]; then
            etag_local="$(jq -r '.etag // ""' states/sde.json 2>/dev/null || echo "")"
          else
            etag_local=""
          fi

          echo "etag_local=$etag_local" >> "$GITHUB_OUTPUT"

      - name: Decide whether to refresh SDE outputs
        if: steps.guard.outputs.proceed == 'true'
        id: sde_decide
        run: |
          set -euo pipefail

          force="${{ github.event.inputs.force_refresh }}"
          if [ "$force" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "forced=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote="${{ steps.sde_headers.outputs.etag }}"
          local="${{ steps.sde_state.outputs.etag_local }}"

          needs_update="false"
          if [ -z "$local" ] || [ "$local" != "$remote" ]; then
            needs_update="true"
          fi

          echo "needs_update=$needs_update" >> "$GITHUB_OUTPUT"
          echo "forced=false" >> "$GITHUB_OUTPUT"

      - name: Build SDE outputs (JSONL.GZ)
        if: steps.guard.outputs.proceed == 'true' && steps.sde_decide.outputs.needs_update == 'true'
        id: sde_build
        run: |
          set -euo pipefail

          mkdir -p .tmp/sde .tmp/sde/out
          mkdir -p data/sde states

          echo "Downloading SDE ZIP..."
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            -L -o .tmp/sde/sde.zip \
            "${SDE_URL}"

          echo "Building outputs..."
          python scripts/sde/eou_sde_dataset_sde_to_gh_outputs.py \
            --zip .tmp/sde/sde.zip \
            --out .tmp/sde/out

          # Actualiza states/sde.json con el ETag remoto de forma segura (sin Python)
          jq -n --arg etag "${{ steps.sde_headers.outputs.etag }}" '{etag:$etag}' > states/sde.json

          # Reemplazo atómico "de una sola vez"
          for f in regions constellations solarsystems stations stargates types; do
            mv -f ".tmp/sde/out/${f}.jsonl.gz" "data/sde/${f}.jsonl.gz"
          done

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push (single commit)
        if: steps.guard.outputs.proceed == 'true' && steps.sde_build.outputs.updated == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sde/*.jsonl.gz states/sde.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "SDE: refresh datasets"
          git pull --rebase --autostash
          git push

      # =====================================================================
      # 6) FINALIZE — status + next_run + last_modified (solo si updated/forced)
      # =====================================================================
      - name: Finalize (completed)
        if: steps.guard.outputs.proceed == 'true' && success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          UPDATED: ${{ steps.sde_build.outputs.updated }}
          FORCED: ${{ steps.sde_decide.outputs.forced }}
          LM_EPOCH: ${{ steps.sde_headers.outputs.last_modified_epoch }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          now_epoch="$(date -u +%s)"
          now_hour="$(date -u +%H)"

          t_hms="$(date -u -d "@$((${LM_EPOCH}+1800))" +%H:%M:%S)"
          today="$(date -u +%Y-%m-%d)"
          cand_epoch="$(date -u -d "${today}T${t_hms}Z" +%s)"
          if [ "$cand_epoch" -le "$now_epoch" ]; then
            cand_epoch="$(date -u -d "${today}T${t_hms}Z +1 day" +%s)"
          fi

          did_update="false"
          if [ "${UPDATED:-}" = "true" ] || [ "${FORCED:-}" = "true" ]; then
            did_update="true"
          fi

          if [ "$did_update" = "true" ]; then
            next_epoch="$cand_epoch"
          else
            if [ "$now_hour" -ge 10 ] && [ "$now_hour" -lt 15 ]; then
              next_epoch="$((now_epoch + 3600))"
            else
              next_epoch="$cand_epoch"
            fi
          fi

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"
          lm_serial="$(awk "BEGIN { printf \"%.10f\", (${LM_EPOCH}/86400) + 25569 }")"

          if [ "$did_update" = "true" ]; then
            payload="{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${next_serial}]]},
                {\"range\":\"${SHEET_TAB}!I${row}:I${row}\",\"values\":[[${lm_serial}]]}
              ]
            }"
          else
            payload="{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${next_serial}]]}
              ]
            }"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "$payload"

      - name: Finalize (failed)
        if: steps.guard.outputs.proceed == 'true' && failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          LM_EPOCH: ${{ steps.sde_headers.outputs.last_modified_epoch }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          now_epoch="$(date -u +%s)"
          now_hour="$(date -u +%H)"

          t_hms="$(date -u -d "@$((${LM_EPOCH}+1800))" +%H:%M:%S)"
          today="$(date -u +%Y-%m-%d)"
          cand_epoch="$(date -u -d "${today}T${t_hms}Z" +%s)"
          if [ "$cand_epoch" -le "$now_epoch" ]; then
            cand_epoch="$(date -u -d "${today}T${t_hms}Z +1 day" +%s)"
          fi

          if [ "$now_hour" -ge 10 ] && [ "$now_hour" -lt 15 ]; then
            next_epoch="$((now_epoch + 3600))"
          else
            next_epoch="$cand_epoch"
          fi

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}:B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}:D${row}\",\"values\":[[${next_serial}]]}
              ]
            }"
