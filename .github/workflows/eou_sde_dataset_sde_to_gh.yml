# -----------------------------------------------------------------------------
# File tree used by this workflow (SDE → GH)
#
# .github/
#   workflows/
#     eou_sde_dataset_sde_to_gh.yml
#
# scripts/
#   sde/
#     eou_sde_dataset_sde_to_gh_outputs.py
#     eou_sde_dataset_sde_to_gh_io.py
#     eou_sde_dataset_sde_to_gh_names.py
#     eou_sde_dataset_sde_to_gh_cynodock.py
#
# data/
#   sde/
#     regions.jsonl.gz
#     constellations.jsonl.gz
#     solarsystems.jsonl.gz
#     stations.jsonl.gz
#     stargates.jsonl.gz
#     types.jsonl.gz
#     corporations.jsonl.gz
#
# states/
#   sde.json
# -----------------------------------------------------------------------------

name: SDE Dataset (SDE → GH)

on:
  # Disparo manual (lo llama tu cron externo vía workflow_dispatch)
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Forzar refresh aunque el ETag no cambie (se trata como updated=true para Sheets)"
        required: false
        type: boolean
        default: false

# Candado oficial de GitHub: evita ejecución paralela del mismo workflow.
# cancel-in-progress:false => el nuevo run NO cancela al que está trabajando; el guard de abajo evita colas “inútiles”.
concurrency:
  group: eou_sde_dataset_sde_to_gh
  cancel-in-progress: false

permissions:
  # Necesario para consultar runs del workflow vía REST API (guard)
  actions: read
  # Necesario para hacer commit/push de outputs + state
  contents: write
  # Necesario para OIDC/WIF (Google auth)
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # Identidad del workflow (para consultar runs del mismo .yml)
      WORKFLOW_FILE: eou_sde_dataset_sde_to_gh.yml

      # Google Sheets (estado compartido)
      SHEETS_ID: 1fnoPr1HoO6RuQxoFY_jUVc8yTfiGa0yZ-WaxgOwWJe8
      SHEET_TAB: workflows
      SHEETS_WORKFLOW_ROW: "4"

      # “Lock” inicial: next_run = now + LOCK_TIME
      LOCK_TIME: 120

      # SDE oficial (CCP) — short-hand que redirige al ZIP final
      SDE_URL: https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip

    steps:
      # =====================================================================
      # 0) Guard anti-cola / anti-solapamiento
      # =====================================================================
      - name: Guard (skip duplicates)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WF_FILE: ${{ env.WORKFLOW_FILE }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          proceed="true"

          this="$(jq --arg rid "$RUN_ID" -c '
            (.workflow_runs // [])
            | map(select(.id == ($rid|tonumber)))
            | .[0] // empty
          ' <<< "$json")"

          if [ -n "$this" ]; then
            this_created="$(jq -r '.created_at' <<< "$this")"
            this_num="$(jq -r '.run_number' <<< "$this")"

            # ¿Había un run anterior “vivo” cuando se creó este?
            alive_at_creation="$(jq --arg rid "$RUN_ID" --arg tc "$this_created" '
              (.workflow_runs // [])
              | map(
                  select(.id != ($rid|tonumber))
                  | select(.created_at < $tc)
                  | select(.updated_at > $tc)
                )
              | length
            ' <<< "$json")"

            if [ "$alive_at_creation" -gt 0 ]; then
              proceed="false"
            else
              # Si hay cola: el líder es el menor run_number entre queued/in_progress
              leader="$(jq '
                (.workflow_runs // [])
                | map(select(.status=="queued" or .status=="in_progress"))
                | map(.run_number)
                | min // empty
              ' <<< "$json")"

              if [ -n "$leader" ] && [ "$leader" != "$this_num" ]; then
                proceed="false"
              fi
            fi
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Exit if skipped (busy)
        if: steps.guard.outputs.proceed != 'true'
        run: |
          echo "Skipped due to overlapping run"
          exit 0

      # =====================================================================
      # 1) Auth Google (WIF/OIDC) para escribir estado en Sheets
      # =====================================================================
      - name: Auth to Google (WIF)
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets

      # =====================================================================
      # 2) Lock inicial en Sheets (in_progress + next_run=now+LOCK_TIME)
      # =====================================================================
      - name: Sheets - initial lock
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          epoch="$(date -u -d "+${LOCK_TIME} seconds" +%s)"
          # Serial Sheets: epoch/86400 + 25569 (base 1899-12-30)
          serial="$(awk "BEGIN { printf \"%.10f\", (${epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}\",\"values\":[[\"in_progress\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}\",\"values\":[[${serial}]]}
              ]
            }"

      # =====================================================================
      # 3) Checkout + Python
      # =====================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================================
      # 4) Leer headers del SDE final (ETag + Last-Modified)
      # =====================================================================
      - name: SDE - fetch headers (etag + last-modified)
        id: sde_headers
        run: |
          set -euo pipefail

          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            -L -D "$tmp" -o /dev/null \
            "${SDE_URL}"

          etag="$(
            awk '
              BEGIN { IGNORECASE=1; etag=""; }
              /^HTTP\// { etag=""; }
              /^ETag:/  { sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/\r/, "", $0); etag=$0; }
              END { print etag; }
            ' "$tmp"
          )"

          lm="$(
            awk '
              BEGIN { IGNORECASE=1; lm=""; }
              /^HTTP\// { lm=""; }
              /^Last-Modified:/ { sub(/^[^:]*:[[:space:]]*/, "", $0); gsub(/\r/, "", $0); lm=$0; }
              END { print lm; }
            ' "$tmp"
          )"

          if [ -z "$etag" ] || [ -z "$lm" ]; then
            echo "Missing ETag/Last-Modified headers after redirects" >&2
            exit 1
          fi

          lm_epoch="$(date -u -d "$lm" +%s)"

          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          echo "last_modified_epoch=$lm_epoch" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 5) Decisión de update
      # =====================================================================
      - name: Decide update (etag compare or force)
        id: decide
        run: |
          set -euo pipefail

          force="${{ github.event.inputs.force_refresh }}"
          if [ "$force" = "true" ]; then
            echo "needs_update=true"  >> "$GITHUB_OUTPUT"
            echo "forced=true"       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote="${{ steps.sde_headers.outputs.etag }}"

          local=""
          if [ -f "states/sde.json" ]; then
            local="$(jq -r '.etag // ""' states/sde.json 2>/dev/null || echo "")"
          fi

          if [ -z "$local" ] || [ "$local" != "$remote" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "forced=false" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # 6) Build (solo si needs_update=true)
      # =====================================================================
      - name: Build outputs (SDE → data/sde/*.jsonl.gz)
        if: steps.decide.outputs.needs_update == 'true'
        id: build
        run: |
          set -euo pipefail

          mkdir -p .tmp/sde/out data/sde states

          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            -L -o .tmp/sde/sde.zip \
            "${SDE_URL}"

          python scripts/sde/eou_sde_dataset_sde_to_gh_outputs.py \
            --zip .tmp/sde/sde.zip \
            --out .tmp/sde/out

          # state: persistimos el ETag que acabamos de volcar correctamente
          jq -n --arg etag "${{ steps.sde_headers.outputs.etag }}" '{etag:$etag}' > states/sde.json

          # replace: sobrescritura única (evita commits parciales)
          for f in regions constellations solarsystems stations stargates types corporations; do
            mv -f ".tmp/sde/out/${f}.jsonl.gz" "data/sde/${f}.jsonl.gz"
          done

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push (single commit)
        if: steps.build.outputs.updated == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sde/*.jsonl.gz states/sde.json
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "SDE: refresh datasets"
          git pull --rebase --autostash
          git push

      # =====================================================================
      # 7) Finalize (Sheets)
      # =====================================================================
      - name: Sheets - finalize (completed)
        if: success()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          UPDATED: ${{ steps.build.outputs.updated }}
          FORCED: ${{ steps.decide.outputs.forced }}
          LM_EPOCH: ${{ steps.sde_headers.outputs.last_modified_epoch }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          now_epoch="$(date -u +%s)"
          now_hour="$(date -u +%H)"

          # cand_epoch = próxima fecha futura con hh:mm:ss = (last_modified + 30m)
          t_hms="$(date -u -d "@$((${LM_EPOCH}+1800))" +%H:%M:%S)"
          today="$(date -u +%Y-%m-%d)"
          cand_epoch="$(date -u -d "${today}T${t_hms}Z" +%s)"
          if [ "$cand_epoch" -le "$now_epoch" ]; then
            cand_epoch="$(date -u -d "${today}T${t_hms}Z +1 day" +%s)"
          fi

          did_update="false"
          if [ "${UPDATED:-}" = "true" ] || [ "${FORCED:-}" = "true" ]; then
            did_update="true"
          fi

          if [ "$did_update" = "true" ]; then
            next_epoch="$cand_epoch"
          else
            if [ "$now_hour" -ge 10 ] && [ "$now_hour" -lt 15 ]; then
              next_epoch="$((now_epoch + 3600))"
            else
              next_epoch="$cand_epoch"
            fi
          fi

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"
          lm_serial="$(awk "BEGIN { printf \"%.10f\", (${LM_EPOCH}/86400) + 25569 }")"

          if [ "$did_update" = "true" ]; then
            payload="{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}\",\"values\":[[${next_serial}]]},
                {\"range\":\"${SHEET_TAB}!I${row}\",\"values\":[[${lm_serial}]]}
              ]
            }"
          else
            payload="{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}\",\"values\":[[\"completed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}\",\"values\":[[${next_serial}]]}
              ]
            }"
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "$payload"

      - name: Sheets - finalize (failed)
        if: failure()
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          LM_EPOCH: ${{ steps.sde_headers.outputs.last_modified_epoch }}
        run: |
          set -euo pipefail
          row="${SHEETS_WORKFLOW_ROW}"

          now_epoch="$(date -u +%s)"
          now_hour="$(date -u +%H)"

          t_hms="$(date -u -d "@$((${LM_EPOCH}+1800))" +%H:%M:%S)"
          today="$(date -u +%Y-%m-%d)"
          cand_epoch="$(date -u -d "${today}T${t_hms}Z" +%s)"
          if [ "$cand_epoch" -le "$now_epoch" ]; then
            cand_epoch="$(date -u -d "${today}T${t_hms}Z +1 day" +%s)"
          fi

          if [ "$now_hour" -ge 10 ] && [ "$now_hour" -lt 15 ]; then
            next_epoch="$((now_epoch + 3600))"
          else
            next_epoch="$cand_epoch"
          fi

          next_serial="$(awk "BEGIN { printf \"%.10f\", (${next_epoch}/86400) + 25569 }")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}/values:batchUpdate" \
            -d "{
              \"valueInputOption\":\"RAW\",
              \"data\":[
                {\"range\":\"${SHEET_TAB}!B${row}\",\"values\":[[\"failed\"]]},
                {\"range\":\"${SHEET_TAB}!D${row}\",\"values\":[[${next_serial}]]}
              ]
            }"
