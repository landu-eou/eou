name: SDE Dataset (SDE → GH)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if ETag unchanged (true/false)"
        required: false
        default: "false"
  repository_dispatch:
    types: [eou_sde_dataset_sde_to_gh]

concurrency:
  group: eou_sde_dataset_sde_to_gh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WORKFLOW_ID: eou_sde_dataset_sde_to_gh
      WORKFLOW_NAME: "SDE Dataset (SDE -> GH)"
      SHEET_ROW: "3"

      # Valor por defecto “grande” de expires si faltase algo (fallback)
      EXPIRES: "86400"

      # Candado anti-solape (segundos). SOLO para lock_until.
      LOCK_SECONDS: "60"

      SDE_URL: "https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip"
      OUT_DIR: "data/gh_sde"
      META_PATH: "data/gh_sde/eou_sde_dataset_sde_to_gh.json"

      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight (gateway)
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          curl -sS -L "$GATEWAY_URL" | jq -e '.service=="eou_gateway_webapp"' >/dev/null

      - name: START (gateway lock)
        id: start
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail
          NOW_MS="$(date -u +%s%3N)"
          CONCLUSION="-"

          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|start|${EXPIRES}|${LOCK_SECONDS}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          WF_NAME_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=start&expires=${EXPIRES}&lock_seconds=${LOCK_SECONDS}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null

          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on START: $RESP"
            exit 1
          fi

          LOCKED="$(echo "$RESP" | jq -r '.locked // false')"
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"
          echo "Gateway lock status: locked=$LOCKED"

      - name: Build / Update datasets (SDE -> repo)
        if: steps.start.outputs.locked != 'true'
        id: build
        shell: bash
        run: |
          set -euo pipefail
          echo "FORCE_REBUILD=$FORCE_REBUILD"
          bash ops/gh_sde/eou_sde_dataset_sde_to_gh.sh

      - name: Commit changes (only if updated)
        if: steps.start.outputs.locked != 'true' && steps.build.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gh_sde
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(gh_sde): update SDE mappings"
          git push

      - name: FINISH (gateway)
        if: always() && steps.start.outputs.locked != 'true'
        shell: bash
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          case "$STATUS" in
            success)   CONCLUSION="success" ;;
            failure)   CONCLUSION="failure" ;;
            cancelled) CONCLUSION="cancelled" ;;
            *)         CONCLUSION="neutral" ;;
          esac

          NOW_MS="$(date -u +%s%3N)"

          # --- Scheduling / expires ---
          # Regla especial: en failure, reintentar pronto (15 minutos).
          if [[ "$CONCLUSION" == "failure" ]]; then
            EXPIRES_SEC="900"
          else
            # Usamos expires_sec calculado en el script (robusto).
            EXPIRES_SEC="${{ steps.build.outputs.expires_sec }}"
            if [[ -z "${EXPIRES_SEC:-}" ]]; then
              EXPIRES_SEC="${EXPIRES}"
            fi
          fi

          # --- Lock release ---
          # Para “liberar” inmediatamente al terminar, enviamos lock_seconds=0 en FINISH.
          LOCK_SECONDS_FINISH="0"

          CANONICAL="${WORKFLOW_ID}|${WORKFLOW_NAME}|${SHEET_ROW}|finish|${EXPIRES_SEC}|${LOCK_SECONDS_FINISH}|${CONCLUSION}|${NOW_MS}"
          SIG="$(printf "%s" "$CANONICAL" | openssl dgst -sha256 -hmac "$GATEWAY_SECRET" -hex | awk '{print $2}')"

          WF_NAME_ENC="$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['WORKFLOW_NAME']))")"
          URL="${GATEWAY_URL}?workflow_id=${WORKFLOW_ID}&wf_name=${WF_NAME_ENC}&row=${SHEET_ROW}&phase=finish&expires=${EXPIRES_SEC}&lock_seconds=${LOCK_SECONDS_FINISH}&conclusion=${CONCLUSION}&now_ms=${NOW_MS}&sig=${SIG}"

          RESP="$(curl -sS -L -H "Accept: application/json" "$URL")"
          echo "$RESP" | jq -e . >/dev/null

          OK="$(echo "$RESP" | jq -r '.ok // false')"
          if [[ "$OK" != "true" ]]; then
            echo "Gateway error on FINISH: $RESP"
            exit 1
          fi

      - name: Locked - no-op
        if: steps.start.outputs.locked == 'true'
        run: |
          echo "Locked=true => no-op. Not running build/commit/finish."
          exit 0
